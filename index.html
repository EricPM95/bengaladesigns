<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="%MARCA_COLOR_TEMA%" />
    <meta name="description" content="%MARCA_LEMA%" />
    <!-- Tipografías: Geist, Geist Mono e Instrument Serif (la app) y Bodoni Moda, solo en 400 y 500 (el logo de la marca). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Bodoni+Moda:wght@400;500&display=swap" rel="stylesheet" />
    <title>%MARCA_NOMBRE%</title>
  </head>
  <body>
    <!-- La pantalla al abrir (I2; Tanda 10: la de la marca, Marca 02 · 01 de Design): el logo grande, el lema y la ruta de puntos, sobre el marfil. Sale unos 2 segundos solo al abrir la app (no en cada recarga de dentro) y un toque la salta;
         la quita main.tsx. El nombre, el lema y el logo salen de data/marca.json y de shared/marca/logoJutrip.js (plugin de vite.config.ts). -->
    <div id="apertura" aria-hidden="true" style="position:fixed;inset:0;z-index:2147483000;background:radial-gradient(circle at 50% 36%,#FFFFFF,%MARCA_COLOR_APERTURA% 55%,#E7D9BC);color:#1C2230;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s">
      <div style="display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:-6vh">
        %MARCA_LOGO%
        <span data-lema style="font:500 11px 'Geist Mono',monospace;letter-spacing:.34em;padding-left:.34em;color:#8E6820;text-transform:uppercase;text-align:center">%MARCA_LEMA%</span>
      </div>
      <svg width="390" height="120" viewBox="0 0 390 120" style="position:absolute;left:50%;bottom:60px;transform:translateX(-50%);max-width:100vw" fill="none"><path d="M20 90Q120 20 210 70T370 30" stroke="#B58A2E" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 9"/><circle cx="20" cy="90" r="5" fill="#B58A2E"/><circle cx="370" cy="30" r="5" stroke="#B58A2E" stroke-width="2"/></svg>
    </div>
    <script>
      // Solo al abrir la app: si esta pestaña ya la abrió (por ejemplo, la recarga de después de entrar en la cuenta), no vuelve a salir.
      try {
        var almacen = window.sessionStorage
        if (almacen.getItem('jutrip:apertura')) document.getElementById('apertura').remove()
        else almacen.setItem('jutrip:apertura', '1')
      } catch (e) {
        /* sin almacenamiento: sale siempre */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
