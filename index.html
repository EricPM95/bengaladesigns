<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- (V32) El cambio de dirección: con `VITE_APP_URL_NUEVA=https://jutrip.app` en Vercel (se pone cuando el dominio ya funciona), quien entra por la dirección vieja (bengaladesigns.vercel.app) o por www va a la nueva, conservando la ruta, lo de después del ? y lo de después del #
         (el regreso de entrar con Google y los enlaces de invitación). Sin esa variable no hace NADA: la app sirve igual en las dos direcciones. Solo cambia páginas; las llamadas al servidor (/api/*, el webhook de Stripe) no pasan por aquí. -->
    <script>
      ;(function () {
        try {
          var nueva = '%VITE_APP_URL_NUEVA%'
          if (nueva.indexOf('https://') !== 0) return
          var viejas = ['bengaladesigns.vercel.app', 'www.' + nueva.replace('https://', '')]
          if (viejas.indexOf(location.hostname) === -1) return
          location.replace((nueva.slice(-1) === '/' ? nueva.slice(0, -1) : nueva) + location.pathname + location.search + location.hash)
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="%MARCA_COLOR_TEMA%" />
    <meta name="description" content="%MARCA_LEMA%" />
    <!-- Tipografías: Geist, Geist Mono e Instrument Serif (la app) e Italiana (el logo nuevo de la marca, la palabra del nombre). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Italiana&display=swap" rel="stylesheet" />
    <title>%MARCA_NOMBRE%</title>
  </head>
  <body>
    <!-- La pantalla al abrir (I2; Tanda 10E: la de la marca, «02 · 01 · Apertura» de la marca de Design): el marfil con su luz, el logo que entra, la línea que se escribe y la ruta de puntos. Sale en CADA apertura de la app (Tanda 10G: desde el navegador, desde el icono
         de la pantalla de inicio y al volver otro día), dura 3,5 segundos, se ve entera y nada la corta (ni un toque); la quita main.tsx cuando ACABA su animación. El lema y el logo salen de data/marca.json y de shared/marca/ (plugin de vite.config.ts). -->
    <div id="apertura" aria-hidden="true" style="position:fixed;inset:0;z-index:2147483000;overflow:hidden;background:radial-gradient(circle at 50% 36%,#FFFFFF,%MARCA_COLOR_APERTURA% 55%,#E7D9BC);color:#1C2230;transition:opacity .35s">
      %MARCA_APERTURA%
    </div>
    <script>
      // Sale siempre. Única excepción: la recarga que hace la propia app justo después de entrar en la cuenta o de unirse a un viaje (src/lib/recargarSinApertura.ts deja la marca): para que no salga dos veces seguidas.
      try {
        var almacen = window.sessionStorage
        if (almacen.getItem('jutrip:sin-apertura')) {
          almacen.removeItem('jutrip:sin-apertura')
          document.getElementById('apertura').remove()
        } else if (/(^|[?&#])(code|access_token|error|error_code)=/i.test(window.location.search + '&' + window.location.hash)) {
          // Tanda 10K: la vuelta de Google (con la sesión, el código o un error en la dirección) tampoco pone la pantalla de inicio: la persona ya la vio al abrir la app y se acaba de ir y volver.
          document.getElementById('apertura').remove()
        }
      } catch (e) {
        /* sin almacenamiento: sale siempre */
      }
    </script>
    <script>
      // (V40B) EL SONIDO DE LA APERTURA. Aquí solo se anota CUÁNDO EMPEZÓ la animación (para que el sonido entre en el punto en que va) y se escucha el primer toque: en el iPhone el audio solo se desbloquea con un toque, y el toque puede llegar
      // antes de que cargue la app. Si llega antes, aquí mismo se crea y se desbloquea el audio (dentro del toque) y la app lo recoge después; si la app ya está, avisa a su función (`cb`), que sigue dentro del toque.
      // Nada de esto corta ni salta la apertura. Termina cuando la apertura acaba (main.tsx pone `fin`).
      ;(function () {
        var w = window
        var ap = document.getElementById('apertura')
        if (!ap) return
        var a = (w.__ap = { t0: performance.now(), fin: false, ctx: null, cb: null })
        document.addEventListener('animationstart', function (e) { if (!a.vistoInicio && ap.contains(e.target)) { a.vistoInicio = true; a.t0 = e.timeStamp } }, true)
        var alToque = function () {
          if (a.fin) return
          try {
            if (a.cb) a.cb()
            else {
              var C = w.AudioContext || w.webkitAudioContext
              if (C) {
                if (!a.ctx) {
                  try { if (navigator.audioSession) navigator.audioSession.type = 'ambient' } catch (e) {}
                  a.ctx = new C()
                }
                a.ctx.resume()
                var s = a.ctx.createBufferSource(); s.buffer = a.ctx.createBuffer(1, 1, 22050); s.connect(a.ctx.destination); s.start(0)
              }
            }
          } catch (e) { /* sin audio */ }
        }
        a.alToque = alToque
        var eventos = ['touchend', 'click', 'pointerup', 'keydown']
        for (var i = 0; i < eventos.length; i++) document.addEventListener(eventos[i], alToque, { capture: true, passive: true })
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
