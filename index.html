<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="%MARCA_COLOR_TEMA%" />
    <meta name="description" content="%MARCA_LEMA%" />
    <!-- Tipografías: Geist, Geist Mono e Instrument Serif (la app) e Italiana (el logo nuevo de la marca, la palabra del nombre). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Italiana&display=swap" rel="stylesheet" />
    <title>%MARCA_NOMBRE%</title>
  </head>
  <body>
    <!-- La pantalla al abrir (I2; Tanda 10E: la de la marca, «02 · 01 · Apertura» de la marca de Design): el marfil con su luz, el logo que entra, la línea que se escribe y la ruta de puntos. Sale UNA vez, unos 2,5 segundos,
         solo al abrir la app (no en cada recarga de dentro) y un toque la salta; la quita main.tsx. El lema y el logo salen de data/marca.json y de shared/marca/ (plugin de vite.config.ts). -->
    <div id="apertura" aria-hidden="true" style="position:fixed;inset:0;z-index:2147483000;overflow:hidden;background:radial-gradient(circle at 50% 36%,#FFFFFF,%MARCA_COLOR_APERTURA% 55%,#E7D9BC);color:#1C2230;transition:opacity .35s">
      %MARCA_APERTURA%
    </div>
    <script>
      // Solo al abrir la app: si esta pestaña ya la abrió (por ejemplo, la recarga de después de entrar en la cuenta), no vuelve a salir.
      try {
        var almacen = window.sessionStorage
        if (almacen.getItem('jutrip:apertura')) document.getElementById('apertura').remove()
        else almacen.setItem('jutrip:apertura', '1')
      } catch (e) {
        /* sin almacenamiento: sale siempre */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
