<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E7DCC6;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
a{color:oklch(0.55 0.15 45)}a:hover{color:#1C2230}
@keyframes fly{0%{left:4%;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:88%;opacity:0}}
@keyframes twk{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="min-height:100vh;background:radial-gradient(ellipse 70% 60% at 50% 35%,#F1E8D6 0%,#E0D3BA 75%);padding:48px 40px;display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:flex-start;font-family:'Geist',system-ui,sans-serif;color:#1C2230">
<sc-for list="{{ opts }}" as="o" hint-placeholder-count="2">
  <div id="{{ o.id }}" style="display:flex;flex-direction:column;gap:12px">
    <span style="align-self:flex-start;font:600 12px 'Geist Mono',monospace;padding:4px 10px;border-radius:999px;background:#1C2230;color:#F3EEE4">{{ o.label }}</span>
    <div data-screen-label="{{ o.label }}" style="width:390px;border-radius:26px;background:#FFFDF8;border:1px solid rgba(28,34,48,.1);box-shadow:0 1px 2px rgba(28,34,48,.05),0 20px 50px -30px rgba(60,40,10,.45)">
      <div style="display:flex;align-items:center;gap:12px;padding:16px 12px 14px 16px">
        <span style="width:40px;height:40px;flex:none;border-radius:12px;background:#1C2230;color:#F3EEE4;display:flex;align-items:center;justify-content:center;font:400 22px/1 'Instrument Serif',serif">1</span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
          <span style="font:500 10px 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(28,34,48,.5)">Día 1</span>
          <span style="font:400 23px/1.05 'Instrument Serif',serif">Barcelona → Roma</span>
          <span style="font:500 12px 'Geist';color:oklch(0.55 0.17 40)">Día de viaje</span>
        </span>
        <span style="width:38px;height:38px;border-radius:50%;border:1px solid rgba(28,34,48,.14);background:#fff;color:rgba(28,34,48,.6);font:700 13px/36px 'Geist';text-align:center;letter-spacing:1px">···</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(28,34,48,.45)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(90deg)"><path d="M9 6l6 6-6 6"></path></svg>
      </div>
      <div style="border-top:1px dashed rgba(28,34,48,.12);padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px">
        <span style="font:400 12px 'Geist';color:rgba(28,34,48,.6)">Hoy el sol se pone a las 16:40</span>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);border-radius:16px;background:#F1EADC">
          <span style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 4px"><span style="font:400 22px/1 'Instrument Serif',serif">14</span><span style="font:500 9px 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(28,34,48,.55)">Paradas</span></span>
          <span style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 4px;border-left:1px solid rgba(28,34,48,.1)"><span style="font:400 22px/1 'Instrument Serif',serif">14,2</span><span style="font:500 9px 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(28,34,48,.55)">Km a pie</span></span>
          <span style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 4px;border-left:1px solid rgba(28,34,48,.1)"><span style="font:400 22px/1 'Instrument Serif',serif">6 h 50</span><span style="font:500 9px 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(28,34,48,.55)">De actividad</span></span>
        </div>

        <sc-if value="{{ o.isA }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ o.hotel }}" style="height:56px;border-radius:16px;border:1px solid {{ o.hBd }};background:{{ o.hBg }};display:flex;align-items:center;gap:12px;padding:0 12px 0 10px;text-align:left;cursor:pointer;color:#1C2230;transition:background .4s,border-color .4s">
            <span style="position:relative;width:36px;height:36px;flex:none;border-radius:11px;background:linear-gradient(160deg,#2A3350,#1C2230);overflow:hidden">
              <span style="position:absolute;right:7px;top:7px;width:11px;height:11px;border-radius:50%;box-shadow:-3px 2px 0 0 oklch(0.86 0.1 85)"></span>
              <span style="position:absolute;left:7px;top:9px;width:2px;height:2px;border-radius:50%;background:#fff;animation:twk 2.4s infinite"></span>
              <span style="position:absolute;left:13px;top:15px;width:1.5px;height:1.5px;border-radius:50%;background:#fff;animation:twk 3.1s .8s infinite"></span>
              <span style="position:absolute;left:5px;right:5px;bottom:6px;height:8px;border-radius:3px 3px 1px 1px;background:#F3EEE4"></span>
              <span style="position:absolute;left:8px;bottom:13px;width:8px;height:4px;border-radius:2px;background:#fff"></span>
            </span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
              <span style="font:500 13.5px 'Geist';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ o.hTitle }}</span>
              <span style="display:flex;align-items:center;gap:6px">
                <span style="display:flex;gap:3px">
                  <sc-for list="{{ o.nights }}" as="n" hint-placeholder-count="4"><span style="width:14px;height:4px;border-radius:3px;background:{{ n }};transition:background .4s"></span></sc-for>
                </span>
                <span style="font:400 11px 'Geist';color:rgba(28,34,48,.55)">{{ o.hSub }}</span>
              </span>
            </span>
            <span style="font:600 12px 'Geist';color:{{ o.hCta }};white-space:nowrap">{{ o.hAct }}</span>
          </button>

          <button onClick="{{ o.flight }}" style="position:relative;height:64px;border-radius:16px;border:none;background:#1C2230;display:flex;align-items:stretch;padding:0;text-align:left;cursor:pointer;color:#F3EEE4;overflow:hidden;box-shadow:0 14px 26px -16px rgba(28,34,48,.8)">
            <span style="position:absolute;left:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,oklch(0.8 0.14 70 / .22),transparent 65%)"></span>
            <span style="position:relative;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 10px 0 16px">
              <span style="font:600 9.5px 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:oklch(0.8 0.14 70)">{{ o.fEye }}</span>
              <span style="display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px">
                <span style="font:400 20px/1 'Instrument Serif',serif">BCN</span>
                <span style="position:relative;height:14px">
                  <span style="position:absolute;left:0;right:0;top:7px;border-top:1.5px dashed rgba(243,238,228,.3)"></span>
                  <span style="position:absolute;top:0;width:14px;height:14px;margin-left:-7px;color:oklch(0.8 0.14 70);animation:{{ o.flyAnim }};left:{{ o.planeL }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M21 15.5v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V8.5l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-6z" transform="rotate(90 12 12)"></path></svg></span>
                </span>
                <span style="font:400 20px/1 'Instrument Serif',serif;color:{{ o.fToC }}">{{ o.fTo }}</span>
              </span>
            </span>
            <span style="position:relative;width:92px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:{{ o.fStubBg }};color:{{ o.fStubFg }};transition:background .4s">
              <span style="position:absolute;left:-1px;top:6px;bottom:6px;border-left:1.5px dashed rgba(28,34,48,.35)"></span>
              <span style="position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:#FFFDF8"></span>
              <span style="position:absolute;left:-7px;bottom:-7px;width:14px;height:14px;border-radius:50%;background:#FFFDF8"></span>
              <span style="font:{{ o.fStubF }}">{{ o.fStub1 }}</span>
              <span style="font:600 9px 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;opacity:.75">{{ o.fStub2 }}</span>
            </span>
          </button>
        </sc-if>

        <sc-if value="{{ o.isB }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ o.hotel }}" style="height:48px;border-radius:14px;border:none;background:transparent;display:flex;align-items:center;gap:10px;padding:0 4px;text-align:left;cursor:pointer;color:#1C2230">
            <span style="width:30px;height:30px;flex:none;border-radius:50%;border:1.5px solid {{ o.hRing }};color:{{ o.hRing }};display:flex;align-items:center;justify-content:center;transition:border-color .4s,color .4s"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6M3 18h18M3 21v-3M21 21v-3M7 10V7a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v3"></path></svg></span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;white-space:nowrap">
              <span style="font:italic 400 17px/1.1 'Instrument Serif',serif;overflow:hidden;text-overflow:ellipsis">{{ o.hTitle }}</span>
              <span style="font:400 11px 'Geist';color:rgba(28,34,48,.5)">{{ o.hSub }}</span>
            </span>
            <span style="width:28px;height:28px;flex:none;border-radius:50%;background:{{ o.hBtnBg }};color:{{ o.hBtnFg }};display:flex;align-items:center;justify-content:center;font:500 16px/1 'Geist';transition:background .4s">{{ o.hMark }}</span>
          </button>
          <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(28,34,48,.12),transparent)"></div>
          <button onClick="{{ o.flight }}" style="position:relative;height:60px;border-radius:16px;border:1px solid {{ o.fBd }};background:linear-gradient(100deg,oklch(0.97 0.03 230),#FFFFFF 55%);display:flex;align-items:center;gap:12px;padding:0 8px 0 0;text-align:left;cursor:pointer;color:#1C2230;overflow:hidden;box-shadow:0 10px 22px -16px oklch(0.45 0.1 240 / .6)">
            <span style="position:relative;width:58px;height:100%;flex:none;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);background:linear-gradient(160deg,oklch(0.55 0.12 240),oklch(0.4 0.1 250));color:#fff;display:flex;align-items:center;padding-left:14px">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5L12 16l-4-4-5 1.5-1-1 5-3.5L6 4l1.5-1 4 4.5L18 2a2 2 0 0 1 3 3l-5.5 6.5 4.5 4-1 1.5-5-1-3.5 5z"></path></svg>
            </span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
              <span style="font:600 9.5px 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:oklch(0.45 0.1 240);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ o.fEyeB }}</span>
              <span style="font:400 17px/1.05 'Instrument Serif',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ o.fMain }}</span>
            </span>
            <span style="flex:none;height:36px;padding:0 14px;border-radius:999px;background:{{ o.fBtnBg }};color:#fff;display:flex;align-items:center;gap:6px;font:600 12.5px 'Geist';white-space:nowrap;transition:background .4s">{{ o.fBtn }}</span>
          </button>
        </sc-if>

        <span style="font:400 11px 'Geist';color:rgba(28,34,48,.45);text-align:center;padding-top:2px">Toca los bloques para ver el estado completado</span>
      </div>
    </div>
  </div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state={h:{a:false,b:false},f:{a:false,b:false}};
  renderVals(){const s=this.state;
    const tg=(k,id)=>()=>this.setState(st=>({[k]:{...st[k],[id]:!st[k][id]}}));
    const mk=(id,label)=>{const h=s.h[id],f=s.f[id];return{id:id==='a'?'1a':'1b',label,isA:id==='a',isB:id==='b',hotel:tg('h',id),flight:tg('f',id),
      hTitle:h?'Hotel en Prati':'Añade alojamiento en Roma',hSub:h?'4 de 4 noches':'0/4 noches por planificar',
      nights:[0,1,2,3].map(()=>h?'oklch(0.55 0.11 150)':'rgba(28,34,48,.14)'),
      hBg:h?'oklch(0.97 0.025 150)':'#FBF7EF',hBd:h?'oklch(0.55 0.11 150 / .3)':'rgba(28,34,48,.08)',hCta:h?'oklch(0.45 0.1 150)':'oklch(0.52 0.15 45)',hAct:h?'✓ Listo':'Añadir',
      hRing:h?'oklch(0.55 0.11 150)':'rgba(28,34,48,.4)',hBtnBg:h?'oklch(0.55 0.11 150)':'#F1EADC',hBtnFg:h?'#fff':'oklch(0.52 0.15 45)',hMark:h?'✓':'+',
      fEye:f?'Llegada · Fiumicino':'Llegada · Avión desde Barcelona',fTo:f?'FCO':'¿?',fToC:f?'#F3EEE4':'rgba(243,238,228,.45)',
      flyAnim:f?'none':'fly 3.2s cubic-bezier(.5,0,.5,1) infinite',planeL:f?'100%':'4%',
      fStubBg:f?'oklch(0.55 0.11 150)':'oklch(0.8 0.14 70)',fStubFg:f?'#fff':'#1C2230',fStub1:f?'11:20':'+ Vuelo',fStubF:f?"400 22px/1 'Instrument Serif',serif":"600 13px 'Geist'",fStub2:f?'✓ Llega':'Añadir',
      fEyeB:f?'Llegada · Fiumicino':'Llegada · desde Barcelona',fMain:f?'Llegas a las 11:20 · libre 13:20':'Añade tu vuelo y ajustamos el día',fBd:f?'oklch(0.55 0.11 150 / .4)':'oklch(0.55 0.12 240 / .25)',fBtnBg:f?'oklch(0.55 0.11 150)':'oklch(0.5 0.13 245)',fBtn:f?'✓ 11:20':'+ Vuelo'};};
    return{opts:[mk('a','1a · Billete nocturno'),mk('b','1b · Línea y pase azul')]};
  }
}
</script>
</body>
</html>
