<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>body{margin:0;background:#E7DCC6}*{box-sizing:border-box}@keyframes avDown{0%{transform:translateY(-70px);opacity:0}100%{transform:translateY(0);opacity:1}}@keyframes avUp{0%{transform:translateY(60px);opacity:0}100%{transform:translateY(0);opacity:1}}</style>
</helmet>
<div style="min-height:100vh;background:radial-gradient(ellipse 70% 30% at 50% 0%,#F1E8D6 0%,#E0D3BA 75%);padding:40px 48px 80px;font-family:'Geist',sans-serif;color:#1C2230;display:flex;flex-direction:column;gap:28px">
  <div style="display:flex;flex-direction:column;gap:6px"><span style="font:600 10px 'Geist Mono',monospace;letter-spacing:.16em;color:rgba(28,34,48,.55)">APP · AVISOS</span><span style="font:400 40px/1 'Instrument Serif',serif">Abajo, lo que puedes deshacer. Arriba, lo que solo te informa.</span></div>
  <div style="display:grid;grid-template-columns:repeat(3,390px);gap:44px;align-items:start;justify-content:start">
  <sc-for list="{{ boards }}" as="b" hint-placeholder-count="3">
    <div style="display:flex;flex-direction:column;gap:12px;width:390px">
      <span style="font:600 11px 'Geist Mono',monospace;letter-spacing:.08em;color:#6F4E37">{{ b.id }} · {{ b.cap }}</span>
      <div style="position:relative;width:375px;height:812px;flex:none;border-radius:48px;overflow:hidden;background:#F5EFE4;box-shadow:0 0 0 10px #1C2230,0 0 0 11px #3a3f4a,0 40px 100px -20px rgba(60,40,10,.45);display:flex;flex-direction:column">
        <span style="position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#0E1118;z-index:40"></span>
        <div style="flex:none;height:56px"></div>
        <div style="flex:none;height:56px;padding:0 18px 0 20px;display:flex;align-items:center;justify-content:space-between;background:#F5EFE4;position:relative;z-index:30"><span style="font:400 26px/1 'Instrument Serif',serif;letter-spacing:.32em;color:#B58A2E">JUTRIP</span><span style="display:flex;align-items:center;gap:14px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2230" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 7l12-3v3M16 13h2"></path></svg><span style="position:relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2230" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M10 20a2 2 0 0 0 4 0"></path></svg><span style="position:absolute;right:-2px;top:-2px;width:8px;height:8px;border-radius:50%;background:oklch(0.55 0.17 5)"></span></span><span style="width:36px;height:36px;border-radius:50%;background:#1C2230;box-shadow:0 0 0 2px #FBF3E2,0 0 0 3.5px #B58A2E;display:flex;align-items:center;justify-content:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFDF8" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span></span></div>
        <sc-if value="{{ b.top }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;left:12px;right:12px;top:112px;z-index:35;animation:avDown .45s ease-out both;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 12px;border-radius:18px;background:#FFFDF8;border:1px solid rgba(181,138,46,.7);box-shadow:0 14px 26px -14px rgba(60,40,10,.45)">
            <span style="width:32px;height:32px;border-radius:50%;flex:none;background:#F3E6C4;display:flex;align-items:center;justify-content:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6E5018" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ b.ic }}"></path></svg></span>
            <span style="flex:1;min-width:0;font:500 13.5px/1.35 'Geist';color:#1C2230">{{ b.tx }}</span>
            <span style="flex:none;height:30px;padding:0 12px;border-radius:999px;border:1px solid rgba(181,138,46,.6);background:#FBF3E2;display:flex;align-items:center;font:700 12.5px 'Geist';color:#4A3510">Ver</span>
          </div>
          <span style="position:absolute;left:50%;top:106px;transform:translateX(-50%);width:36px;height:4px;border-radius:2px;background:rgba(28,34,48,.15);z-index:34;display:none"></span>
        </sc-if>
        <div style="flex:1;min-height:0;position:relative;padding:12px 16px 0;display:flex;flex-direction:column;gap:12px">
          <div style="flex:none;height:150px;border-radius:24px;position:relative;overflow:hidden;background:linear-gradient(160deg,#C9A27A,#7A4E2E 60%,#3E2A1C)"><span style="position:absolute;left:18px;bottom:14px;font:400 30px/1 'Instrument Serif',serif;color:#FFFDF8">Plaza de España</span></div>
          <div style="flex:none;border-radius:24px;background:#FFFDF8;border:1px solid rgba(28,34,48,.07);padding:14px 16px;display:flex;flex-direction:column;gap:10px">
            <span style="font:600 15px 'Geist'">Tu día · 0 de 4 hechas</span>
            <sc-for list="{{ stops }}" as="s" hint-placeholder-count="4"><div style="display:flex;align-items:center;gap:12px"><span style="width:40px;height:40px;border-radius:12px;flex:none;background:{{ s.bg }}"></span><span style="font:600 14.5px 'Geist'">{{ s.n }}</span></div></sc-for>
          </div>
        </div>
        <sc-if value="{{ b.bot }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;left:12px;right:12px;bottom:84px;z-index:35;animation:avUp .45s ease-out both;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:#1C2230;color:#FFFDF8"><span style="flex:1;font:500 14px/1.35 'Geist'">Parada saltada · la tienes en Lugares pendientes</span><span style="font:700 14px 'Geist';color:#F3D88F">Deshacer</span></div>
        </sc-if>
        <div style="position:absolute;left:0;right:0;bottom:0;height:96px;z-index:4;background:linear-gradient(180deg,rgba(245,239,228,0),#F5EFE4 55%)"></div>
        <div style="position:absolute;left:12px;right:12px;bottom:14px;z-index:5"><dc-import name="Piezas/Barra JUTRIP" tone="tinta" act="0" hint-size="100%,64px"></dc-import></div>
      </div>
      <span style="font:400 14px/1.45 'Geist';color:rgba(28,34,48,.72);max-width:375px;text-wrap:pretty">{{ b.note }}</span>
    </div>
  </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const CLOCK='M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',INFO='M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v5M12 8h.01';
    return{stops:[{n:'Comida · Armando al Pantheon',bg:'#F1E6C4'},{n:'Via della Conciliazione',bg:'linear-gradient(150deg,#9DB4D8,#5A6EA0)'},{n:'Castillo de Sant\'Angelo',bg:'linear-gradient(150deg,#C9A27A,#3E5A7A)'},{n:'Piazza Navona',bg:'linear-gradient(150deg,#E0B890,#7A4E2E)'}],
      boards:[
        {id:'A1',cap:'Informa, con una parada · arriba',top:true,bot:false,ic:CLOCK,tx:'Los Museos Vaticanos y Capilla Sixtina ya han cerrado: los tienes en Lugares pendientes',note:'Sale debajo de la cabecera, se va solo a los 5 segundos o deslizándolo hacia arriba. No tapa el menú ni los botones.'},
        {id:'A2',cap:'Informa, con varias · se juntan en uno',top:true,bot:false,ic:CLOCK,tx:'3 sitios ya han cerrado a esta hora: los tienes en Lugares pendientes',note:'Nunca más de uno a la vez.'},
        {id:'A3',cap:'Con [Deshacer] · abajo, como ahora',top:false,bot:true,ic:INFO,tx:'',note:'Oscuro y sobre el menú: es lo único que se puede deshacer.'}
      ]};
  }
}
</script>
</body>
</html>
