<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>body{margin:0;background:#E7DCC6}*{box-sizing:border-box}</style>
</helmet>
<div style="min-height:100vh;background:radial-gradient(ellipse 70% 30% at 50% 0%,#F1E8D6 0%,#E0D3BA 75%);padding:40px 48px 80px;font-family:'Geist',sans-serif;color:#1C2230;display:flex;flex-direction:column;gap:28px">
  <div style="display:flex;flex-direction:column;gap:6px"><span style="font:600 10px 'Geist Mono',monospace;letter-spacing:.16em;color:rgba(28,34,48,.55)">APP · HOY · COMIDA Y CENA</span><span style="font:400 40px/1 'Instrument Serif',serif">Hora de comer y de cenar</span></div>
  <div style="display:grid;grid-template-columns:repeat(3,390px);gap:52px 44px;align-items:start;justify-content:start">
  <sc-for list="{{ boards }}" as="b" hint-placeholder-count="3">
    <div style="display:flex;flex-direction:column;gap:12px;width:390px">
      <span style="font:600 11px 'Geist Mono',monospace;letter-spacing:.08em;color:#6F4E37">{{ b.id }} · {{ b.cap }}</span>
      <sc-if value="{{ b.card }}" hint-placeholder-val="{{ true }}">
      <div style="position:relative;width:375px;height:812px;flex:none;border-radius:48px;overflow:hidden;background:#F5EFE4;box-shadow:0 0 0 10px #1C2230,0 0 0 11px #3a3f4a,0 40px 100px -20px rgba(60,40,10,.45);display:flex;flex-direction:column">
        <span style="position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#0E1118;z-index:60"></span>
        <div style="flex:none;height:56px"></div>
        <div style="flex:none;height:56px;padding:0 18px 0 20px;display:flex;align-items:center;justify-content:space-between;background:#F5EFE4"><span style="font:400 26px/1 'Instrument Serif',serif;letter-spacing:.32em;color:#B58A2E">JUTRIP</span><span style="display:flex;align-items:center;gap:14px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2230" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 7l12-3v3M16 13h2"></path></svg><span style="position:relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2230" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M10 20a2 2 0 0 0 4 0"></path></svg><span style="position:absolute;right:-2px;top:-2px;width:8px;height:8px;border-radius:50%;background:oklch(0.55 0.17 5)"></span></span><span style="width:36px;height:36px;border-radius:50%;background:#1C2230;box-shadow:0 0 0 2px #FBF3E2,0 0 0 3.5px #B58A2E;display:flex;align-items:center;justify-content:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFDF8" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span></span></div>
        <div style="flex:1;min-height:0;padding:12px 16px 0">
          <div style="border-radius:28px;background:#FFFDF8;border:1px solid rgba(28,34,48,.07);box-shadow:0 20px 34px -24px rgba(28,34,48,.5);overflow:hidden">
            <div style="height:156px;position:relative"><dc-import name="Piezas/Imagen Comida" kind="{{ b.kind }}" w="{{ 343 }}" h="{{ 156 }}" hint-size="343px,156px"></dc-import><span style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 40%,rgba(0,0,0,.35))"></span><span style="position:absolute;left:18px;top:16px;font:600 11px 'Geist Mono',monospace;letter-spacing:.18em;color:#FFFDF8">{{ b.tag }}</span><span style="position:absolute;left:18px;right:18px;bottom:14px;display:flex;flex-direction:column;gap:4px;color:#FFFDF8;text-shadow:0 2px 12px rgba(0,0,0,.4)"><span style="font:400 34px/1 'Instrument Serif',serif">{{ b.title }}</span><span style="font:600 15px/1.2 'Geist'">{{ b.sub }}</span></span></div>
            <div style="padding:14px 14px 16px;display:flex;flex-direction:column;gap:12px">
              <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
                <sc-for list="{{ b.boxes }}" as="x" hint-placeholder-count="3"><div style="min-width:0;display:flex;flex-direction:column;gap:6px;padding:11px 10px 12px;border-radius:18px;background:#F7F1E4"><span style="display:flex;align-items:center;gap:5px;font:600 9.5px 'Geist Mono',monospace;letter-spacing:.08em;color:#6F4E37"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6E5018" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="{{ x.ic }}"></path></svg>{{ x.l }}</span><span style="font:700 16px/1.15 'Geist';white-space:nowrap">{{ x.v }}</span><span style="font:500 11px/1.3 'Geist';color:rgba(28,34,48,.6)">{{ x.s }}</span></div></sc-for>
              </div>
              <sc-if value="{{ b.notArr }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:18px;background:#FBF3E2;border:1px dashed rgba(181,138,46,.6)"><span style="display:flex;align-items:center;gap:10px;font:500 13px/1.35 'Geist';color:rgba(28,34,48,.75)"><span style="width:32px;height:32px;border-radius:50%;background:#F3E3B2;display:flex;align-items:center;justify-content:center;flex:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E5018" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10zM12 8.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"></path></svg></span>{{ b.locT }}</span><span style="display:flex;gap:8px"><span style="flex:1;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font:700 14px 'Geist';background:linear-gradient(135deg,#F3E2B0,#D2B67A 55%,#B58A2E);color:#4A3510;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)">Usar mi ubicación</span><sc-if value="{{ b.rest }}" hint-placeholder-val="{{ false }}"><span style="flex:1;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font:700 14px 'Geist';background:#FFFDF8;border:1px solid rgba(28,34,48,.18);color:#1C2230">Ya he llegado</span></sc-if></span></div>
              <div style="display:flex;gap:10px"><span style="flex:1.5;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font:700 14.5px 'Geist';background:linear-gradient(135deg,#F9EFCB,#EAD6A0 55%,#D8BD7C);color:#4A3510;border:1px solid rgba(181,138,46,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 8px 14px -10px rgba(110,80,24,.6)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A3510" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ b.i1 }}"></path></svg>{{ b.b1 }}</span><span style="flex:1;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:7px;font:700 14px 'Geist';background:#FFFDF8;border:1px solid rgba(181,138,46,.5);color:#4A3510;white-space:nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E5018" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="{{ b.i2 }}"></path></svg>{{ b.b2 }}</span></div>
              <span style="text-align:center;font:600 13px 'Geist';color:#6E5018;text-decoration:underline">{{ b.done }}</span></sc-if>
              <sc-if value="{{ b.arr }}" hint-placeholder-val="{{ false }}"><span style="height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font:700 15px 'Geist';background:linear-gradient(180deg,#3F9A5C,#2B7F45);color:#fff;border:1px solid #1F6236;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 16px -10px rgba(31,98,54,.8)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>He terminado</span></sc-if>
            </div>
          </div>
        </div>
        <div style="position:absolute;left:0;right:0;bottom:0;height:96px;z-index:4;background:linear-gradient(180deg,rgba(245,239,228,0),#F5EFE4 55%)"></div>
        <div style="position:absolute;left:12px;right:12px;bottom:14px;z-index:5"><dc-import name="Piezas/Barra JUTRIP" tone="tinta" act="0" hint-size="100%,64px"></dc-import></div>
      </div>
      </sc-if>
      <sc-if value="{{ b.imgs }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:16px;width:375px"><div style="height:156px;border-radius:24px;overflow:hidden;box-shadow:0 14px 24px -16px rgba(28,34,48,.5)"><dc-import name="Piezas/Imagen Comida" kind="comer" w="{{ 375 }}" h="{{ 156 }}" hint-size="375px,156px"></dc-import></div><div style="height:156px;border-radius:24px;overflow:hidden;box-shadow:0 14px 24px -16px rgba(28,34,48,.5)"><dc-import name="Piezas/Imagen Comida" kind="cenar" w="{{ 375 }}" h="{{ 156 }}" hint-size="375px,156px"></dc-import></div><div style="display:flex;gap:12px"><div style="width:96px;height:96px;border-radius:20px;overflow:hidden"><dc-import name="Piezas/Imagen Comida" kind="comer" w="{{ 96 }}" h="{{ 96 }}" hint-size="96px,96px"></dc-import></div><div style="width:96px;height:96px;border-radius:20px;overflow:hidden"><dc-import name="Piezas/Imagen Comida" kind="cenar" w="{{ 96 }}" h="{{ 96 }}" hint-size="96px,96px"></dc-import></div><div style="width:56px;height:56px;border-radius:14px;overflow:hidden"><dc-import name="Piezas/Imagen Comida" kind="comer" w="{{ 56 }}" h="{{ 56 }}" hint-size="56px,56px"></dc-import></div><div style="width:56px;height:56px;border-radius:14px;overflow:hidden"><dc-import name="Piezas/Imagen Comida" kind="cenar" w="{{ 56 }}" h="{{ 56 }}" hint-size="56px,56px"></dc-import></div></div></div>
      </sc-if>
      <span style="font:400 14px/1.45 'Geist';color:rgba(28,34,48,.72);max-width:375px;text-wrap:pretty">{{ b.note }}</span>
    </div>
  </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const REST='M7 3v6a2.5 2.5 0 0 0 5 0V3M9.5 3v18M17 3c-2.5 2-3 6-1 9h3V3M17 12v9',WK='M13 4.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM9 21l2-6-2-2 1-4 3 2 3 1M8 10l-2 3M11 15l3 2v4',HG='M6 3h12M6 21h12M7 3v4l5 5 5-5V3M7 21v-4l5-5 5 5v4',CK='M12 2v4M12 18v4M2 12h4M18 12h4M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',AR='M7 7h13l-4-4M17 17H4l4 4',CL='M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2';
class Component extends DCLogic {
  renderVals(){
    const base={card:true,imgs:false};
    const withR=(id,cap,kind,tag,title,sub,hor,t,done,note)=>({...base,id,cap,kind,tag,title,sub,done,note,notArr:true,arr:false,rest:true,locT:'Sin tu ubicación no sabemos cuándo llegas',i1:CK,b1:'Cómo llegar',i2:REST,b2:'Elegir otro sitio',boxes:[{ic:CL,l:'HORARIO',v:'Abierto',s:hor},{ic:WK,l:'A PIE',v:'3 min',s:'Desde el Panteón'},{ic:HG,l:t[0],v:t[1],s:'Lo que recomendamos'}]});
    const noR=(id,cap,kind,tag,title,t,done,note)=>({...base,id,cap,kind,tag,title,sub:'Cerca de tu alojamiento',done,note,notArr:true,arr:false,rest:false,locT:'Sin tu ubicación, te enseñamos los de cerca de tu última parada',i1:REST,b1:'Elegir sitio',i2:AR,b2:'Cambiar plan',boxes:[{ic:REST,l:'CERCA',v:'12 abiertos',s:'Restaurantes cerca de ti'},{ic:WK,l:'A PIE',v:'3 min',s:'El más cercano'},{ic:HG,l:t[0],v:t[1],s:'Lo que recomendamos'}]});
    const arrived=(id,cap,kind,tag,title,sub,t,note)=>({...base,id,cap,kind,tag,title,sub,note,arr:true,notArr:false,boxes:[{ic:CL,l:'HORARIO',v:'Abierto',s:t[2]},{ic:WK,l:'A PIE',v:'Aquí',s:'Ya has llegado'},{ic:HG,l:t[0],v:t[1],s:'Lo que recomendamos'}]});
    const B=withR;
    return{boards:[
      withR('C1','Comer · con restaurante en la ruta · 14:00','comer','COMIDA','Es hora de comer','Armando al Pantheon','Cierra a las 15:30',['COMIDA','1 h'],'Ya he comido · seguir con el plan','Lo normal: la ruta ya lleva un restaurante. [Cómo llegar] y [Elegir otro sitio] por si quiere cambiarlo.'),
      withR('C2','Cenar · con restaurante en la ruta · 21:00','cenar','CENA','Es hora de cenar','Da Enzo al 29','Cierra a las 23:30',['CENA','1 h 30'],'Ya he cenado · seguir con el plan','Igual, con la imagen de noche.'),
      arrived('C5','Comer · ya en el restaurante','comer','COMIDA','Es hora de comer','Armando al Pantheon',['COMIDA','1 h','Cierra a las 15:30'],'Sale al pulsar [Ya he llegado] o cuando el GPS ve que has llegado. [He terminado] pasa a la siguiente parada.'),
      arrived('C6','Cenar · ya en el restaurante','cenar','CENA','Es hora de cenar','Da Enzo al 29',['CENA','1 h 30','Cierra a las 23:30'],'Igual, con la imagen de noche.'),
      {id:'I1',cap:'La imagen sola, en sus dos versiones',card:false,imgs:true,note:'Para usarla donde salga una comida o una cena: DÍAS, listas…'},
      noR('C3','Comer · sin restaurante (por ejemplo, al llegar)','comer','COMIDA','Es hora de comer',['COMIDA','1 h'],'Ya he comido · seguir con el plan','Sin restaurante en la ruta: [Elegir sitio] abre «Comer cerca de ti».'),
      noR('C4','Cenar · sin restaurante','cenar','CENA','Es hora de cenar',['CENA','1 h 30'],'Ya he cenado · seguir con el plan','Igual, para la cena.')
    ]};
  }
}
</script>
