<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">
<style>
@keyframes jtL0{0%,6%{opacity:0;clip-path:inset(-30% 110% -10% -10%);transform:translateX(-14px)}20%{opacity:1;clip-path:inset(-30% -10% -10% -10%);transform:none}93%{opacity:1;clip-path:inset(-30% -10% -10% -10%)}99%,100%{opacity:0;clip-path:inset(-30% -10% -10% -10%)}}
@keyframes jtL1{0%,12%{opacity:0;clip-path:inset(-30% 110% -10% -10%);transform:translateX(-14px)}26%{opacity:1;clip-path:inset(-30% -10% -10% -10%);transform:none}93%{opacity:1;clip-path:inset(-30% -10% -10% -10%)}99%,100%{opacity:0;clip-path:inset(-30% -10% -10% -10%)}}
@keyframes jtL2{0%,18%{opacity:0;clip-path:inset(-30% 110% -10% -10%);transform:translateX(-14px)}32%{opacity:1;clip-path:inset(-30% -10% -10% -10%);transform:none}93%{opacity:1;clip-path:inset(-30% -10% -10% -10%)}99%,100%{opacity:0;clip-path:inset(-30% -10% -10% -10%)}}
@keyframes jtL3{0%,24%{opacity:0;clip-path:inset(-30% 110% -10% -10%);transform:translateX(-14px)}38%{opacity:1;clip-path:inset(-30% -10% -10% -10%);transform:none}93%{opacity:1;clip-path:inset(-30% -10% -10% -10%)}99%,100%{opacity:0;clip-path:inset(-30% -10% -10% -10%)}}
@keyframes jtL4{0%,30%{opacity:0;clip-path:inset(-30% 110% -10% -10%);transform:translateX(-14px)}44%{opacity:1;clip-path:inset(-30% -10% -10% -10%);transform:none}93%{opacity:1;clip-path:inset(-30% -10% -10% -10%)}99%,100%{opacity:0;clip-path:inset(-30% -10% -10% -10%)}}
@keyframes jtL5{0%,36%{opacity:0;clip-path:inset(-30% 110% -10% -10%);transform:translateX(-14px)}50%{opacity:1;clip-path:inset(-30% -10% -10% -10%);transform:none}93%{opacity:1;clip-path:inset(-30% -10% -10% -10%)}99%,100%{opacity:0;clip-path:inset(-30% -10% -10% -10%)}}
@keyframes jtStar{0%,50%{opacity:0;transform:translateX(-50%) scale(0) rotate(-120deg)}60%{opacity:1;transform:translateX(-50%) scale(1.6) rotate(0)}68%{transform:translateX(-50%) scale(1) rotate(0)}93%{opacity:1;transform:translateX(-50%) scale(1)}99%,100%{opacity:0;transform:translateX(-50%) scale(0)}}
</style>
</helmet>
<sc-if value="{{ isWord }}" hint-placeholder-val="{{ true }}">
<span style="display:inline-block;font-family:'Italiana',serif;font-size:{{ fs }}px;letter-spacing:.28em;padding-left:.28em;line-height:1.25;white-space:nowrap;filter:{{ shadow }}"><sc-for list="{{ letters }}" as="q" hint-placeholder-count="6"><span style="display:inline-block;position:relative;color:transparent;background:{{ grad }};-webkit-background-clip:text;background-clip:text;animation:{{ q.an }}">{{ q.c }}<sc-if value="{{ q.isI }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 120 120" fill="none" style="position:absolute;left:calc(50% - .14em);top:-.2em;width:.26em;height:.26em;transform:translateX(-50%);overflow:visible;animation:{{ starAn }}"><defs><linearGradient id="{{ u }}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6DC"></stop><stop offset=".3" stop-color="#F3D88F"></stop><stop offset=".55" stop-color="#C99A44"></stop><stop offset=".8" stop-color="#8E6820"></stop><stop offset="1" stop-color="#E9C77A"></stop></linearGradient></defs><path d="M60 4L71 49L116 60L71 71L60 116L49 71L4 60L49 49Z" fill="url(#{{ u }}g)" stroke="#6E5018" stroke-width="3"></path></svg></sc-if></span></sc-for></span>
</sc-if>
<sc-if value="{{ isStar }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 120 120" fill="none" width="{{ fs }}" height="{{ fs }}" style="display:block;overflow:visible"><defs><linearGradient id="{{ u }}h" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6DC"></stop><stop offset=".3" stop-color="#F3D88F"></stop><stop offset=".55" stop-color="#C99A44"></stop><stop offset=".8" stop-color="#8E6820"></stop><stop offset="1" stop-color="#E9C77A"></stop></linearGradient></defs><path d="M60 4L71 49L116 60L71 71L60 116L49 71L4 60L49 49Z" fill="url(#{{ u }}h)" stroke="#6E5018" stroke-width="3"></path></svg>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;fs&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:56,&quot;tsType&quot;:&quot;number&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;anim&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;mark&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;word&quot;,&quot;options&quot;:[&quot;word&quot;,&quot;star&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  u='jt'+Math.random().toString(36).slice(2,7);
  renderVals(){
    const p=this.props,dark=p.tone==='dark',T=+p.anim||0,fs=+p.fs||56;
    const grad=dark?'linear-gradient(180deg,#FFF6DC,#E9C77A 48%,#9A7228)':'linear-gradient(180deg,#C99A44,#8E6820 55%,#5A4010)';
    const rev={J:0,U:1,T:2,R:3,I:4,P:5};
    return{u:this.u,fs,grad,isWord:p.mark!=='star',isStar:p.mark==='star',
      shadow:dark?'none':'drop-shadow(0 2px 3px rgba(110,80,24,.25))',
      starAn:T?'jtStar '+T+'s ease-out infinite both':'none',
      letters:'JUTRIP'.split('').map(c=>({c,isI:c==='I',an:T?'jtL'+rev[c]+' '+T+'s cubic-bezier(.25,.6,.3,1) infinite both':'none'}))};
  }
}
</script>
</body>
</html>
