<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
@keyframes m7Rays{to{transform:rotate(360deg)}}
@keyframes m7Lit{0%{filter:grayscale(1) brightness(.78) contrast(1.05)}35%{filter:grayscale(0) brightness(2.2) contrast(1)}100%{filter:none}}
@keyframes m7Flash{0%{opacity:0;transform:scale(.4)}25%{opacity:1}100%{opacity:0;transform:scale(1.9)}}
@keyframes m7Glow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes m7Sheen{0%{transform:translateX(-160%) skewX(-18deg)}40%,100%{transform:translateX(360%) skewX(-18deg)}}
@keyframes m7Gather{0%{transform:none}35%{transform:scale(1.12);filter:brightness(1.6)}100%{transform:translate(var(--dx),var(--dy)) scale(.15);filter:brightness(3);opacity:0}}
@keyframes m7Base{0%,40%{opacity:1;filter:none}80%{opacity:1;filter:brightness(2.4)}100%{opacity:0;filter:brightness(4)}}
@keyframes m7Core{0%{opacity:0;transform:scale(.1)}20%{opacity:1;transform:scale(.5)}32%{transform:scale(.38)}44%{transform:scale(.8)}54%{transform:scale(.6)}66%{transform:scale(1.1)}74%{transform:scale(.8)}86%{transform:scale(1.5)}100%{opacity:1;transform:scale(.15)}}
@keyframes m7Beat{0%{opacity:0;transform:scale(.3)}10%{opacity:.95}100%{opacity:0;transform:scale(2.6)}}
@keyframes m7Big{0%{opacity:0;transform:scale(4)}100%{opacity:0;transform:scale(5)}}
@keyframes m7White{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
@keyframes m7Rise{0%{opacity:0;transform:scale(.55);filter:brightness(3) blur(6px)}45%{opacity:1;filter:brightness(1.7) blur(0)}75%{transform:scale(1.04)}100%{opacity:1;transform:none;filter:none}}
@keyframes m7GodR{0%{opacity:0;transform:rotate(0) scale(.6)}30%{opacity:1}100%{opacity:.85;transform:rotate(40deg) scale(1)}}
@keyframes m7Halo{0%,100%{opacity:.55;transform:scale(.95)}50%{opacity:1;transform:scale(1.06)}}
@keyframes m7Fw{0%{opacity:0;transform:translate(0,0) scale(.3)}8%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 30px)) scale(1)}}
@keyframes m7FwC{0%{opacity:0;transform:scale(.2)}20%{opacity:1}100%{opacity:0;transform:scale(2.4)}}
@keyframes m7Glit{0%{opacity:0;transform:translate(0,0) rotate(0)}12%{opacity:1}85%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(200deg)}}
@keyframes m7Ring{to{transform:rotate(360deg)}}
@keyframes m7Join{0%{opacity:0;transform:perspective(600px) translate(var(--jx),-250px) scale(2.6) rotateY(0)}18%{opacity:1}72%{transform:perspective(600px) translate(0,0) scale(.88) rotateY(720deg)}84%{transform:perspective(600px) scale(1.16) rotateY(720deg)}100%{opacity:1;transform:perspective(600px) rotateY(720deg)}}
@keyframes m7Trail{0%{opacity:0;transform:translateY(-230px) scaleY(.3)}20%{opacity:.9}70%{opacity:.6;transform:translateY(0) scaleY(1)}100%{opacity:0;transform:translateY(0) scaleY(.2)}}
@keyframes m7Shock{0%{opacity:0;transform:scale(.6)}6%{opacity:1}100%{opacity:0;transform:scale(2.4)}}
@keyframes m7Spk{0%{opacity:0;transform:translate(0,0) scale(.4)}12%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}
@keyframes m7ThudA{0%,100%{transform:none}30%{transform:translateY(4px) scale(.99)}60%{transform:translateY(-2px)}}
@keyframes m7ThudB{0%,100%{transform:none}30%{transform:translateY(4px) scale(.99)}60%{transform:translateY(-2px)}}
@keyframes m7Chase{0%,100%{filter:none}40%{filter:brightness(2.2) drop-shadow(0 0 10px #FFE7A8)}}
@keyframes m7Pull{0%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(0,0) scale(1.4)}}
@keyframes m7SpinIn{0%{opacity:0;transform:perspective(900px) rotateY(-540deg) scale(.35);filter:brightness(4) blur(4px)}55%{opacity:1;filter:brightness(1.8) blur(0)}78%{transform:perspective(900px) rotateY(12deg) scale(1.07);filter:brightness(1.3)}100%{opacity:1;transform:perspective(900px) rotateY(0) scale(1);filter:none}}
@keyframes m7Sweep{0%{transform:translateX(-200px) skewX(-20deg)}100%{transform:translateX(520px) skewX(-20deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position:relative;width:{{ W }};height:{{ H }};flex:none">

    <radialGradient id="{{ u }}ct" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#FFF6D8"></stop><stop offset=".55" stop-color="#DDB466"></stop><stop offset="1" stop-color="#8A6424"></stop></radialGradient>

   <text x="170" y="198" text-anchor="middle" font-family="Geist Mono" font-weight="600" font-size="7.5" letter-spacing="1.6" fill="#5A3E14">DE 7</text>
   <g transform="translate(0 4)">
    <path d="M52 326L36 336L52 346L44 356H86V316H44Z" fill="#9C7634"></path><path d="M288 326L304 336L288 346L296 356H254V316H296Z" fill="#9C7634"></path>
    <path d="M70 312Q170 300 270 312V352Q170 340 70 352Z" fill="url(#{{ u }}rb)" stroke="#7A5420" stroke-width="1.4"></path>
    <path d="M78 318Q170 307 262 318" fill="none" stroke="rgba(255,246,216,.6)" stroke-width="1"></path>
    <text x="170" y="337" text-anchor="middle" font-family="Geist Mono" font-weight="700" font-size="12" letter-spacing="2.6" fill="#3A2608">LAS 7 MARAVILLAS</text>
   </g>
  </svg>
  <span style="position:absolute;left:110px;top:{{ cntT }};width:120px;text-align:center;font:400 {{ cntF }}/1 'Instrument Serif',serif;color:#3A2608;text-shadow:0 1px 0 rgba(255,246,216,.7)">{{ cnt }}</span>
  <sc-for list="{{ coins }}" as="c" hint-placeholder-count="7">
   <sc-if value="{{ c.fl }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:{{ c.tl }};top:{{ c.t }};width:6px;height:82px;margin-left:-3px;background:linear-gradient(180deg,transparent,rgba(255,236,190,.9));border-radius:3px;filter:blur(1.5px);opacity:0;animation:m7Trail 1.1s ease-in both"></span></sc-if>
   <div onClick="{{ c.tap }}" style="position:absolute;left:{{ c.l }};top:{{ c.t }};width:82px;height:82px;cursor:pointer;--dx:{{ c.dx }};--dy:{{ c.dy }};--jx:{{ c.jx }};animation:{{ c.ga }}">
    <sc-if value="{{ c.on }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(255,224,150,.75),transparent 68%);animation:m7Glow 2.6s {{ c.gd }} ease-in-out infinite"></span></sc-if>
    <span style="position:absolute;inset:0;border-radius:50%;background:{{ c.bz }};box-shadow:{{ c.sh }}"></span>
    <div style="position:absolute;left:5px;top:5px;width:72px;height:72px;border-radius:50%;overflow:hidden;filter:{{ c.flt }};animation:{{ c.an }}">
     <div style="position:absolute;left:-14px;top:-25px;pointer-events:none"><dc-import name="Piezas/Emblema Oro" won="{{ true }}" kind="{{ c.k }}" size="100" interactive="{{ false }}" tilt="{{ false }}" hint-size="100px,125px"></dc-import></div>
     <sc-if value="{{ c.on }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:-20%;bottom:-20%;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,250,230,.75),transparent);animation:m7Sheen 5s {{ c.gd }} ease-in-out infinite"></span></sc-if>
    </div>
    <sc-if value="{{ c.off }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.18),rgba(30,36,52,.28) 70%)"></span></sc-if>
    <sc-if value="{{ c.fl }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,#FFFFFF,rgba(255,236,190,.6) 35%,transparent 70%);opacity:0;animation:m7Flash 1.1s 1.05s ease-out both"></span>
     <span style="position:absolute;inset:-4px;border-radius:50%;border:2.5px solid #FFF3D0;box-shadow:0 0 12px #FFD58A;opacity:0;animation:m7Shock .9s 1.05s ease-out both"></span>
     <span style="position:absolute;inset:-4px;border-radius:50%;border:1.5px solid #F3D59A;opacity:0;animation:m7Shock 1.3s 1.2s ease-out both"></span>
     <sc-for list="{{ spk }}" as="q" hint-placeholder-count="12"><span style="position:absolute;left:38px;top:38px;width:{{ q.s }};height:{{ q.s }};background:{{ q.c }};clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);--dx:{{ q.dx }};--dy:{{ q.dy }};opacity:0;animation:m7Spk .9s 1.05s cubic-bezier(.2,.7,.3,1) both"></span></sc-for></sc-if>
   </div>
  </sc-for>
  </div>
  </sc-if>
  <sc-if value="{{ fin }}" hint-placeholder-val="{{ false }}">
   <div style="position:absolute;inset:0;pointer-events:none">
    <span style="position:absolute;left:110px;top:110px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#FFFFFF 0%,#FFE7A8 32%,rgba(255,200,120,.3) 56%,transparent 72%);opacity:0;animation:m7Core 1.9s 1.90s ease-in both,m7Big .3s 3.80s ease forwards"></span>
    <sc-for list="{{ beats }}" as="b" hint-placeholder-count="5"><span style="position:absolute;left:120px;top:120px;width:100px;height:100px;border-radius:50%;border:{{ b.w }} solid #F3D59A;box-shadow:0 0 14px rgba(243,213,154,.7);opacity:0;animation:m7Beat {{ b.l }} {{ b.d }} ease-out both"></span></sc-for>
    <span style="position:absolute;left:-120px;top:-120px;width:580px;height:580px;border-radius:50%;background:repeating-conic-gradient(rgba(255,230,170,.32) 0 3deg,transparent 3deg 15deg);-webkit-mask:radial-gradient(circle,#000 14%,transparent 64%);mask:radial-gradient(circle,#000 14%,transparent 64%);opacity:0;animation:m7GodR 6s 3.90s ease-out both,m7Ring 50s 9.90s linear infinite"></span>
    <span style="position:absolute;left:-30px;top:-30px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,140,.6),transparent 66%);opacity:0;animation:m7Rise 1.2s 3.90s ease both,m7Halo 3.4s 5.10s ease-in-out infinite"></span>
    <div style="position:absolute;left:0;top:2px;opacity:0;animation:m7SpinIn 2.2s 3.85s cubic-bezier(.2,.8,.2,1) both"><dc-import name="Piezas/Medalla Maravillas" n="7" size="340" hint-size="340px,395px"></dc-import></div>
    <sc-for list="{{ pull }}" as="q" hint-placeholder-count="0"><span style="position:absolute;left:167px;top:167px;width:6px;height:6px;border-radius:50%;background:#FFE7B0;box-shadow:0 0 8px #FFD58A;--sx:{{ q.sx }};--sy:{{ q.sy }};opacity:0;animation:m7Pull {{ q.l }} {{ q.d }} cubic-bezier(.5,0,.8,.6) both"></span></sc-for>
    <sc-for list="{{ shocks }}" as="r" hint-placeholder-count="0"><span style="position:absolute;left:95px;top:95px;width:150px;height:150px;border-radius:50%;border:{{ r.w }} solid {{ r.c }};opacity:0;animation:m7Shock {{ r.l }} {{ r.d }} ease-out both"></span></sc-for>
    <span style="position:absolute;left:0;top:0;width:340px;height:400px;overflow:hidden;mix-blend-mode:screen;pointer-events:none"><span style="position:absolute;top:-40px;bottom:-40px;left:0;width:110px;background:linear-gradient(90deg,transparent,rgba(255,250,232,.85),transparent);filter:blur(6px);opacity:0;animation:m7Sweep 1.3s 5.9s cubic-bezier(.5,0,.4,1) both"></span></span>
    <sc-for list="{{ bursts }}" as="b" hint-placeholder-count="0">
     <span style="position:absolute;left:{{ b.x }};top:{{ b.y }};width:0;height:0">
      <span style="position:absolute;left:{{ b.cm }};top:{{ b.cm }};width:{{ b.cs }};height:{{ b.cs }};border-radius:50%;background:radial-gradient(circle,#FFFFFF,rgba(255,226,160,.6) 35%,transparent 70%);opacity:0;animation:m7FwC .9s {{ b.d }} ease-out both"></span>
      <sc-for list="{{ b.p }}" as="q" hint-placeholder-count="0"><span style="position:absolute;left:{{ q.m }};top:{{ q.m }};width:{{ q.s }};height:{{ q.s }};border-radius:50%;background:{{ q.c }};box-shadow:0 0 8px {{ q.c }};--dx:{{ q.dx }};--dy:{{ q.dy }};opacity:0;animation:m7Fw {{ q.l }} {{ b.d }} cubic-bezier(.15,.7,.3,1) both"></span></sc-for>
     </span>
    </sc-for>
    <sc-for list="{{ glit }}" as="g" hint-placeholder-count="0"><span style="position:absolute;left:{{ g.x }};top:{{ g.y }};width:{{ g.s }};height:{{ g.s }};background:{{ g.c }};clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);--dx:{{ g.dx }};--dy:{{ g.dy }};opacity:0;animation:m7Glit {{ g.l }} {{ g.d }} cubic-bezier(.3,.1,.6,1) both"></span></sc-for>
    <span style="position:absolute;left:-200px;top:-200px;width:740px;height:800px;background:radial-gradient(circle at 50% 46%,#FFFFFF 0%,rgba(255,244,214,.85) 30%,transparent 62%);opacity:0;animation:m7White 1s 3.70s ease-out both"></span>
   </div>
  </sc-if>
  <sc-if value="{{ hasTip }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:{{ tipL }};top:{{ tipT }};transform:translateX(-50%);height:30px;padding:0 12px;border-radius:999px;background:#1C2230;color:#FFFDF8;display:flex;align-items:center;white-space:nowrap;font:500 12.5px 'Geist';box-shadow:0 8px 18px -8px rgba(0,0,0,.6);z-index:5">{{ tip }}</span></sc-if>
 </div>
</div>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:400},&quot;n&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:7,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:320,&quot;tsType&quot;:&quot;number&quot;},&quot;anim&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
let UID=0;
const POS={coliseo:[152,263,141],muralla:[273,223,192],petra:[373,341,168],cristo:[383,245,121],machu:[153,342,150],chichen:[261,372,165],taj:[274,290,159]};
const KS=['coliseo','muralla','petra','cristo','machu','chichen','taj'];
const NM={coliseo:'Coliseo',muralla:'Gran Muralla China',petra:'Petra',cristo:'Cristo Redentor',machu:'Machu Picchu',chichen:'Chichén Itzá',taj:'Taj Mahal'};
class Component extends DCLogic {
  constructor(p){super(p);this.u='m7'+(++UID);const g=Number(p.gain)||0;this.state={n:p.anim?0:(g?g-1:null),fl:-1,tip:-1,fin:false,key:0};}
  componentDidMount(){if(this.props.anim)this.loop();const g=Number(this.props.gain)||0;if(g)this.t=setTimeout(()=>{this.setState({n:g,fl:g-1,tip:g-1});if(g>=7)this.t2=setTimeout(()=>this.setState({fin:true}),1800);},Number(this.props.gainDelay||1)*1000);}
  componentWillUnmount(){clearTimeout(this.t);clearTimeout(this.t2);}
  loop(){const s=this.state;let n=s.n===null?0:s.n;if(n>=7){this.t=setTimeout(()=>{this.setState({fin:true});this.t=setTimeout(()=>{this.setState({n:0,fl:-1,fin:false});this.loop();},13500);},1800);return;}
    this.t=setTimeout(()=>{this.setState({n:n+1,fl:n});this.loop();},n===0?900:2300);}
  renderVals(){const p=this.props,s=this.state;const S=Number(p.size)||300;const k=S/340;
    const only=p.only&&KS.includes(p.only)?p.only:null;
    const n=only?1:(s.n!==null?s.n:Math.max(0,Math.min(7,Number(p.n)||0)));
    const coins=KS.map((kk,i)=>{const a=-Math.PI/2+i*2*Math.PI/7;const cx=170+104*Math.cos(a),cy=170+104*Math.sin(a);const on=only?kk===only:i<n;
      const[px,py,pz]=POS[kk];const sc=72/(pz*.92);
      return{mk:'assets/mm-off-'+kk+'.png',bs:(516*sc).toFixed(1)+'px '+(601*sc).toFixed(1)+'px',bp:(-(px*sc-36)).toFixed(1)+'px '+(-(py*sc-36)).toFixed(1)+'px',k:kk,l:(cx-41).toFixed(1)+'px',t:(cy-41).toFixed(1)+'px',on,off:!on,fl:s.fl===i,gd:(i*.37).toFixed(2)+'s',
        flt:on?'none':'grayscale(1) brightness(.78) contrast(1.05)',an:s.fl===i?'m7Lit 1.4s ease both':'none',
        bz:on?'linear-gradient(135deg,#FFF1C6,#B48A3E 45%,#F6DC98 70%,#8A6424)':'linear-gradient(135deg,#E8ECF2,#8A93A2 45%,#D6DCE6 70%,#6E7686)',
        sh:on?'0 0 0 1px rgba(255,246,216,.7) inset,0 6px 14px -4px rgba(60,40,10,.6)':'0 0 0 1px rgba(0,0,0,.35) inset,0 4px 10px -4px rgba(0,0,0,.6)',
        tap:e=>{e.stopPropagation();this.setState({tip:i});clearTimeout(this.tt);this.tt=setTimeout(()=>this.setState({tip:-1}),1800);}};});
    const ridges=Array.from({length:120},(_,i)=>{const a=i/120*Math.PI*2;return'M'+(170+158*Math.cos(a)).toFixed(1)+' '+(170+158*Math.sin(a)).toFixed(1)+'L'+(170+167*Math.cos(a)).toFixed(1)+' '+(170+167*Math.sin(a)).toFixed(1);});
    const fin=s.fin;
    coins.forEach((c,i)=>{const a=-Math.PI/2+i*2*Math.PI/7;c.dx=(-104*Math.cos(a)).toFixed(1)+'px';c.dy=(-104*Math.sin(a)).toFixed(1)+'px';c.jx=(-(parseFloat(c.l)+41-170)*.6).toFixed(0)+'px';c.tl=(parseFloat(c.l)+41)+'px';
      c.ga=fin?'m7Chase .5s '+(i*.13).toFixed(2)+'s ease both,m7Gather 1.5s '+(1.15+i*.06).toFixed(2)+'s cubic-bezier(.6,0,.4,1) both':(s.fl===i?'m7Join 1.5s cubic-bezier(.3,.1,.3,1) both':'none');
      if(s.fl===i&&!fin)c.an='m7Lit 1.4s .95s ease both';});
    const rnd=q=>{const x=Math.sin(q*12.9898+78.233)*43758.5453;return x-Math.floor(x);};
