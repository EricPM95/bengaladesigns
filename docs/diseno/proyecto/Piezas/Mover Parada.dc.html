<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
a:hover{color:oklch(0.55 0.17 5)}
@keyframes menu{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
</style>
</helmet>
<div style="min-height:100vh;background:radial-gradient(ellipse 70% 60% at 50% 20%,#F1E8D6 0%,#E0D3BA 75%);padding:44px 48px 80px;font-family:'Geist',system-ui,sans-serif;color:#1C2230;display:flex;flex-direction:column;gap:26px">
  <div style="display:flex;flex-direction:column;gap:8px">
    <span style="font:600 10px 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(28,34,48,.55)">Días · editar parada</span>
    <span style="font:400 42px/1 'Instrument Serif',serif">Mover una parada <em style="color:oklch(0.55 0.17 5)">a otro día</em></span>
  </div>

  <div id="1a" style="display:flex;flex-direction:column;gap:12px">
    <span style="align-self:flex-start;font:600 12px 'Geist Mono',monospace;padding:4px 10px;border-radius:999px;background:#1C2230;color:#F3EEE4">1a · toca ⋯ en Plaza de España</span>
    <div data-screen-label="1a Mover parada" style="position:relative;width:390px;height:844px;flex:none;margin-top:4px;border-radius:50px;overflow:hidden;background:#FBF8F2;box-shadow:0 0 0 10px #1C2230,0 0 0 11px #3a3f4a,0 40px 100px -20px rgba(60,40,10,.45)">
      <div style="position:absolute;top:11px;left:50%;transform:translateX(-50%);width:116px;height:33px;border-radius:20px;background:#000;z-index:30"></div>
      <div style="height:52px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font:600 15px 'Geist'"><span>9:41</span><span style="width:24px;height:12px;border:1px solid rgba(28,34,48,.45);border-radius:4px;padding:1.5px;display:flex"><span style="flex:1;background:#1C2230;border-radius:2px"></span></span></div>

      <div style="padding:6px 16px 0;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:#FFFDF8;border:1px solid rgba(28,34,48,.07)">
          <span style="width:44px;height:48px;flex:none;border-radius:12px;background:#1C2230;color:#FFFDF8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px"><span style="font:600 9px 'Geist Mono',monospace;letter-spacing:.12em">JUE</span><span style="font:400 21px/1 'Instrument Serif',serif">29</span></span>
          <span style="flex:1;font:400 22px/1.05 'Instrument Serif',serif">Roma antigua y centro</span>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 2px 0">
          <span style="display:flex;align-items:center;gap:8px;font:600 10.5px 'Geist Mono',monospace;letter-spacing:.14em;color:rgba(28,34,48,.7)"><span style="width:22px;height:22px;border-radius:50%;background:oklch(0.9 0.04 285);color:oklch(0.4 0.1 285);display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ ic.moon }}"></path></svg></span>NOCHE</span>
          <span style="font:400 12px 'Geist';color:rgba(28,34,48,.6)">+ Añadir parada</span>
        </div>

        <sc-for list="{{ stops }}" as="s" hint-placeholder-count="2">
          <div style="display:flex;flex-direction:column;gap:8px">
            <div style="position:relative;display:flex;height:112px;border-radius:20px;background:#1B1E3A;color:#FFFDF8;box-shadow:0 14px 26px -16px rgba(20,22,50,.8)">
              <span style="position:absolute;left:-6px;top:-8px;width:24px;height:24px;border-radius:50%;background:oklch(0.9 0.04 240);color:oklch(0.38 0.1 250);box-shadow:0 0 0 2px #FBF8F2;display:flex;align-items:center;justify-content:center;font:700 11px 'Geist';z-index:2">{{ s.n }}</span>
              <span style="position:relative;width:150px;flex:none;border-radius:20px 0 0 20px;overflow:hidden">
                <span style="position:absolute;inset:0;clip-path:polygon(0 0,100% 0,calc(100% - 26px) 100%,0 100%);background:repeating-linear-gradient(135deg,#3A3E66 0 10px,#33375C 10px 20px);display:flex;align-items:center;justify-content:center;font:600 9px 'Geist Mono',monospace;letter-spacing:.14em;color:rgba(255,253,248,.4)">FOTO</span>
                <span style="position:absolute;left:0;top:0;bottom:0;width:38px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);background:#4A3D9A;display:flex;align-items:center;padding-left:10px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ ic.moon }}"></path></svg></span>
              </span>
              <span style="flex:1;min-width:0;padding:14px 46px 14px 2px;display:flex;flex-direction:column;justify-content:center;gap:6px">
                <span style="font:400 19px/1.05 'Instrument Serif',serif">{{ s.name }}</span>
                <span style="display:flex;align-items:center;gap:5px;font:500 11.5px 'Geist';color:rgba(255,253,248,.75)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9s10 4 10 9"></path></svg>20 min</span>
                <span style="align-self:flex-start;height:22px;padding:0 9px;border-radius:999px;background:rgba(255,253,248,.12);font:500 11px/22px 'Geist';color:rgba(255,253,248,.85)">Experiencia nocturna</span>
              </span>
              <button onClick="{{ s.toggle }}" aria-label="Opciones" aria-expanded="{{ s.exp }}" style="position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:none;background:{{ s.dotBg }};color:{{ s.dotFg }};display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>

              <sc-if value="{{ s.open }}" hint-placeholder-val="{{ false }}">
                <div style="position:absolute;right:6px;top:52px;width:268px;z-index:20;border-radius:22px;background:#FFFDF8;color:#1C2230;box-shadow:0 0 0 1px rgba(28,34,48,.08),0 24px 50px -16px rgba(20,22,50,.55);padding:12px 8px 8px;transform-origin:top right;animation:menu .25s cubic-bezier(.2,.8,.2,1) both">
                  <span style="position:absolute;right:20px;top:-6px;width:12px;height:12px;background:#FFFDF8;transform:rotate(45deg);box-shadow:-1px -1px 0 rgba(28,34,48,.06)"></span>
                  <div style="display:flex;align-items:center;gap:8px;padding:0 8px 8px">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.17 5)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{ ic.move }}"></path></svg>
                    <span style="flex:1;font:600 10px 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(28,34,48,.6)">Mover a</span>
                    <span style="font:400 11.5px 'Geist';color:rgba(28,34,48,.5)">Ahora: jueves 29</span>
                  </div>
                  <div style="display:flex;flex-direction:column;gap:2px">
                    <sc-for list="{{ days }}" as="d" hint-placeholder-count="4">
                      <button onClick="{{ d.pick }}" style="min-height:58px;display:flex;align-items:center;gap:12px;padding:7px 8px;border:none;border-radius:16px;background:transparent;text-align:left;cursor:pointer;color:#1C2230" style-hover="background:#F3ECDF">
                        <span style="width:44px;height:46px;flex:none;border-radius:12px;background:{{ d.chipBg }};border:1px solid {{ d.chipBd }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px"><span style="font:600 8.5px 'Geist Mono',monospace;letter-spacing:.12em;color:{{ d.wc }}">{{ d.ws }}</span><span style="font:400 21px/1 'Instrument Serif',serif">{{ d.n }}</span></span>
                        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
                          <span style="font:600 13.5px 'Geist'">{{ d.wd }}</span>
                          <span style="display:flex;align-items:center;gap:5px;font:400 12px/1.3 'Geist';color:rgba(28,34,48,.62);text-wrap:pretty"><sc-if value="{{ d.isExc }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="oklch(0.45 0.1 225)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="{{ ic.mount }}"></path></svg></sc-if>{{ d.t }}</span>
                        </span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(28,34,48,.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M9 6l6 6-6 6"></path></svg>
                      </button>
                    </sc-for>
                  </div>
                </div>
              </sc-if>
            </div>
            <sc-if value="{{ s.walk }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px">
                <span style="font:500 11.5px 'Geist Mono',monospace;color:rgba(28,34,48,.65)">10 min · 817 m · <span style="color:oklch(0.5 0.17 5);text-decoration:underline;text-underline-offset:3px">Rutas</span></span>
                <span style="font:400 12px 'Geist';color:rgba(28,34,48,.6)">+ Añadir parada</span>
              </div>
            </sc-if>
          </div>
        </sc-for>
        <span style="padding:4px 4px 0;font:400 12px 'Geist';color:rgba(28,34,48,.5)">Fin del día.</span>
      </div>

      <sc-if value="{{ toastOn }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:50%;bottom:40px;height:40px;padding:0 16px;border-radius:999px;background:#1C2230;color:#F3EEE4;display:flex;align-items:center;font:500 13px 'Geist';white-space:nowrap;animation:toast 2.2s ease both;z-index:40">{{ toastTxt }}</div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const IC={moon:'M19.5 14.5A7.5 7.5 0 1 1 9.5 4.5a6 6 0 0 0 10 10z',
move:'M5 5h14a1.5 1.5 0 0 1 1.5 1.5v12A1.5 1.5 0 0 1 19 20H5a1.5 1.5 0 0 1-1.5-1.5v-12A1.5 1.5 0 0 1 5 5zM3.5 10h17M8 3v4M16 3v4M10 15h5M13 13l2 2-2 2',
mount:'M3 20l6-10 4 6 3-4 5 8z'};
const DAYS=[['VIE','Viernes',30,'Vaticano y Trastevere'],['SÁB','Sábado',31,'Centro histórico y Villa Borghese'],['DOM','Domingo',1,'Excursión desde Roma',1],['LUN','Lunes',2,'Excursión desde Roma',1]];
class Component extends DCLogic {
  state={open:1,toast:null};
  componentWillUnmount(){clearTimeout(this.tt);}
  renderVals(){const s=this.state;
    return{ic:IC,toastOn:!!s.toast,toastTxt:s.toast||'',
      stops:[['13','Fontana de Trevi'],['14','Plaza de España']].map(([n,name],i,a)=>{const o=s.open===i;return{n,name,open:o,exp:o?'true':'false',walk:i<a.length-1,
        dotBg:o?'#FFFDF8':'rgba(255,253,248,.92)',dotFg:'#1C2230',toggle:()=>this.setState(st=>({open:st.open===i?null:i}))};}),
      days:DAYS.map(([ws,wd,n,t,exc])=>({ws,wd:`${wd} ${n}`,n:String(n),t,isExc:!!exc,
        chipBg:exc?'oklch(0.95 0.025 230)':'#F5EFE4',chipBd:exc?'oklch(0.56 0.1 230 / .25)':'rgba(28,34,48,.08)',wc:exc?'oklch(0.45 0.1 225)':'oklch(0.5 0.17 5)',
        pick:()=>{this.setState({open:null,toast:`Movida al ${wd.toLowerCase()} ${n}`});clearTimeout(this.tt);this.tt=setTimeout(()=>this.setState({toast:null}),2200);}}))};}
}
</script>
</body>
</html>
