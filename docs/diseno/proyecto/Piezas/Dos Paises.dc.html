<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes dpIn{0%{opacity:0;transform:scale(.3) rotate(-20deg)}60%{opacity:1;transform:scale(1.07) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes dpDraw{to{stroke-dashoffset:0}}
@keyframes dpStep{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
@keyframes dpStamp{0%{opacity:0;transform:scale(2.6) rotate(var(--r0))}55%{opacity:1;transform:scale(.92) rotate(var(--r))}100%{opacity:1;transform:scale(1) rotate(var(--r))}}
@keyframes dpRib{0%{opacity:0;transform:translateY(10px) scaleX(.4)}100%{opacity:1;transform:none}}
@keyframes dpSheen{0%{transform:translateX(-180%) rotate(20deg)}55%,100%{transform:translateX(340%) rotate(20deg)}}
@keyframes dpGlow{0%,100%{opacity:.35}50%{opacity:.8}}
@keyframes dpMove{from{offset-distance:0%}to{offset-distance:100%}}
[data-st="1"] *{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</helmet>
<div data-st="{{ st }}" style="position:relative;width:{{ w }};height:{{ h }};flex:none">
  <span style="position:absolute;left:-8%;top:-8%;width:116%;height:104%;border-radius:50%;background:radial-gradient(circle,rgba(255,210,150,.55),transparent 66%);opacity:0;animation:dpGlow 4s 5.8s ease-in-out infinite"></span>
  <div style="position:absolute;inset:0;animation:dpIn 1.1s cubic-bezier(.2,.8,.2,1) both">
    <svg width="100%" height="100%" viewBox="0 0 200 220" style="position:absolute;inset:0;overflow:visible;filter:drop-shadow(0 8px 12px rgba(70,35,15,.38))">
      <defs>
        <clipPath id="{{ cF }}"><circle cx="100" cy="100" r="82"></circle></clipPath>
        <clipPath id="{{ cL }}"><path d="M0 0H114L86 200H0Z"></path></clipPath>
        <clipPath id="{{ cR }}"><path d="M114 0H200V200H86Z"></path></clipPath>
        <linearGradient id="{{ gL }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCE6CF"></stop><stop offset=".62" stop-color="#F6D9B8"></stop><stop offset="1" stop-color="#EBC197"></stop></linearGradient>
        <linearGradient id="{{ gR }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6D6"></stop><stop offset=".62" stop-color="#F9E6A6"></stop><stop offset="1" stop-color="#EFD27D"></stop></linearGradient>
        <linearGradient id="{{ gRim }}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4906A"></stop><stop offset=".5" stop-color="#B95A36"></stop><stop offset="1" stop-color="#7E3519"></stop></linearGradient>
        <filter id="{{ fB }}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="b"></feGaussianBlur><feSpecularLighting in="b" surfaceScale="3.5" specularConstant=".9" specularExponent="20" lighting-color="#FFF1E0" result="s"><feDistantLight azimuth="235" elevation="42"></feDistantLight></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"></feComposite><feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".85" k4="0"></feComposite></filter>
      </defs>
      <circle cx="100" cy="100" r="96" fill="url(#{{ gRim }})" filter="url(#{{ fB }})"></circle>
      <circle cx="100" cy="100" r="88" fill="none" stroke="#FBE3CF" stroke-width="1.2" stroke-dasharray="1.5 3.5"></circle>
      <g clip-path="url(#{{ cF }})">
        <g clip-path="url(#{{ cL }})">
          <rect x="0" y="0" width="200" height="200" fill="url(#{{ gL }})"></rect>
          <rect x="34" y="40" width="8" height="5" rx="1" fill="#2E8B57"></rect><rect x="42" y="40" width="8" height="5" fill="#FFFDF8"></rect><rect x="50" y="40" width="8" height="5" rx="1" fill="#CE3B3B"></rect>
          <path d="M0 150c30-14 64-14 100-4V200H0Z" fill="#9CB97C"></path>
          <path d="M0 162c34-10 66-8 100 0V200H0Z" fill="#7FA463"></path>
          <g transform="translate(26 92)" fill="none" stroke="#8C3F22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 46h64M5 46V20c8-11 50-11 58 0v26M5 28h58M5 37h58M14 18v28M23 16v30M32 15v31M41 15v31M50 16v30M59 18v28"></path></g>
          <path d="M26 138h62" stroke="#8C3F22" stroke-width="2.4" stroke-linecap="round"></path>
        </g>
        <g clip-path="url(#{{ cR }})">
          <rect x="0" y="0" width="200" height="200" fill="url(#{{ gR }})"></rect>
          <rect x="142" y="40" width="12" height="5" rx="1" fill="#F2C230"></rect><rect x="154" y="40" width="12" height="5" rx="1" fill="#FFFDF8"></rect>
          <path d="M100 146c34-10 70-8 100 4V200H100Z" fill="#E6CF8E"></path>
          <path d="M100 160c36-8 66-6 100 2V200H100Z" fill="#D9BC70"></path>
          <g transform="translate(118 72)" fill="none" stroke="#7A5A16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 66h58M10 66V40M56 66V40M8 40h50M14 40c0-18 8-30 19-30s19 12 19 30M33 10V2M30 4h6M22 66V52M44 66V52M33 66V48"></path></g>
          <g transform="translate(146 120) scale(.8)" fill="none" stroke="#7A5A16" stroke-width="1.8" stroke-linecap="round"><path d="M0 0l14 14M14 0L0 14M0 0a3 3 0 1 0 0 .1M14 0a3 3 0 1 0 0 .1"></path></g>
        </g>
        <path d="M24 96Q100 4 176 96" fill="none" stroke="rgba(150,90,40,.35)" stroke-width="1.2" stroke-dasharray="1.5 4"></path>
        <g style="offset-path:path('M24 96Q100 4 176 96');offset-rotate:0deg;animation:dpMove 3.6s 1.8s ease-in-out both"><circle r="7" fill="#FFC85A" stroke="#FFF3D0" stroke-width="2.5"></circle></g>
        <path d="M114 0L86 200" stroke="#FFFDF8" stroke-width="5"></path>
        <path d="M114 0L86 200" stroke="#8C3F22" stroke-width="1.8" stroke-dasharray="5 4" pathLength="100" style="stroke-dashoffset:100;animation:dpDraw 1s 1s ease both"></path>
        <sc-for list="{{ steps }}" as="s" hint-placeholder-count="10"><g transform="{{ s.t }}"><ellipse cx="0" cy="0" rx="2.6" ry="4" fill="#5B3420" style="transform-box:fill-box;transform-origin:center;opacity:0;animation:dpStep .35s {{ s.d }} ease both"></ellipse></g></sc-for>
      </g>
      <circle cx="100" cy="100" r="82" fill="none" stroke="#FFF1E2" stroke-width="2"></circle>
      <g style="--r0:-30deg;--r:-12deg;transform-box:fill-box;transform-origin:center;opacity:0;animation:dpStamp .55s 4.4s cubic-bezier(.3,1.5,.5,1) both">
        <rect x="22" y="58" width="58" height="22" rx="5" fill="rgba(255,253,248,.7)" stroke="#B23A2A" stroke-width="2"></rect>
        <rect x="25" y="61" width="52" height="16" rx="3" fill="none" stroke="#B23A2A" stroke-width=".8"></rect>
        <text x="51" y="73" text-anchor="middle" font-family="Geist Mono" font-weight="700" font-size="9" letter-spacing="1.6" fill="#B23A2A">ITALIA</text>
      </g>
      <g style="--r0:30deg;--r:10deg;transform-box:fill-box;transform-origin:center;opacity:0;animation:dpStamp .55s 5s cubic-bezier(.3,1.5,.5,1) both">
        <rect x="114" y="58" width="68" height="22" rx="11" fill="rgba(255,253,248,.7)" stroke="#2F5A8E" stroke-width="2"></rect>
        <rect x="117" y="61" width="62" height="16" rx="8" fill="none" stroke="#2F5A8E" stroke-width=".8"></rect>
        <text x="148" y="73" text-anchor="middle" font-family="Geist Mono" font-weight="700" font-size="8.5" letter-spacing="1.2" fill="#2F5A8E">VATICANO</text>
      </g>
      <g style="transform-box:fill-box;transform-origin:center;opacity:0;animation:dpRib .7s 5.7s cubic-bezier(.2,.8,.2,1) both">
        <path d="M30 186l12-8v-4h116v4l12 8-12 8v4H42v-4z" fill="#7E3519"></path>
        <path d="M42 174h116v24H42z" fill="url(#{{ gRim }})" filter="url(#{{ fB }})"></path>
        <text x="100" y="190" text-anchor="middle" font-family="Geist Mono" font-weight="700" font-size="9" letter-spacing="1.6" fill="#FFF3E4">2 PAÍSES · 1 DÍA</text>
      </g>
    </svg>
    <div style="position:absolute;left:4%;top:3.6%;width:92%;height:83.6%;border-radius:50%;overflow:hidden;pointer-events:none"><span style="position:absolute;top:-30%;bottom:-30%;left:0;width:20%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:dpSheen 5s 6.2s ease-in-out infinite"></span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:240},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:200,&quot;tsType&quot;:&quot;number&quot;},&quot;anim&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
let UID=0;
class Component extends DCLogic {
  constructor(p){super(p);this.u='dp'+(++UID);}
  renderVals(){const p=this.props,u=this.u;const sz=Number(p.size)||170;const an=!(p.anim===false||p.anim==='false');
    const PTS=[[38,150,-70],[48,146,-75],[60,144,-82],[72,142,-86],[86,142,-92],[100,143,-96],[114,146,-102],[128,149,-108],[142,153,-112],[156,156,-116]];
    return{st:an?'0':'1',w:sz+'px',h:(sz*1.1).toFixed(1)+'px',cF:u+'f',cL:u+'l',cR:u+'r',gL:u+'a',gR:u+'b',gRim:u+'m',fB:u+'v',
      steps:PTS.map(([x,y,r],i)=>({t:'translate('+x+' '+(y+(i%2?3:-3))+') rotate('+(r+90)+')',d:(2+i*0.22).toFixed(2)+'s'}))};}
}
</script>
</body>
</html>
