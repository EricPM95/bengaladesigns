<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
</helmet>
<div style="position:relative;width:360px;height:640px;border-radius:24px;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,#2E3550 0%,#141826 70%);color:#FFFDF8;font-family:'Geist',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;text-align:center">
  <span style="position:absolute;left:50%;top:150px;width:420px;height:420px;margin-left:-210px;border-radius:50%;background:repeating-conic-gradient(rgba(243,213,154,.12) 0 6deg,transparent 6deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 66%);mask-image:radial-gradient(circle,#000 20%,transparent 66%)"></span>
  <sc-if value="{{ isL }}" hint-placeholder-val="{{ true }}">
    <div style="position:relative;margin-top:28px;width:304px;height:220px;border-radius:18px;background:linear-gradient(150deg,#B8D4D8,#4E8A94 60%,#2E5660);box-shadow:0 18px 30px -16px rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:flex-start;padding:10px 12px"><span style="font:600 9px 'Geist Mono',monospace;letter-spacing:.14em;color:rgba(255,255,255,.75)">TU FOTO</span></div>
    <div style="position:relative;margin-top:-56px;filter:drop-shadow(0 0 22px rgba(255,214,140,.55))"><dc-import name="Piezas/Emblema Secreto" kind="mon" scale="0.86" delay="0" hint-size="129px,129px"></dc-import></div>
    <span style="position:relative;margin-top:12px;font:600 10px 'Geist Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#F3D59A">Emblema Oculto</span>
    <span style="position:relative;margin-top:6px;padding:0 24px;font:400 34px/1.05 'Instrument Serif',serif">Volverás a Roma</span>
    <span style="position:relative;margin-top:8px;font:500 12px 'Geist Mono',monospace;color:rgba(255,253,248,.75)">Fontana de Trevi · 11 de octubre de 2026</span>
  </sc-if>
  <sc-if value="{{ isV }}" hint-placeholder-val="{{ false }}">
    <span style="position:relative;margin-top:44px;font:600 10px 'Geist Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#F3D59A">Mi viaje</span>
    <span style="position:relative;margin-top:8px;font:400 40px/1 'Instrument Serif',serif">Roma</span>
    <div style="position:relative;margin-top:20px;filter:drop-shadow(0 14px 22px rgba(0,0,0,.6))"><dc-import name="Piezas/Sello Logro" grade="oro" icon="coliseo" size="170" label="ROMA" hint-size="170px,170px"></dc-import></div>
    <div style="position:relative;margin-top:22px;display:flex;gap:10px;align-items:center">
      <dc-import name="Piezas/Emblema Secreto" kind="mar" scale="0.44" delay="0" hint-size="66px,66px"></dc-import>
      <dc-import name="Piezas/Emblema Secreto" kind="mon" scale="0.44" delay="0" hint-size="66px,66px"></dc-import>
      <dc-import name="Piezas/Emblema Secreto" kind="ocu" scale="0.44" delay="0" hint-size="66px,66px"></dc-import>
      <dc-import name="Piezas/Logro Viajero" tier="4" grow="4" hue="40" size="66" num="10" icon="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z" delay="0" hint-size="66px,66px"></dc-import>
    </div>
    <span style="position:relative;margin-top:22px;font:500 13px 'Geist Mono',monospace;color:rgba(255,253,248,.82)">5 días en Roma · octubre de 2026</span>
  </sc-if>
  <div style="position:absolute;left:20px;right:20px;bottom:20px;display:flex;align-items:center;gap:10px;padding-top:14px;border-top:1px solid rgba(255,253,248,.14)">
    <span style="width:34px;height:34px;flex:none;border-radius:50%;background:#FFFDF8;color:#1C2230;display:flex;align-items:center;justify-content:center;font:400 18px/1 'Instrument Serif',serif">E</span>
    <span style="flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:1px"><span style="font:600 13px 'Geist'">Elena</span><span style="font:italic 400 14px/1 'Instrument Serif',serif;color:#F3D59A">Ciudadano del mundo</span></span>
    <span style="width:60px;height:26px;border-radius:7px;border:1px dashed rgba(255,253,248,.4);display:flex;align-items:center;justify-content:center;font:600 8.5px 'Geist Mono',monospace;letter-spacing:.12em;color:rgba(255,253,248,.55)">LOGO</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:640},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;logro&quot;,&quot;viaje&quot;],&quot;default&quot;:&quot;logro&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){const v=this.props.kind==='viaje';return{isV:v,isL:!v};}
}
</script>
</body>
</html>
