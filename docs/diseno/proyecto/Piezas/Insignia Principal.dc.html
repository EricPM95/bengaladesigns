<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="Piezas/iconos-sitios.js"></script>
<style>
@keyframes ipHalfL{0%{opacity:0;transform:translateX(-40px) rotate(-8deg)}70%{opacity:1;transform:translateX(3px)}100%{opacity:1;transform:none}}
@keyframes ipHalfR{0%{opacity:0;transform:translateX(40px) rotate(8deg)}70%{opacity:1;transform:translateX(-3px)}100%{opacity:1;transform:none}}
@keyframes ipIn{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes ipKeyL{0%{opacity:0;transform:translate(-70px,40px) rotate(-60deg)}70%{opacity:1}100%{opacity:1;transform:none}}
@keyframes ipKeyR{0%{opacity:0;transform:translate(70px,40px) rotate(60deg)}70%{opacity:1}100%{opacity:1;transform:none}}
@keyframes ipDrop{0%{opacity:0;transform:translateY(-60px) scale(.7)}65%{opacity:1;transform:translateY(4px) scale(1.04)}100%{opacity:1;transform:none}}
@keyframes ipFlash{0%{opacity:0;transform:scale(.3)}30%{opacity:1}100%{opacity:0;transform:scale(2.2)}}
@keyframes ipRays{to{transform:rotate(360deg)}}
@keyframes ipFade{from{opacity:0}to{opacity:1}}
@keyframes ipSweep{0%{transform:translateX(-160%) rotate(20deg)}45%,100%{transform:translateX(360%) rotate(20deg)}}
@keyframes ipBloom{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:none}}
@keyframes ipDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ipUnroll{0%{transform:scaleY(0)}70%{transform:scaleY(1.04)}100%{transform:scaleY(1)}}
@keyframes ipRib{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes ipSway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes ipTw{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</helmet>
<div style="position:relative;width:{{ sz }};height:{{ sz }};flex:none">
  <div style="position:absolute;left:0;top:0;width:170px;height:170px;transform:{{ sc }};transform-origin:0 0">
    <span style="position:absolute;inset:-6px;border-radius:50%;background:repeating-conic-gradient({{ ray }} 0 6deg,transparent 6deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 25%,transparent 70%);mask-image:radial-gradient(circle,#000 25%,transparent 70%);opacity:0;animation:ipFade 1s {{ dRay }} ease both,ipRays 30s linear infinite"></span>

    <sc-if value="{{ isVati }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:23px;top:20px;width:124px;height:140px;filter:drop-shadow(0 14px 16px rgba(60,40,10,.35))">
        <div style="position:absolute;inset:0;opacity:{{ vo0 }};filter:{{ vf0 }};transition:opacity .6s ease,filter .6s ease"><div style="position:absolute;inset:0;animation:ipHalfL .9s {{ d0 }} cubic-bezier(.2,.8,.2,1) both">
          <span style="position:absolute;inset:0;clip-path:polygon(0 8%,50% 0,50% 100%,0 58%);background:linear-gradient(135deg,#FFF6DC,#D9B86A 40%,#FFF1C6 62%,#B48F45)"></span>
          <span style="position:absolute;inset:0;transform:scale(.9);clip-path:polygon(0 8%,50% 0,50% 100%,0 58%);background:linear-gradient(160deg,oklch(0.9 0.12 95),oklch(0.82 0.13 88) 60%,oklch(0.74 0.13 82));overflow:hidden"><span style="position:absolute;top:-30%;bottom:-30%;left:0;width:26%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:ipSweep 5s {{ dSweep }} ease-in-out infinite"></span></span>
        </div></div>
        <div style="position:absolute;inset:0;opacity:{{ vo1 }};filter:{{ vf1 }};transition:opacity .6s ease,filter .6s ease"><div style="position:absolute;inset:0;animation:ipHalfR .9s {{ d0b }} cubic-bezier(.2,.8,.2,1) both">
          <span style="position:absolute;inset:0;clip-path:polygon(50% 0,100% 8%,100% 58%,50% 100%);background:linear-gradient(135deg,#FFF6DC,#D9B86A 40%,#FFF1C6 62%,#B48F45)"></span>
          <span style="position:absolute;inset:0;transform:scale(.9);clip-path:polygon(50% 0,100% 8%,100% 58%,50% 100%);background:linear-gradient(200deg,#FFFFFF,#F6F1E4 60%,#E4DCC8);overflow:hidden"><span style="position:absolute;top:-30%;bottom:-30%;left:0;width:26%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:ipSweep 5s {{ dSweep }} ease-in-out infinite"></span></span>
        </div></div>
        <span style="position:absolute;left:50%;top:0;bottom:0;width:1px;margin-left:-.5px;background:rgba(122,90,34,.35);opacity:{{ vo1 }}"></span>
      </div>
      <svg width="170" height="170" viewBox="0 0 170 170" style="position:absolute;inset:0;overflow:visible">
        <defs>
          <linearGradient id="{{ gG }}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1C6"></stop><stop offset=".45" stop-color="#D4AE5C"></stop><stop offset="1" stop-color="#9C7634"></stop></linearGradient>
          <linearGradient id="{{ gS }}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset=".5" stop-color="#C6CBD1"></stop><stop offset="1" stop-color="#8D949C"></stop></linearGradient>
        </defs>
        <g style="opacity:{{ vo2 }};filter:{{ vf2 }};transition:opacity .6s ease,filter .6s ease"><g style="transform-box:fill-box;transform-origin:center;animation:ipKeyL 1.1s {{ d1 }} cubic-bezier(.3,1.2,.5,1) both">
          <g transform="translate(85 104) rotate(-45)" fill="{{ fG }}" stroke="#7A5A22" stroke-width="1.1" stroke-linejoin="round">
            <path d="M-50 0a12 12 0 1 1 0 .01zM-44 0a6 6 0 1 0 0-.01z" fill-rule="evenodd"></path>
            <path d="M-38-3.2h76v6.4h-76z"></path>
            <path d="M28 3.2h14v12h-5v-6h-4v6h-5z"></path>
          </g>
        </g>
        <g style="transform-box:fill-box;transform-origin:center;animation:ipKeyR 1.1s {{ d1b }} cubic-bezier(.3,1.2,.5,1) both">
          <g transform="translate(85 104) rotate(-135)" fill="{{ fS }}" stroke="#5C636C" stroke-width="1.1" stroke-linejoin="round">
            <path d="M-50 0a12 12 0 1 1 0 .01zM-44 0a6 6 0 1 0 0-.01z" fill-rule="evenodd"></path>
            <path d="M-38-3.2h76v6.4h-76z"></path>
            <path d="M28-3.2h14v-12h-5v6h-4v-6h-5z"></path>
          </g>
        </g>
        <g style="opacity:0;animation:ipFade .4s {{ dCord }} ease both"><path d="M78 98c4 6 10 6 14 0M85 101v14M81 115l4 5 4-5" fill="none" stroke="oklch(0.5 0.17 25)" stroke-width="2.6" stroke-linecap="round"></path><circle cx="85" cy="100" r="3.6" fill="oklch(0.5 0.17 25)"></circle></g></g>
        <g style="opacity:{{ vo2 }};filter:{{ vf2 }};transition:opacity .6s ease,filter .6s ease"><g style="transform-box:fill-box;transform-origin:center bottom;animation:ipDrop .9s {{ d2 }} cubic-bezier(.3,1.3,.5,1) both">
          <path d="M70 70h30l-2-9H72zM71.5 61h27l-2.5-9h-22zM73.5 52h23l-3-9h-17zM77 43h16c0-8-3.5-12-8-14-4.5 2-8 6-8 14z" fill="{{ fG }}" stroke="#7A5A22" stroke-width="1"></path>
          <path d="M70 66h30M72 57h26M74 48h22" stroke="oklch(0.5 0.17 25)" stroke-width="1.6"></path>
          <path d="M85 29v-8M81.5 24.5h7" stroke="#7A5A22" stroke-width="1.8" stroke-linecap="round"></path>
          <path d="M72 70l-4 14M98 70l4 14" stroke="oklch(0.5 0.17 25)" stroke-width="2.2" stroke-linecap="round"></path>
        </g></g>
      </svg>
      <span style="position:absolute;left:50%;top:60%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:radial-gradient(circle,#FFFFFF,rgba(255,240,200,.6) 35%,transparent 70%);opacity:0;animation:ipFlash .8s {{ dClink }} ease-out both"></span>
    </sc-if>

    <sc-if value="{{ isB }}" hint-placeholder-val="{{ false }}">
      <svg width="170" height="170" viewBox="0 0 170 170" style="position:absolute;inset:0;overflow:visible;filter:drop-shadow(0 14px 16px rgba(90,20,40,.3))">
        <circle cx="85" cy="85" r="74" fill="oklch(0.46 0.16 5)" style="animation:ipIn .8s {{ d0 }} ease both"></circle>
        <circle cx="85" cy="85" r="74" fill="none" stroke="#E4C78A" stroke-width="3" pathLength="1" stroke-dasharray="1" style="stroke-dashoffset:1;animation:ipDraw 1.2s {{ d0 }} ease both"></circle>
        <sc-for list="{{ beads }}" as="b" hint-placeholder-count="0"><circle cx="{{ b.x }}" cy="{{ b.y }}" r="1.8" fill="#F3E3B8" style="opacity:0;animation:ipFade .3s {{ b.d }} ease both"></circle></sc-for>
        <sc-for list="{{ petals }}" as="p" hint-placeholder-count="0">
          <g transform="{{ p.t }}"><g style="transform-box:fill-box;transform-origin:50% 100%;animation:ipBloom .7s {{ p.d }} cubic-bezier(.3,1.4,.5,1) both"><path d="M0 -58c13 8 15 28 0 40-15-12-13-32 0-40z" fill="oklch(0.62 0.17 5)" stroke="#E4C78A" stroke-width="1.6"></path><path d="M0 -50c6 6 7 18 0 24-7-6-6-18 0-24z" fill="oklch(0.72 0.14 8)"></path><circle cx="0" cy="-38" r="2.4" fill="#FFF1E6"></circle></g></g>
        </sc-for>
        <circle cx="85" cy="85" r="24" fill="#F7EBCB" stroke="#E4C78A" stroke-width="3" style="transform-box:fill-box;transform-origin:center;animation:ipBloom .8s {{ d2 }} cubic-bezier(.3,1.5,.5,1) both"></circle>
        <g transform="translate(73 70) scale(1)" fill="none" stroke="oklch(0.46 0.16 5)" stroke-width="1.7" stroke-linecap="round" style="opacity:0;animation:ipFade .4s {{ d2b }} ease both"><path d="M2 16h20M3 16V8c4-5 14-5 18 0v8M3 11h18M8 8v8M12 7v9M16 8v8"></path></g>
      </svg>
      <span style="position:absolute;left:50%;top:104px;transform:translateX(-50%);font:700 8px 'Geist Mono',monospace;letter-spacing:.14em;color:oklch(0.46 0.16 5);opacity:0;animation:ipFade .4s {{ d2b }} ease both">8 DE 8</span>
    </sc-if>

    <sc-if value="{{ isC }}" hint-placeholder-val="{{ false }}">
      <svg width="170" height="170" viewBox="0 0 170 170" style="position:absolute;inset:0;overflow:visible">
        <path d="M85 150C40 146 18 112 22 72M85 150c45-4 67-38 63-78" fill="none" stroke="#6E7A3A" stroke-width="2.4" stroke-linecap="round" pathLength="1" stroke-dasharray="1" style="stroke-dashoffset:1;animation:ipDraw 1s {{ d0 }} ease both"></path>
        <sc-for list="{{ leaves }}" as="l" hint-placeholder-count="0"><g transform="{{ l.t }}"><ellipse cx="0" cy="0" rx="13" ry="5.2" fill="{{ l.c }}" stroke="#E4C78A" stroke-width="1.2" style="transform-box:fill-box;transform-origin:{{ l.o }};animation:ipBloom .6s {{ l.d }} cubic-bezier(.3,1.4,.5,1) both"></ellipse></g></sc-for>
        <circle cx="85" cy="78" r="40" fill="oklch(0.52 0.17 5)" stroke="#E4C78A" stroke-width="3" style="transform-box:fill-box;transform-origin:center;animation:ipBloom .8s {{ d2 }} cubic-bezier(.3,1.5,.5,1) both"></circle>
        <circle cx="85" cy="78" r="33" fill="none" stroke="#F3E3B8" stroke-width=".8" stroke-dasharray="2 2.5" style="opacity:0;animation:ipFade .4s {{ d2b }} ease both"></circle>
        <g style="transform-box:fill-box;transform-origin:center;animation:ipRib .6s {{ dRib }} cubic-bezier(.3,1.3,.5,1) both"><path d="M34 126l10-6v20l-10 4 5-9zM136 126l-10-6v20l10 4-5-9z" fill="oklch(0.4 0.15 5)"></path><path d="M42 118h86v20H42z" fill="oklch(0.55 0.17 5)" stroke="#E4C78A" stroke-width="1.4"></path></g>
      </svg>
      <span style="position:absolute;left:0;right:0;top:62px;text-align:center;font:400 31px/1 'Instrument Serif',serif;letter-spacing:.04em;color:#FFF1E6;opacity:0;animation:ipFade .5s {{ d2b }} ease both">SPQR</span>
      <span style="position:absolute;left:0;right:0;top:92px;text-align:center;font:600 7.5px 'Geist Mono',monospace;letter-spacing:.18em;color:#F3E3B8;opacity:0;animation:ipFade .5s {{ d2b }} ease both">8 DE 8</span>
      <span style="position:absolute;left:42px;right:42px;top:118px;height:20px;display:flex;align-items:center;justify-content:center;font:700 7.5px 'Geist Mono',monospace;letter-spacing:.14em;color:#FFF1E6;opacity:0;animation:ipFade .4s {{ dRibT }} ease both">IMPRESCINDIBLES</span>
    </sc-if>

    <sc-if value="{{ isD }}" hint-placeholder-val="{{ false }}">
      <svg width="170" height="170" viewBox="0 0 170 170" style="position:absolute;inset:0;overflow:visible">
        <path d="M85 30v136" stroke="#8A6A2C" stroke-width="3.4" stroke-linecap="round" style="opacity:0;animation:ipFade .4s {{ d0 }} ease both"></path>
        <path d="M50 46h70" stroke="#C9A65E" stroke-width="3.4" stroke-linecap="round" style="opacity:0;animation:ipFade .4s {{ d0 }} ease both"></path>
        <circle cx="50" cy="46" r="3.4" fill="#E4C78A" style="opacity:0;animation:ipFade .4s {{ d0 }} ease both"></circle><circle cx="120" cy="46" r="3.4" fill="#E4C78A" style="opacity:0;animation:ipFade .4s {{ d0 }} ease both"></circle>
        <g style="transform-origin:85px 46px;animation:ipSway 4s {{ dSweep }} ease-in-out infinite"><g style="transform-origin:85px 46px;animation:ipUnroll 1.1s {{ d1 }} cubic-bezier(.3,1.2,.5,1) both">
          <path d="M53 48h64v74l-8 6-8-6-8 6-8-6-8 6-8-6-8 6-8-6z" fill="oklch(0.52 0.17 5)" stroke="#E4C78A" stroke-width="1.6" stroke-linejoin="round"></path>
          <path d="M58 54h54v62H58z" fill="none" stroke="#F3E3B8" stroke-width=".8" stroke-dasharray="2 2"></path>
          <sc-for list="{{ studs }}" as="s" hint-placeholder-count="0"><circle cx="{{ s.x }}" cy="{{ s.y }}" r="5.4" fill="#F3E3B8" stroke="#B48F45" stroke-width="1" style="transform-box:fill-box;transform-origin:center;animation:ipBloom .5s {{ s.d }} cubic-bezier(.3,1.5,.5,1) both"></circle><circle cx="{{ s.x }}" cy="{{ s.y }}" r="2" fill="oklch(0.52 0.17 5)" style="opacity:0;animation:ipFade .3s {{ s.d }} ease both"></circle></sc-for>
        </g></g>
        <g style="transform-box:fill-box;transform-origin:center bottom;animation:ipDrop .9s {{ d2 }} cubic-bezier(.3,1.3,.5,1) both" fill="#E4C78A" stroke="#8A6A2C" stroke-width="1" stroke-linejoin="round">
          <path d="M85 14c-3 0-5 2-5 5l-2 4 4 1 3 7 3-7 4-1-2-4c0-3-2-5-5-5z"></path>
          <path d="M80 24c-8-6-18-7-26-4 6 3 10 7 12 11 4-1 9-3 14-7zM90 24c8-6 18-7 26-4-6 3-10 7-12 11-4-1-9-3-14-7z"></path>
          <path d="M78 33h14l-2 5H80z"></path>
        </g>
      </svg>
      <span style="position:absolute;left:53px;right:53px;top:132px;text-align:center;font:600 7px 'Geist Mono',monospace;letter-spacing:.12em;color:#8A6A2C;opacity:0;animation:ipFade .4s {{ dRibT }} ease both">8 DE 8</span>
    </sc-if>

    <span style="position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:2px solid {{ wave }};opacity:0;animation:ipFlash 1.2s {{ dWave }} ease-out both"></span>
    <sc-for list="{{ tw }}" as="t" hint-placeholder-count="0"><span style="position:absolute;left:{{ t.x }};top:{{ t.y }};width:{{ t.s }};height:{{ t.s }};background:#FFF6DC;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;animation:ipFade .3s {{ dWave }} ease both,ipTw 2.4s {{ t.d }} ease-in-out infinite"></span></sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:200},&quot;design&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;vati&quot;,&quot;B&quot;,&quot;C&quot;,&quot;D&quot;],&quot;default&quot;:&quot;vati&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:170,&quot;tsType&quot;:&quot;number&quot;},&quot;delay&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
let UID=0;
class Component extends DCLogic {
  constructor(p){super(p);this.u='ip'+(++UID);}
  renderVals(){if(window.TRAZO_SITIOS){const S=window.TRAZO_SITIOS,K=window.TRAZO_SITIO_CLAVE;for(const n in K)if(typeof IC!=='undefined'&&S[n])IC[K[n]]=S[n];}else if(!this.__sw){this.__sw=1;setTimeout(()=>{this.__sw=0;this.forceUpdate();},150);}
    const p=this.props;const d=p.design||'vati';const sz=Number(p.size)||170;const T=Number(p.delay)||0;const f=x=>(T+x).toFixed(2)+'s';
    const vati=d==='vati';
    const beads=Array.from({length:32},(_,k)=>{const a=k/32*Math.PI*2;return{x:(85+68*Math.cos(a)).toFixed(1),y:(85+68*Math.sin(a)).toFixed(1),d:f(0.3+k*0.02)};});
    const petals=Array.from({length:8},(_,k)=>({t:`translate(85 85) rotate(${k*45})`,d:f(0.9+k*0.32)}));
    const leaves=[];[-1,1].forEach(s=>{for(let k=0;k<4;k++){const a=(150-k*26)*Math.PI/180;const x=85+s*-63*Math.cos(a),y=82+63*Math.sin(a)*0.98+ (k===0?6:0);leaves.push({t:`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${s*(-60+k*24)})`,c:'oklch(0.58 0.1 125)',o:s<0?'100% 50%':'0% 50%',d:f(0.6+(k*2+(s>0?1:0))*0.28)});}});
    const studs=[];for(let r=0;r<4;r++)for(let c=0;c<2;c++)studs.push({x:72+c*26,y:64+r*15,d:f(1.6+(r*2+c)*0.25)});
    const end={vati:3.1,B:3.8,C:3.6,D:3.9}[d]||3;
    const hv=p.have==null||p.have===''?3:Number(p.have);const SET=p.set!=null&&p.set!==''?String(p.set).split(',').filter(x=>x!=='').map(Number):null;const on=k=>SET?SET.includes(k):hv>k;const vo=k=>on(k)?'1':'.18',vf=k=>on(k)?'none':'grayscale(1)';
    return{vo0:vo(0),vo1:vo(1),vo2:vo(2),vf0:vf(0),vf1:vf(1),vf2:vf(2),d0b:f(vati?.35:0),sz:sz+'px',sc:`scale(${sz/170})`,isVati:vati,isB:d==='B',isC:d==='C',isD:d==='D',
      gG:this.u+'g',gS:this.u+'s',fG:`url(#${this.u}g)`,fS:`url(#${this.u}s)`,
      ray:vati?'rgba(255,236,190,.45)':'oklch(0.75 0.13 5 / .3)',wave:vati?'#F3E3B8':'oklch(0.7 0.16 5)',
      d0:f(0),d1:f(vati?1:.5),d1b:f(vati?1.3:.8),dClink:f(vati?2.25:1.75),dCord:f(vati?2.35:1.85),d2:f(vati?2.4:d==='B'?3.4:d==='C'?2.9:2.9),d2b:f(d==='B'?3.8:3.3),dRib:f(3.2),dRibT:f(3.6),dRay:f(end-0.4),dWave:f(end),dSweep:f(end+0.6),
      beads,petals,leaves,studs,
      tw:[[14,18,9,0],[148,30,7,.8],[150,132,8,1.5],[10,128,6,2.1]].map(([x,y,s,dd])=>({x:x+'px',y:y+'px',s:s+'px',d:f(end+dd)}))};}
}
</script>
</body>
</html>
