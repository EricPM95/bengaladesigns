<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes meIn{0%{opacity:0;transform:scale(.3) rotate(-25deg)}60%{opacity:1;transform:scale(1.06) rotate(3deg)}100%{opacity:1;transform:none}}
@keyframes meLens{0%{opacity:0;offset-distance:0%}10%{opacity:1}85%{opacity:1;offset-distance:100%}100%{opacity:0;offset-distance:100%}}
@keyframes mePop{0%{opacity:0;transform:scale(.15)}60%{opacity:1;transform:scale(1.35)}100%{opacity:1;transform:scale(1)}}
@keyframes meDraw{to{stroke-dashoffset:0}}
@keyframes meCrown{0%{opacity:0;transform:translateY(-14px) scale(.4)}70%{opacity:1;transform:translateY(2px) scale(1.1)}100%{opacity:1;transform:none}}
@keyframes meTw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes meSweep{0%{transform:translateX(-180%) rotate(20deg)}55%,100%{transform:translateX(340%) rotate(20deg)}}
[data-st="1"] *{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important}
[data-st="1"] .meL{display:none}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</helmet>
<div data-st="{{ st }}" style="position:relative;width:{{ w }};height:{{ h }};flex:none">
  <div style="position:absolute;inset:0;animation:meIn 1.1s cubic-bezier(.2,.8,.2,1) both">
  <svg width="100%" height="100%" viewBox="0 0 200 220" style="position:absolute;inset:0;overflow:visible;filter:drop-shadow(0 12px 16px rgba(70,30,40,.35))">
    <defs>
      <linearGradient id="{{ gAu }}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{ au0 }}"></stop><stop offset=".35" stop-color="{{ au1 }}"></stop><stop offset=".55" stop-color="{{ au0 }}"></stop><stop offset="1" stop-color="{{ au2 }}"></stop></linearGradient>
      <radialGradient id="{{ gP }}" cx=".4" cy=".3" r=".85"><stop offset="0" stop-color="#FFF9EE"></stop><stop offset="1" stop-color="#EAD9BC"></stop></radialGradient>
      <clipPath id="{{ cF }}"><circle cx="100" cy="100" r="80"></circle></clipPath>
      <filter id="{{ fBv }}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="b"></feGaussianBlur><feSpecularLighting in="b" surfaceScale="4" specularConstant="1" specularExponent="18" lighting-color="#FFFFFF" result="s"><feDistantLight azimuth="235" elevation="40"></feDistantLight></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"></feComposite><feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".9" k4="0"></feComposite></filter>
      <sc-for list="{{ ms }}" as="m" hint-placeholder-count="6"><clipPath id="{{ m.cid }}"><path d="M-9 -10h18v8c0 7-4 11-9 13-5-2-9-6-9-13z"></path></clipPath></sc-for>
    </defs>
    <circle cx="100" cy="100" r="98" fill="url(#{{ gAu }})" filter="url(#{{ fBv }})"></circle>
    <path d="{{ ticks }}" stroke="rgba(90,66,26,.4)" stroke-width=".8"></path>
    <circle cx="100" cy="100" r="80" fill="url(#{{ gP }})"></circle>
    <g clip-path="url(#{{ cF }})">
      <path d="M30 70c14-10 30-12 44-6 10 4 20-2 30 2s14 14 26 12 22 4 26 14-6 20-2 30-10 20-26 22-28-6-40-2-24 10-36 2-14-20-22-26-12-18-8-28 0-14 8-20z" fill="#E9D7B4" opacity=".7"></path>
      <path d="M54 92c10 4 18 0 26 6M110 84c8 6 20 4 28 12M70 128c12-4 22 4 34 0" fill="none" stroke="#D8C29A" stroke-width="1.2" stroke-dasharray="2 3"></path>
      <path d="{{ chain }}" fill="none" stroke="{{ chC }}" stroke-width="{{ chW }}" stroke-dasharray="{{ chDash }}" stroke-linecap="round" pathLength="100" style="stroke-dashoffset:{{ chOff }};animation:{{ chAn }}"></path>
    </g>
    <circle cx="100" cy="100" r="80" fill="none" stroke="url(#{{ gAu }})" stroke-width="2.4"></circle>
    <sc-for list="{{ ms }}" as="m" hint-placeholder-count="6">
      <g transform="{{ m.t }}">
        <circle r="3" fill="rgba(122,90,40,.35)"></circle>
        <sc-if value="{{ m.on }}" hint-placeholder-val="{{ false }}"><g style="transform-origin:0 0;animation:{{ m.an }}">
          <path d="M-11 -12h22v9c0 9-5 13-11 16-6-3-11-7-11-16z" fill="url(#{{ gAu2 }})" stroke="#8E6824" stroke-width="1"></path>
          <g clip-path="url(#{{ m.cid }})"><rect x="-9" y="-10" width="6" height="24" fill="{{ m.a }}"></rect><rect x="-3" y="-10" width="6" height="24" fill="{{ m.b }}"></rect><rect x="3" y="-10" width="6" height="24" fill="{{ m.c }}"></rect></g>
          <path d="M-9 -10h18v8c0 7-4 11-9 13-5-2-9-6-9-13z" fill="none" stroke="#FFF6DA" stroke-width="1"></path>
          <ellipse cx="-4" cy="-6" rx="3" ry="1.6" fill="rgba(255,255,255,.6)"></ellipse>
        </g></sc-if>
        <text y="{{ m.ty }}" text-anchor="middle" font-family="Geist Mono" font-weight="700" font-size="5.6" letter-spacing=".6" fill="{{ m.tc }}">{{ m.n }}</text>
      </g>
    </sc-for>
    <sc-if value="{{ full }}" hint-placeholder-val="{{ false }}">
      <g transform="translate(100 98)"><g style="transform-origin:0 0;animation:meCrown .8s 3.4s cubic-bezier(.3,1.5,.5,1) both"><path d="M-22 10h44l4-24-14 10-12-16-12 16-14-10z" fill="url(#{{ gAu }})" stroke="#8E6824" stroke-width="1.2" stroke-linejoin="round" filter="url(#{{ fBv }})"></path><circle cx="0" cy="-17" r="3" fill="#CE1126" stroke="#FFF6DA" stroke-width="1"></circle><circle cx="-26" cy="-14" r="2.4" fill="#0055A4"></circle><circle cx="26" cy="-14" r="2.4" fill="#2E8B57"></circle><rect x="-22" y="10" width="44" height="5" rx="1.5" fill="#B88C3A"></rect></g></g>
      <sc-for list="{{ sp }}" as="s" hint-placeholder-count="0"><g transform="{{ s.t }}"><path d="M0 -8C1 -2 2 -1 8 0 2 1 1 2 0 8-1 2-2 1-8 0-2-1-1-2 0-8z" fill="#FFFFFF" style="filter:drop-shadow(0 0 3px rgba(255,225,160,.95));transform-box:fill-box;transform-origin:center;opacity:0;animation:meTw {{ s.dur }} {{ s.d }} ease-in-out infinite"></path></g></sc-for>
    </sc-if>
    <sc-if value="{{ notFull }}" hint-placeholder-val="{{ true }}"><text x="100" y="106" text-anchor="middle" font-family="Instrument Serif" font-size="30" fill="#8E6824">{{ cnt }}</text><text x="100" y="118" text-anchor="middle" font-family="Geist Mono" font-weight="700" font-size="6.5" letter-spacing="1.4" fill="rgba(122,90,40,.75)">DE 6</text></sc-if>
    <g class="meL" style="offset-path:path('{{ lensP }}');offset-rotate:0deg;opacity:0;animation:meLens 2.6s .9s ease-in-out both">
      <circle r="15" fill="rgba(255,255,255,.18)" stroke="url(#{{ gAu }})" stroke-width="4"></circle><path d="M11 11l11 11" stroke="#6B4A1A" stroke-width="5" stroke-linecap="round"></path><ellipse cx="-5" cy="-6" rx="5" ry="2.6" fill="rgba(255,255,255,.7)" transform="rotate(-30 -5 -6)"></ellipse>
    </g>
    <g>
      <path d="M30 196l12-8v-4h116v4l12 8-12 8v4H42v-4z" fill="{{ au2 }}"></path>
      <path d="M42 184h116v24H42z" fill="url(#{{ gAu }})" filter="url(#{{ fBv }})"></path>
      <text x="100" y="200" text-anchor="middle" font-family="Geist Mono" font-weight="700" font-size="8" letter-spacing="1.3" fill="#3A2A10">MICROESTADOS</text>
    </g>
    <defs><linearGradient id="{{ gAu2 }}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF3C8"></stop><stop offset=".5" stop-color="#D6AE5C"></stop><stop offset="1" stop-color="#8E6824"></stop></linearGradient></defs>
  </svg>
  <div style="position:absolute;left:10%;top:9.1%;width:80%;height:72.7%;border-radius:50%;overflow:hidden;pointer-events:none"><span style="position:absolute;top:-30%;bottom:-30%;left:0;width:22%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:meSweep 5s 3s ease-in-out infinite"></span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:240},&quot;got&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;min&quot;:0,&quot;max&quot;:6,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:200,&quot;tsType&quot;:&quot;number&quot;},&quot;anim&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
let UID=0;
const MS=[['va','VATICANO',['#FFE000','#FFFFFF','#FFFFFF']],['sm','S. MARINO',['#5EB6E4','#FFFFFF','#5EB6E4']],['mc','MÓNACO',['#CE1126','#CE1126','#FFFFFF']],['li','LIECHT.',['#002B7F','#CE1126','#CE1126']],['ad','ANDORRA',['#10069F','#FEDD00','#D50032']],['mt','MALTA',['#FFFFFF','#FFFFFF','#CF142B']]];
class Component extends DCLogic {
  constructor(p){super(p);this.u='me'+(++UID);}
  renderVals(){const p=this.props,u=this.u;const sz=Number(p.size)||170;const an=!(p.anim===false||p.anim==='false');
    const N=Math.max(0,Math.min(6,p.got==null||p.got===''?6:Number(p.got)));const full=N===6;
    const pos=MS.map((_,i)=>{const a=(200+i*28)*Math.PI/180;return[100+56*Math.cos(a),104+56*Math.sin(a)];});
    const ms=MS.map(([id,n,f],i)=>{const on=i<N,isNew=i===N-1;return{cid:u+'s'+i,t:'translate('+pos[i][0].toFixed(1)+' '+pos[i][1].toFixed(1)+')',on,n,a:f[0],b:f[1],c:f[2],ty:on?'22':'9',tc:on?'#6B4A1A':'rgba(122,90,40,.45)',
      an:on?('mePop .5s '+(isNew?(1.1+i*0.32):(0.9+i*0.32)).toFixed(2)+'s cubic-bezier(.3,1.5,.5,1) both'):'none'};});
    const lensP='M'+pos.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L');
    const chain='M'+pos.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L');
    const ticks=Array.from({length:120},(_,i)=>{const a=i*Math.PI/60;return 'M'+(100+89*Math.cos(a)).toFixed(1)+' '+(100+89*Math.sin(a)).toFixed(1)+'L'+(100+(i%2?94:96.5)*Math.cos(a)).toFixed(1)+' '+(100+(i%2?94:96.5)*Math.sin(a)).toFixed(1);}).join('');
    const AU=full?['#FFF3C8','#D6AE5C','#8E6824']:['#F6EBCF','#CDB27A','#9C8352'];
    return{st:an?'0':'1',w:sz+'px',h:(sz*1.1).toFixed(1)+'px',gAu:u+'a',gAu2:u+'a2',gP:u+'p',cF:u+'f',fBv:u+'b',au0:AU[0],au1:AU[1],au2:AU[2],ticks,ms,full,notFull:!full,cnt:String(N),lensP,chain,
      chC:full?'#C9A24A':'rgba(122,90,40,.35)',chW:full?'2.4':'1.2',chDash:full?'100':'2 3',chOff:full?'100':'0',chAn:full?'meDraw 1s 2.8s ease both':'none',
      sp:[[-60,106,1],[30,108,.75],[120,105,.9],[-150,107,.65],[200,104,.8]].map(([a,r,s],i)=>({t:'translate('+(100+r*Math.cos(a*Math.PI/180)).toFixed(1)+' '+(100+r*Math.sin(a*Math.PI/180)).toFixed(1)+') scale('+s+')',d:(3.6+i*0.5).toFixed(1)+'s',dur:(2.4+(i%3)*0.5).toFixed(1)+'s'}))};}
}
</script>
</body>
</html>
