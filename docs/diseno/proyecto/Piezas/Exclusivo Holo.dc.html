<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
@keyframes ehIn{0%{opacity:0;transform:scale(.3) rotate(-160deg)}65%{opacity:1;transform:scale(1.08) rotate(10deg)}100%{opacity:1;transform:none}}
@keyframes ehTilt{0%,100%{transform:rotateY(-24deg) rotateX(9deg)}50%{transform:rotateY(24deg) rotateX(-6deg)}}
@keyframes ehHue{to{filter:hue-rotate(360deg)}}
@keyframes ehSheen{0%{transform:translateX(-220%) skewX(-18deg)}55%,100%{transform:translateX(520%) skewX(-18deg)}}
@keyframes ehGlint{0%,100%{opacity:.25;transform:translate(-18%,-8%)}50%{opacity:.85;transform:translate(22%,10%)}}
@keyframes ehTw{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes ehFlag{0%,100%{transform:skewY(-6deg) scaleX(1)}50%{transform:skewY(8deg) scaleX(.92)}}
@keyframes ehGear{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important}}
</style>
</helmet>
<div style="position:relative;width:{{ W }};height:{{ W }};flex:none">
 <div style="position:absolute;left:0;top:0;width:160px;height:160px;transform:scale({{ k }});transform-origin:0 0">
  <div style="position:absolute;inset:0;perspective:700px;animation:ehIn 1.5s {{ d }} cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 0 22px rgba(220,210,255,.45)) drop-shadow(0 18px 20px rgba(0,0,0,.55))">
   <div style="position:absolute;inset:0;transform-style:preserve-3d;animation:ehTilt 7s {{ d2 }} ease-in-out infinite">
    <sc-for list="{{ edge }}" as="z" hint-placeholder-count="10"><span style="position:absolute;inset:0;clip-path:{{ clip }};border-radius:{{ rad }};transform:translateZ({{ z.z }});background:{{ z.bg }}"></span></sc-for>
    <span style="position:absolute;inset:0;clip-path:{{ clip }};border-radius:{{ rad }};background:linear-gradient(135deg,#FFFFFF,#A9B2BF 26%,#F7F8FA 50%,#8E98A7 76%,#EEF1F6)"></span>
    <span style="position:absolute;inset:0;clip-path:{{ clip }};border-radius:{{ rad }};transform:translateZ(.6px) scale(.955);background:linear-gradient(315deg,#FFFFFF,#9AA4B2 40%,#5E6878)"></span>
    <span style="position:absolute;inset:0;clip-path:{{ clip }};border-radius:{{ rad }};transform:translateZ(1.2px) scale(.905);background:linear-gradient(135deg,#3A4256,#9AA4B2)"></span>
    <span style="position:absolute;inset:0;clip-path:{{ clip }};border-radius:{{ rad }};transform:translateZ(1.8px) scale(.89);overflow:hidden;background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.75),transparent 42%),repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.2) 0 1px,transparent 1px 4px),conic-gradient(from 20deg,#FFC9E0,#C9E4FF,#CFF7D8,#FFF0B8,#E2CCFF,#FFC9E0);animation:ehHue 7s linear infinite">
     <span style="position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.4) 0 1.5px,transparent 1.5px 6px);mix-blend-mode:soft-light"></span>
     <span style="position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 55%,rgba(40,55,110,.3) 100%)"></span>
     <span style="position:absolute;top:-30%;bottom:-30%;left:0;width:28%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);animation:ehSheen 3.4s {{ d2 }} ease-in-out infinite"></span>
    </span>
    <span style="position:absolute;inset:0;transform:translateZ(9px)">
     <svg width="160" height="160" viewBox="0 0 200 200" style="position:absolute;inset:0;overflow:visible">
      <defs>
       <linearGradient id="{{ u }}sv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset=".3" stop-color="#E4E9F2"></stop><stop offset=".5" stop-color="#F8F6FF"></stop><stop offset=".78" stop-color="#AEB7C6"></stop><stop offset="1" stop-color="#E8ECF3"></stop></linearGradient>
       <linearGradient id="{{ u }}sd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C3CBD8"></stop><stop offset="1" stop-color="#6E788C"></stop></linearGradient>
       <linearGradient id="{{ u }}fa" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2F5FA"></stop><stop offset=".34" stop-color="#FFFFFF"></stop><stop offset=".7" stop-color="#C2CAD7"></stop><stop offset="1" stop-color="#8A94A6"></stop></linearGradient>
       <linearGradient id="{{ u }}ho" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A2244"></stop><stop offset="1" stop-color="#3C4A7C"></stop></linearGradient>
       <linearGradient id="{{ u }}pi" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#97A1B2"></stop></linearGradient>
       <linearGradient id="{{ u }}cs" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E2848" stop-opacity="0"></stop><stop offset=".5" stop-color="#1E2848" stop-opacity=".04"></stop><stop offset="1" stop-color="#1E2848" stop-opacity=".42"></stop></linearGradient>
       <filter id="{{ u }}em" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="b"></feGaussianBlur>
        <feSpecularLighting in="b" surfaceScale="3" specularConstant=".85" specularExponent="20" lighting-color="#FFFFFF" result="s"><feDistantLight azimuth="225" elevation="42"></feDistantLight></feSpecularLighting>
        <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"></feComposite>
        <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0" result="lit"></feComposite>
        <feDropShadow in="lit" dx="1.6" dy="2.4" stdDeviation="1.3" flood-color="#1E2848" flood-opacity=".55"></feDropShadow>
       </filter>
       <clipPath id="{{ u }}fc"><path d="{{ outline }}"></path></clipPath>
      </defs>

      <sc-if value="{{ isRoma }}" hint-placeholder-val="{{ false }}">
       <g filter="url(#{{ u }}em)" transform="translate(0 -4)">
        <path d="{{ inner }}" fill="url(#{{ u }}sd)"></path>
        <sc-for list="{{ innerHoles }}" as="h" hint-placeholder-count="0"><path d="{{ h }}" fill="url(#{{ u }}ho)" opacity=".85"></path></sc-for>
        <path d="{{ plinth }}" fill="url(#{{ u }}sd)"></path>
        <path d="{{ outline }}" fill="url(#{{ u }}fa)"></path>
        <sc-for list="{{ holes }}" as="h" hint-placeholder-count="0"><path d="{{ h.o }}" fill="url(#{{ u }}ho)"></path><path d="{{ h.b }}" fill="#56669A" opacity=".75"></path><path d="{{ h.j }}" fill="#E6ECF8" opacity=".6"></path></sc-for>
        <sc-for list="{{ pils }}" as="h" hint-placeholder-count="0"><path d="{{ h }}" fill="url(#{{ u }}pi)"></path></sc-for>
        <sc-for list="{{ corn }}" as="c" hint-placeholder-count="0"><path d="{{ c.s }}" fill="#1E2848" opacity=".26"></path><path d="{{ c.l }}" fill="#FCFDFF"></path></sc-for>
        <rect x="0" y="0" width="200" height="200" fill="url(#{{ u }}cs)" clip-path="url(#{{ u }}fc)"></rect>
       </g>
       <text x="100" y="164" text-anchor="middle" font-family="Instrument Serif" font-size="22" letter-spacing="5" fill="url(#{{ u }}sv)" filter="url(#{{ u }}em)">ROMA</text>
       <text x="100" y="182" text-anchor="middle" font-family="Geist Mono" font-weight="700" fill="#1A2244" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round" paint-order="stroke" font-size="14" letter-spacing="3">2027</text>
      </sc-if>

      <sc-if value="{{ isFund }}" hint-placeholder-val="{{ false }}">
       <g filter="url(#{{ u }}em)">
        <circle cx="100" cy="88" r="52" fill="none" stroke="url(#{{ u }}sv)" stroke-width="3"></circle>
        <circle cx="100" cy="88" r="46" fill="none" stroke="url(#{{ u }}sd)" stroke-width="1" stroke-dasharray="1.5 3"></circle>
        <sc-for list="{{ facets }}" as="f" hint-placeholder-count="0"><path d="{{ f.d }}" fill="{{ f.f }}"></path></sc-for>
        <circle cx="100" cy="88" r="9" fill="url(#{{ u }}sv)"></circle>
        <circle cx="100" cy="88" r="3.5" fill="#3A4670"></circle>
       </g>
       <text x="100" y="154" text-anchor="middle" font-family="Geist Mono" font-weight="700" fill="#1A2244" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round" paint-order="stroke" font-size="10" letter-spacing="2.6">VIAJERO</text>
       <text x="100" y="171" text-anchor="middle" font-family="Instrument Serif" font-size="17" letter-spacing="2" fill="url(#{{ u }}sv)" filter="url(#{{ u }}em)">FUNDADOR</text>
      </sc-if>

      <sc-if value="{{ isPion }}" hint-placeholder-val="{{ false }}">
       <g filter="url(#{{ u }}em)" transform="translate(10 4) scale(.9)">
        <path d="M30 128L72 70L110 128Z" fill="url(#{{ u }}sd)" opacity=".85"></path>
        <path d="M40 128L100 48L100 128Z" fill="url(#{{ u }}sv)"></path>
        <path d="M100 48L160 128L100 128Z" fill="url(#{{ u }}sd)"></path>
        <path d="M100 48L86 67L93 63L100 71L106 62L114 67Z" fill="#FFFFFF"></path>
        <path d="M72 70L64 81L70 79L75 84L80 79Z" fill="#F4F6FA"></path>
        <path d="M54 128L70 112L62 100L80 90L74 78L92 64L98 52" fill="none" stroke="#3A4670" stroke-width="1.8" stroke-dasharray="2.5 3.5" stroke-linecap="round"></path>
        <path d="M100 48V18" stroke="url(#{{ u }}sd)" stroke-width="2.2" stroke-linecap="round"></path>
        <g style="transform-origin:100px 20px;animation:ehFlag 2.4s ease-in-out infinite"><path d="M100 18Q112 15 124 21Q112 25 100 32Z" fill="url(#{{ u }}sv)"></path></g>
        <path d="M24 128H176" stroke="url(#{{ u }}sv)" stroke-width="2.4" stroke-linecap="round"></path>
       </g>
       <text x="100" y="146" text-anchor="middle" font-family="Instrument Serif" font-size="17" letter-spacing="2" fill="url(#{{ u }}sv)" filter="url(#{{ u }}em)">PIONERO</text>
       <text x="100" y="160" text-anchor="middle" font-family="Geist Mono" font-weight="700" fill="#1A2244" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round" paint-order="stroke" font-size="8.4" letter-spacing="1" textLength="92" lengthAdjust="spacingAndGlyphs">LOS PRIMEROS 100</text>
      </sc-if>

      <sc-if value="{{ isProb }}" hint-placeholder-val="{{ false }}">
       <g filter="url(#{{ u }}em)">
        <circle cx="100" cy="84" r="50" fill="none" stroke="url(#{{ u }}sv)" stroke-width="3"></circle>
        <circle cx="100" cy="84" r="44" fill="none" stroke="url(#{{ u }}sd)" stroke-width="1" stroke-dasharray="1.5 3"></circle>
        <text x="100" y="96" text-anchor="middle" font-family="Instrument Serif" font-size="34" letter-spacing="1" textLength="78" lengthAdjust="spacingAndGlyphs" fill="url(#{{ u }}sv)">ROUTY</text>
       </g>
       <text x="100" y="154" text-anchor="middle" font-family="Instrument Serif" font-size="17" letter-spacing="2" fill="url(#{{ u }}sv)" filter="url(#{{ u }}em)">PROBADOR</text>
       <text x="100" y="167" text-anchor="middle" font-family="Geist Mono" font-weight="700" fill="#1A2244" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round" paint-order="stroke" font-size="8.4" letter-spacing="1" textLength="92" lengthAdjust="spacingAndGlyphs">ANTES QUE NADIE</text>
      </sc-if>
     </svg>
    </span>
    <span style="position:absolute;inset:0;clip-path:{{ clip }};border-radius:{{ rad }};transform:translateZ(10px);overflow:hidden;pointer-events:none"><span style="position:absolute;inset:-10%;background:radial-gradient(ellipse 60% 40% at 32% 22%,rgba(255,255,255,.7),transparent 60%);animation:ehGlint 7s {{ d2 }} ease-in-out infinite"></span></span>
   </div>
  </div>
  <sc-for list="{{ sp }}" as="p" hint-placeholder-count="4"><span style="position:absolute;left:{{ p.x }};top:{{ p.y }};width:{{ p.s }};height:{{ p.s }};background:#FFFFFF;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:ehTw 2.6s {{ p.d }} ease-in-out infinite"></span></sc-for>
 </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:220},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;roma&quot;,&quot;fundador&quot;,&quot;pionero&quot;,&quot;probador&quot;],&quot;default&quot;:&quot;roma&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:200,&quot;tsType&quot;:&quot;number&quot;},&quot;delay&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
let UID=0;
const OCT='polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)';
const SHIELD='polygon(50% 0,100% 10%,100% 52%,92% 72%,50% 100%,8% 72%,0 52%,0 10%)';
const HEX='polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)';
const n1=v=>v.toFixed(1);
function colosseum(u){
  const cx=100,R=72,e=7,T=1.22;
  const X=t=>cx+R*Math.sin(t);const xL=X(-T),xR=X(T);
  const yF=(y,x)=>y+e*Math.sqrt(Math.max(0,1-Math.pow((x-cx)/R,2)));
  const crv=(x0,x1,y,steps)=>{const s=steps||16,o=[];for(let i=0;i<=s;i++){const x=x0+(x1-x0)*i/s;o.push(n1(x)+' '+n1(yF(y,x)));}return o;};
  const B=138,L1=112,L2=88,L3=66,AT=50;
  const jag=[[xR,L2],[162,84],[158,78],[155,72],[150,L3],[145,63.5],[140,58],[134,55],[130,AT]];
  const outline='M'+crv(xL,xR,B).join('L')+'L'+jag.map(([x,y])=>n1(x)+' '+n1(yF(y,x))).join('L')+'L'+crv(130,xL,AT).join('L')+'Z';
  const inner='M'+crv(116,166,57,10).join('L')+'L'+crv(166,116,96,10).join('L')+'Z';
  const innerHoles=[];for(let i=0;i<6;i++){const x=120+i*7.6,y0=yF(66,x+2.4),y1=yF(80,x+2.4);innerHoles.push(`M${n1(x)} ${n1(y1)}V${n1(y0+2.4)}A2.4 2.4 0 0 1 ${n1(x+4.8)} ${n1(y0+2.4)}V${n1(y1)}Z`);}
  const plinth='M'+crv(xL-3,xR+3,B).join('L')+'L'+crv(xR+3,xL-3,B+5).join('L')+'Z';
  const tiers=[[L1,B,'a',xR],[L2,L1,'a',xR],[L3,L2,'a',151],[AT,L3,'w',131]];
  const n=12,holes=[],pils=[],corn=[];
  tiers.forEach(([yt,yb,kd,lim])=>{
    for(let i=0;i<n;i++){const xa=X(-T+2*T*i/n),xb=X(-T+2*T*(i+1)/n),w=xb-xa;if(xa+w*.85>lim)continue;
      const px=xa+w*.2,pw=w*.6,rr=pw/2,mx=px+rr,top=yF(yt,mx)+2.6,bot=yF(yb,mx)-1.4;
      if(kd==='a'){
        holes.push({o:`M${n1(px)} ${n1(bot)}V${n1(top+rr)}A${n1(rr)} ${n1(rr)} 0 0 1 ${n1(px+pw)} ${n1(top+rr)}V${n1(bot)}Z`,
          b:`M${n1(px+pw*.3)} ${n1(bot)}V${n1(top+rr+2.2)}A${n1(rr*.42)} ${n1(rr*.42)} 0 0 1 ${n1(px+pw*.3+rr*.84)} ${n1(top+rr+2.2)}V${n1(bot)}Z`,
          j:`M${n1(px+pw-Math.max(.7,w*.06))} ${n1(bot)}V${n1(top+rr)}H${n1(px+pw)}V${n1(bot)}Z`});
      }else if(i%2){const wy=yF(yt,mx)+5,wb=yF(yb,mx)-5;holes.push({o:`M${n1(px+pw*.2)} ${n1(wb)}V${n1(wy)}H${n1(px+pw*.8)}V${n1(wb)}Z`,b:'M0 0',j:'M0 0'});}
      if(i>0){const pw2=Math.max(.8,w*.13);pils.push(`M${n1(xa-pw2/2)} ${n1(yF(yb,xa))}V${n1(yF(yt,xa)+2.2)}H${n1(xa+pw2/2)}V${n1(yF(yb,xa))}Z`,`M${n1(xa-pw2)} ${n1(yF(yt,xa)+3.6)}V${n1(yF(yt,xa)+2)}H${n1(xa+pw2)}V${n1(yF(yt,xa)+3.6)}Z`);}}
    const x1=Math.min(lim,xR);
    corn.push({l:'M'+crv(xL-1,x1+1,yt-1.4,12).join('L')+'L'+crv(x1+1,xL-1,yt+1.4,12).join('L')+'Z',s:'M'+crv(xL,x1,yt+1.4,12).join('L')+'L'+crv(x1,xL,yt+4,12).join('L')+'Z'});});
  return{outline,inner,innerHoles,plinth,holes,pils,corn};}
function facets(){const o=[],c=[100,88];for(let i=0;i<8;i++){const a=-Math.PI/2+i*Math.PI/4,r=i%2?34:56;const t=[c[0]+r*Math.cos(a),c[1]+r*Math.sin(a)];
  const al=a-Math.PI/8,ar=a+Math.PI/8,ri=12;const l=[c[0]+ri*Math.cos(al),c[1]+ri*Math.sin(al)],rp=[c[0]+ri*Math.cos(ar),c[1]+ri*Math.sin(ar)];
  const P=pp=>pp.map(q=>n1(q[0])+' '+n1(q[1])).join('L');
  o.push({d:'M'+P([c,t,l])+'Z',f:'url(#U-sv)'},{d:'M'+P([c,t,rp])+'Z',f:'url(#U-sd)'});}return o;}
function gear(){const cx=100,cy=86,ro=50,ri=42,n=12;let d='';for(let i=0;i<n;i++){const a0=i/n*Math.PI*2,a1=a0+Math.PI*2/n;const s=[a0,a0+.09,a0+.17,a1-.17,a1-.09];
  const pts=[[ri,s[0]],[ri,s[1]],[ro,s[2]],[ro,s[3]],[ri,s[4]]];pts.forEach(([r,a],j)=>{d+=(i===0&&j===0?'M':'L')+n1(cx+r*Math.cos(a))+' '+n1(cy+r*Math.sin(a));});}
  d+='Z';const h=24;d+=`M${cx+h} ${cy}A${h} ${h} 0 1 0 ${cx-h} ${cy}A${h} ${h} 0 1 0 ${cx+h} ${cy}Z`;return d;}
class Component extends DCLogic {
  constructor(p){super(p);this.u='eh'+(++UID);}
  renderVals(){const p=this.props;const kind=p.kind||'roma';const sz=Number(p.size)||160;const d=Number(p.delay)||0;const u=this.u;
    const SH={fundador:[OCT,'0'],pionero:[SHIELD,'0'],roma:['none','50%'],probador:[HEX,'0']}[kind]||['none','50%'];
    const base={u,W:sz+'px',k:sz/160,clip:SH[0],rad:SH[1],d:d.toFixed(2)+'s',d2:(d+1.6).toFixed(2)+'s',
      isRoma:kind==='roma',isFund:kind==='fundador',isPion:kind==='pionero',isProb:kind==='probador',
      edge:Array.from({length:10},(_,j)=>({z:(-(j+1)*1.4).toFixed(1)+'px',bg:j<1?'linear-gradient(135deg,#E9EDF3,#8E98A7)':'linear-gradient(135deg,#B9C1CC,#4E5868 70%,#3A4252)'})),
      sp:[['4%','6%','14px',0],['84%','12%','10px',.8],['78%','82%','12px',1.5],['10%','76%','8px',2.1]].map(([x,y,s,dd])=>({x,y,s,d:(d+dd).toFixed(2)+'s'})),
      outline:'M0 0',inner:'M0 0',innerHoles:[],plinth:'M0 0',holes:[],pils:[],corn:[],facets:[],gear:'M0 0'};
    if(kind==='roma')Object.assign(base,colosseum(u));
    if(kind==='fundador')base.facets=facets().map(f=>({d:f.d,f:f.f.replace('U-',u)}));
    if(kind==='probador')base.gear=gear();
    return base;}
}
</script>
</body>
</html>
