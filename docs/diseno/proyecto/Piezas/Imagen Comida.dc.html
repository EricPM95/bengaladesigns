<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:{{ W }};height:{{ H }};overflow:hidden;background:{{ bg }};flex:none">
  <span style="position:absolute;inset:0;background:{{ glow }}"></span>
  <span style="position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 16px)"></span>
  <svg viewBox="0 0 120 80" preserveAspectRatio="xMidYMid meet" style="position:absolute;inset:0;width:100%;height:100%" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(78 40) scale(.82)" stroke="{{ ink }}" stroke-width="2.4" opacity="{{ op }}">
      <path d="M-16 -22v12a5 5 0 0 0 10 0v-12M-11 -22v44M-16 -22M-11 -10v32"></path>
      <path d="M13 -22c-6 5-6 15-2 20h6v24M17 -22v44"></path>
    </g>
    <g transform="translate(78 40) scale(.82)" stroke="#FFFFFF" stroke-opacity=".5" stroke-width=".7"><path d="M-16.8 -21.5v11.5M13.2 -21.5c-5 4.6-5 14-1.6 18.5"></path></g>
    <sc-if value="{{ isN }}" hint-placeholder-val="{{ false }}"><g fill="#F3D88F"><circle cx="14" cy="12" r="1.1"></circle><circle cx="104" cy="16" r="1.4"></circle><circle cx="96" cy="64" r=".9"></circle><circle cx="24" cy="60" r="1.2"></circle><circle cx="82" cy="10" r=".8"></circle></g></sc-if>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:170},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;comer&quot;,&quot;cenar&quot;],&quot;default&quot;:&quot;comer&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;100%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;h&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;100%&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const n=String(this.props.kind||'comer')==='cenar';
    const w=this.props.w==null?'100%':this.props.w,h=this.props.h==null?'100%':this.props.h;
    return{isN:n,W:typeof w==='number'?w+'px':w,H:typeof h==='number'?h+'px':h,
      bg:n?'linear-gradient(160deg,#2A3050 0%,#1C2230 60%,#141826 100%)':'linear-gradient(160deg,#F2C48A 0%,#E39A58 55%,#C46F32 100%)',
      glow:n?'radial-gradient(60% 80% at 50% 45%,rgba(243,216,143,.2),transparent 70%)':'radial-gradient(60% 80% at 50% 40%,rgba(255,240,200,.45),transparent 70%)',
      ink:n?'#F3D88F':'#FFF6E2',op:n?1:.95};
  }
}
</script>
</body>
</html>
