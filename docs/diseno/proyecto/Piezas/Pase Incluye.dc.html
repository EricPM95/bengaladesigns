<style>.pcS{scrollbar-width:none}.pcS::-webkit-scrollbar{display:none}

@keyframes piTw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
@keyframes piSpin{to{transform:rotate(360deg)}}
@keyframes piDrop{0%{opacity:0;transform:translateY(-8px)}30%{opacity:1}100%{opacity:0;transform:translateY(26px)}}
@keyframes piWave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes piPulse{0%{opacity:.5;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
@keyframes piFan1{from{opacity:0;transform:translate(60px,0) rotate(0)}to{opacity:1;transform:translate(0,0) rotate(-9deg)}}

@keyframes piFly{from{offset-distance:0%}to{offset-distance:100%}}
@keyframes piSheen{0%{transform:translateX(-120%) skewX(-18deg)}60%,100%{transform:translateX(260%) skewX(-18deg)}}
@keyframes piHint{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
