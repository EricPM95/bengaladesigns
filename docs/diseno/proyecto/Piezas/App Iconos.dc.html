<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
a:hover{color:oklch(0.55 0.17 5)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
</style>
</helmet>
<div style="min-height:100vh;background:radial-gradient(ellipse 70% 60% at 50% 20%,#F1E8D6 0%,#E0D3BA 75%);padding:44px 48px 80px;font-family:'Geist',system-ui,sans-serif;color:#1C2230;display:flex;flex-direction:column;gap:72px">

  <section id="1" style="display:flex;flex-direction:column;gap:22px;max-width:1080px">
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px">
      <div style="display:flex;flex-direction:column;gap:8px">
        <span style="font:600 10px 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(28,34,48,.55)">01 · Los iconos de la app</span>
        <span style="font:400 44px/1 'Instrument Serif',serif">Una sola <em style="color:oklch(0.55 0.17 5)">familia</em></span>
        <span style="max-width:560px;font:400 14px/1.5 'Geist';color:rgba(28,34,48,.65);text-wrap:pretty">De línea, 1,7 de grosor, puntas y esquinas redondeadas, sobre 24 px. Cada cosa lleva siempre el mismo icono.</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{ legend }}" as="l" hint-placeholder-count="3">
          <span style="height:34px;display:flex;align-items:center;gap:8px;padding:0 14px 0 10px;border-radius:999px;background:#FFFDF8;border:1px solid rgba(28,34,48,.07);font:500 12.5px 'Geist'"><span style="width:14px;height:14px;border-radius:50%;background:{{ l.c }}"></span>{{ l.n }}</span>
        </sc-for>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px">
      <sc-for list="{{ icons }}" as="i" hint-placeholder-count="30">
        <div style="min-height:118px;border-radius:20px;background:#FFFDF8;border:1px solid rgba(28,34,48,.07);box-shadow:0 1px 2px rgba(28,34,48,.04);padding:14px 12px 12px;display:flex;flex-direction:column;gap:10px">
          <span style="width:44px;height:44px;border-radius:14px;background:{{ i.bg }};color:{{ i.c }};display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{ i.d }}"></path></svg></span>
          <span style="display:flex;flex-direction:column;gap:2px">
            <span style="font:400 18px/1.05 'Instrument Serif',serif">{{ i.n }}</span>
            <span style="font:400 11px/1.3 'Geist';color:rgba(28,34,48,.55)">{{ i.u }}</span>
          </span>
        </div>
      </sc-for>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
      <div style="display:flex;flex-direction:column;gap:10px">
        <span style="font:600 10px 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(28,34,48,.55)">La cabecera</span>
        <div style="width:390px;border-radius:24px;background:#F5EFE4;border:1px solid rgba(28,34,48,.08);padding:14px 10px 14px 20px;display:flex;align-items:center;gap:8px">
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font:400 30px/1 'Instrument Serif',serif">Roma</span><span style="font:500 11px 'Geist Mono',monospace;letter-spacing:.06em;color:rgba(28,34,48,.55)">13 – 16 oct · 2 personas</span></span>
          <button aria-label="Presupuesto" style="width:44px;height:44px;border:none;border-radius:50%;background:transparent;color:#1C2230;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:rgba(28,34,48,.06)"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{ ic.presupuesto }}"></path></svg></button>
          <button aria-label="Avisos (1 nuevo)" style="position:relative;width:44px;height:44px;border:none;border-radius:50%;background:transparent;color:#1C2230;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:rgba(28,34,48,.06)"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{ ic.avisos }}"></path></svg><span style="position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:oklch(0.55 0.17 5);box-shadow:0 0 0 2px #F5EFE4"></span></button>
          <button aria-label="Perfil y mis viajes" style="width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="width:34px;height:34px;border-radius:50%;background:#1C2230;color:#FFFDF8;display:flex;align-items:center;justify-content:center;font:400 18px/1 'Instrument Serif',serif;box-shadow:0 0 0 2px #F5EFE4,0 0 0 3.5px oklch(0.55 0.17 5)">E</span></button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <span style="font:600 10px 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(28,34,48,.55)">La barra de abajo · toca una pestaña</span>
        <nav style="width:390px;border-radius:24px;background:#1C2230;padding:8px 6px 10px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))">
          <sc-for list="{{ demoTabs }}" as="t" hint-placeholder-count="5">
            <button onClick="{{ t.pick }}" aria-current="{{ t.cur }}" style="position:relative;height:56px;border:none;background:transparent;color:{{ t.fg }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer">
              <span style="width:52px;height:30px;border-radius:999px;background:{{ t.pill }};color:{{ t.ic }};display:flex;align-items:center;justify-content:center;transition:background .3s,color .3s"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{ t.icon }}"></path></svg></span>
              <span style="font:{{ t.fw }} 11px 'Geist'">{{ t.n }}</span>
              <sc-if value="{{ t.alert }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:2px;right:calc(50% - 26px);width:16px;height:16px;border-radius:50%;background:oklch(0.8 0.14 75);color:#1C2230;box-shadow:0 0 0 2px #1C2230;font:700 10px/16px 'Geist';text-align:center">!</span></sc-if>
            </button>
          </sc-for>
        </nav>
      </div>
    </div>
  </section>

  
</div>
</x-dc>

  state={demoTab:'hoy',seen:2,toast:null,seenE:1,skipE:[],addE:[],moreE:false};

      stopsFree:[['Plaza de San Pedro',''],['Museos Vaticanos y Capilla Sixtina','9:00'],['Basílica de San Pedro',''],['Comida en el Borgo',''],['Paseo por Trastevere','']].map(([name,res],i,a)=>({n:String(i+1),name,res,hasRes:!!res,line:i<a.length-1,
        dBg:res?GREEN:'#FFFFFF',dBd:res?GREEN:'rgba(28,34,48,.25)',dFg:res?'#fff':INK})),
      next:{has:!!nx,none:!nx,n:String(seen+1),name:nx?nx.name:'',walk:nx?nx.walk:''},
      seenTxt:'',
      stopsPago:PAGO.map((p,i)=>{const d=i<seen,now=i===seen;return{name:p.name,now,mark:d?'✓':String(i+1),
        dBg:d?GREEN:now?ROSE:'transparent',dBd:d?GREEN:now?ROSE:'rgba(28,34,48,.25)',dFg:d||now?'#fff':INK,
        fg:d?'oklch(0.42 0.09 150)':INK,font:now?"400 18px/1.15 'Instrument Serif',serif":"400 14px/1.3 'Geist'",bd:i<PAGO.length-1?'rgba(28,34,48,.07)':'transparent'};}),
      seen:()=>this.setState(st=>({seen:Math.min(PAGO.length,st.seen+1)})),
      undo:()=>this.setState({seen:2}),
      howTo:()=>this.toast('2c','Abriendo el mapa…'),
      alt:()=>this.toast('2c','Abriendo la alternativa…'),
      tripDays:[['LUN','13'],['MAR','14'],['MIÉ','15'],['JUE','16']].map(([w,n])=>({w,n})),
      upload:()=>this.toast('2d','Abriendo tus fotos…'),
      newTrip:()=>this.toast('2d','Empezando un viaje nuevo…'),
      toastTxt:s.toast?s.toast.txt:'',
      notes:[
        {k:'1',t:'El autobús es a la vez «Excursión» y «Llegada en autobús». Si quieres que cada cosa tenga un icono único, la excursión podría ser una montaña o una mochila.'},
        {k:'2',t:'Aquí el viaje es del 13 al 16 de octubre; en «Reservas v4» es del 10 al 14 de agosto. He usado las fechas de este prototipo.'},
        {k:'3',t:'En «De pago», el ✓ Visto funciona: marca la parada en verde y pasa a la siguiente.'}]};
  }
}
