<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes ceIn{0%{opacity:0;transform:scale(.2) rotate(-30deg)}65%{opacity:1;transform:scale(1.06) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes ceQ{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes ceFall{0%{transform:translate(0,-20px) rotate(0)}100%{transform:translate(var(--dx),120px) rotate(320deg)}}
@keyframes ceDrift{0%{transform:translate(0,0)}100%{transform:translate(70px,-30px) rotate(200deg)}}
@keyframes ceSun{to{transform:rotate(360deg)}}
@keyframes ceRing{to{stroke-dashoffset:0}}
@keyframes ceGlow{0%,100%{opacity:.35}50%{opacity:.85}}
@keyframes ceTw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes ceSweep{0%{transform:translateX(-180%) rotate(20deg)}55%,100%{transform:translateX(340%) rotate(20deg)}}
@keyframes ceSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</helmet>
<div style="position:relative;width:{{ sz }};height:{{ sz }};flex:none;animation:ceIn 1.1s {{ d0 }} cubic-bezier(.2,.8,.2,1) both">
  <sc-if value="{{ full }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:-10%;border-radius:50%;background:conic-gradient(from -90deg,oklch(0.85 0.1 140 / .6),oklch(0.9 0.12 85 / .6),oklch(0.8 0.12 45 / .6),oklch(0.88 0.06 230 / .6),oklch(0.85 0.1 140 / .6));filter:blur(14px);animation:ceGlow 4s {{ dFx }} ease-in-out infinite,ceSpin 18s linear infinite"></span></sc-if>
  <svg width="100%" height="100%" viewBox="0 0 200 200" style="position:absolute;inset:0;overflow:visible;filter:{{ shF }}">
    <defs>
      <linearGradient id="{{ gFr }}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset=".45" stop-color="#E9DCC3"></stop><stop offset="1" stop-color="#A8916C"></stop></linearGradient>
      <radialGradient id="{{ gBoss }}" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset=".6" stop-color="#F1E6D0"></stop><stop offset="1" stop-color="#C9B58F"></stop></radialGradient>
      <filter id="{{ fBv }}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="b"></feGaussianBlur><feSpecularLighting in="b" surfaceScale="4" specularConstant="1" specularExponent="18" lighting-color="#FFFFFF" result="s"><feDistantLight azimuth="235" elevation="40"></feDistantLight></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"></feComposite><feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".9" k4="0"></feComposite></filter>
      <filter id="{{ fIn }}" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.4"></feGaussianBlur></filter>
      <linearGradient id="{{ gAu }}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{ au0 }}"></stop><stop offset=".35" stop-color="{{ au1 }}"></stop><stop offset=".55" stop-color="{{ au0 }}"></stop><stop offset="1" stop-color="{{ au2 }}"></stop></linearGradient>
      <sc-for list="{{ qs }}" as="q" hint-placeholder-count="4"><radialGradient id="{{ q.gem }}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset=".3" stop-color="{{ q.g0 }}"></stop><stop offset="1" stop-color="{{ q.g1 }}"></stop></radialGradient></sc-for>
      <radialGradient id="{{ gDome }}" cx=".36" cy=".26" r=".8"><stop offset="0" stop-color="rgba(255,255,255,.55)"></stop><stop offset=".45" stop-color="rgba(255,255,255,.08)"></stop><stop offset="1" stop-color="rgba(0,0,0,.18)"></stop></radialGradient>
      <clipPath id="{{ cF }}"><circle cx="100" cy="100" r="84"></circle></clipPath>
      <sc-for list="{{ qs }}" as="q" hint-placeholder-count="4"><clipPath id="{{ q.cid }}"><path d="{{ q.clip }}"></path></clipPath><linearGradient id="{{ q.gid }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{ q.s0 }}"></stop><stop offset="1" stop-color="{{ q.s1 }}"></stop></linearGradient></sc-for>
    </defs>
    <sc-if value="{{ notFull }}" hint-placeholder-val="{{ true }}"><circle cx="100" cy="100" r="98" fill="url(#{{ gAu }})" filter="url(#{{ fBv }})"></circle><path d="{{ ticks }}" stroke="rgba(90,66,26,.35)" stroke-width=".7"></path><circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,250,232,.85)" stroke-width="1"></circle></sc-if>
    <sc-if value="{{ full }}" hint-placeholder-val="{{ false }}"><circle cx="100" cy="100" r="100" fill="url(#{{ gAu }})" filter="url(#{{ fBv }})"></circle><path d="{{ ticks }}" stroke="rgba(90,66,26,.45)" stroke-width=".8"></path><circle cx="100" cy="100" r="99" fill="none" stroke="rgba(120,90,40,.5)" stroke-width="1"></circle><circle cx="100" cy="100" r="88" fill="none" stroke="#FFF6DA" stroke-width="1.4"></circle></sc-if>
    <sc-for list="{{ qs }}" as="q" hint-placeholder-count="4"><path d="{{ q.arc }}" fill="none" stroke="rgba(70,48,16,.35)" stroke-width="6.4" stroke-linecap="round"></path><path d="{{ q.arc }}" fill="none" stroke="{{ q.ring }}" stroke-width="4.6" stroke-linecap="round"></path><path d="{{ q.arc }}" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.2" stroke-linecap="round" transform="translate(-.6 -.6)"></path>
      <circle cx="{{ q.bx }}" cy="{{ q.by }}" r="12.5" fill="url(#{{ gAu }})" filter="url(#{{ fBv }})"></circle><circle cx="{{ q.bx }}" cy="{{ q.by }}" r="9.6" fill="url(#{{ q.gem }})" style="opacity:{{ q.gO }}"></circle><circle cx="{{ q.bx }}" cy="{{ q.by }}" r="9.6" fill="#E8E1D2" style="opacity:{{ q.gOff }}"></circle><ellipse cx="{{ q.hx }}" cy="{{ q.hy }}" rx="3.6" ry="2.2" fill="rgba(255,255,255,.7)" transform="{{ q.hr }}"></ellipse>
      <g transform="{{ q.badge }}" fill="none" stroke="{{ q.bIc }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ q.ic }}"></path></g></sc-for>
    <g clip-path="url(#{{ cF }})">
      <rect x="0" y="0" width="200" height="200" fill="#E9E4DA"></rect>
      <sc-for list="{{ qs }}" as="q" hint-placeholder-count="4">
        <g clip-path="url(#{{ q.cid }})">
          <g style="transform-box:view-box;transform-origin:100px 100px;animation:{{ q.an }}">
            <rect x="0" y="0" width="200" height="200" fill="url(#{{ q.gid }})"></rect>
            <ellipse cx="100" cy="190" rx="130" ry="52" fill="{{ q.gr }}"></ellipse>
            <sc-if value="{{ q.sum }}" hint-placeholder-val="{{ false }}"><g style="transform-origin:150px 48px;animation:ceSun 14s linear infinite"><path d="M150 28v-8M150 76v-8M130 48h-8M178 48h-8M136 34l-5-5M169 67l-5-5M136 62l-5 5M169 29l-5 5" stroke="oklch(0.86 0.15 85)" stroke-width="2.4" stroke-linecap="round"></path></g><circle cx="150" cy="48" r="12" fill="oklch(0.88 0.15 88)"></circle></sc-if>
            <sc-for list="{{ q.fol }}" as="b" hint-placeholder-count="0"><circle cx="{{ b.x }}" cy="{{ b.y }}" r="{{ b.r }}" fill="{{ b.c }}" style="transform-box:fill-box;transform-origin:center;animation:ceQ .5s {{ b.d }} cubic-bezier(.3,1.5,.5,1) both"></circle></sc-for>
            <sc-if value="{{ q.win }}" hint-placeholder-val="{{ false }}"><path d="M100 98L74 70M86 84L78 92M82 80L70 82M74 70L66 60M74 70L80 58M100 98L72 112M84 106L74 104M86 104L84 116" fill="none" stroke="#5B4636" stroke-width="2.2" stroke-linecap="round"></path><path d="M70 69a4 2 0 0 0 8 0M64 60a3 1.5 0 0 0 5 0M78 57a3 1.5 0 0 0 5 0M70 81a3 1.5 0 0 0 5 0M72 111a4 2 0 0 0 7 0M82 115a3 1.5 0 0 0 5 0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"></path></sc-if>
            <sc-for list="{{ q.fx }}" as="p" hint-placeholder-count="0"><path d="{{ p.d }}" transform="{{ p.t }}" fill="{{ p.c }}" style="--dx:{{ p.dx }};transform-box:fill-box;transform-origin:center;animation:{{ p.an }}"></path></sc-for>
          </g>
        </g>
      </sc-for>
      <path d="M100 160V96M100 118L86 104M100 110L114 98M100 132L118 120" fill="none" stroke="{{ trunk }}" stroke-width="5.5" stroke-linecap="round"></path>
      <path d="M100 160V96" fill="none" stroke="{{ trunk }}" stroke-width="8" stroke-linecap="round"></path>
      <path d="M100 16V184M16 100H184" stroke="rgba(70,48,16,.4)" stroke-width="4"></path><path d="M100 16V184M16 100H184" stroke="url(#{{ gAu }})" stroke-width="2.6"></path>
      <circle cx="100" cy="100" r="84" fill="url(#{{ gDome }})"></circle>
    </g>
    <sc-if value="{{ full }}" hint-placeholder-val="{{ false }}">
      <g clip-path="url(#{{ cF }})"><circle cx="100" cy="100" r="88" fill="none" stroke="rgba(40,25,10,.45)" stroke-width="9" filter="url(#{{ fIn }})"></circle><ellipse cx="72" cy="56" rx="54" ry="24" transform="rotate(-32 72 56)" fill="rgba(255,255,255,.28)"></ellipse></g>
      <circle cx="100" cy="100" r="16" fill="url(#{{ gBoss }})" filter="url(#{{ fBv }})" style="transform-box:fill-box;transform-origin:center;animation:{{ bossA }}"></circle>
      <g transform="translate(100 100)"><g style="transform-box:fill-box;transform-origin:center;animation:{{ bossA }}"><path d="M0 -10L2.6 -2.6 0 0Z" fill="oklch(0.66 0.14 145)"></path><path d="M0 -10L-2.6 -2.6 0 0Z" fill="oklch(0.56 0.14 145)"></path><path d="M10 0L2.6 2.6 0 0Z" fill="oklch(0.78 0.15 85)"></path><path d="M10 0L2.6 -2.6 0 0Z" fill="oklch(0.86 0.14 88)"></path><path d="M0 10L-2.6 2.6 0 0Z" fill="oklch(0.58 0.16 40)"></path><path d="M0 10L2.6 2.6 0 0Z" fill="oklch(0.66 0.15 45)"></path><path d="M-10 0L-2.6 -2.6 0 0Z" fill="oklch(0.8 0.06 235)"></path><path d="M-10 0L-2.6 2.6 0 0Z" fill="oklch(0.7 0.07 235)"></path></g></g>
    </sc-if>
    <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(70,48,16,.45)" stroke-width="4.4"></circle><circle cx="100" cy="100" r="84.6" fill="none" stroke="url(#{{ gAu }})" stroke-width="2.6"></circle>
    <sc-if value="{{ full }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ sp }}" as="s" hint-placeholder-count="0"><g transform="{{ s.t }}"><path d="M0 -8C1 -2 2 -1 8 0 2 1 1 2 0 8-1 2-2 1-8 0-2-1-1-2 0-8z" fill="#FFFFFF" style="filter:drop-shadow(0 0 3px rgba(255,230,160,.95));transform-box:fill-box;transform-origin:center;opacity:0;animation:ceTw {{ s.dur }} {{ s.d }} ease-in-out infinite"></path></g></sc-for></sc-if>
    <sc-if value="{{ full }}" hint-placeholder-val="{{ false }}"><circle cx="100" cy="100" r="90" fill="none" stroke="#E4C78A" stroke-width="1.6" pathLength="1" stroke-dasharray="1" style="stroke-dashoffset:1;animation:ceRing 1.4s {{ dFx }} ease both"></circle></sc-if>
  </svg>
  <div style="position:absolute;left:8%;top:8%;width:84%;height:84%;border-radius:50%;overflow:hidden;pointer-events:none"><span style="position:absolute;top:-30%;bottom:-30%;left:0;width:22%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:ceSweep {{ swD }} {{ dSw }} ease-in-out infinite"></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:200},&quot;got&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;min&quot;:0,&quot;max&quot;:4,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:180,&quot;tsType&quot;:&quot;number&quot;},&quot;delay&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
let UID=0;
const SEAS=[
 {n:'Primavera',s0:'oklch(0.94 0.04 350)',s1:'oklch(0.92 0.05 150)',gr:'oklch(0.78 0.12 140)',ring:'oklch(0.75 0.12 145)',fc:['oklch(0.84 0.09 355)','oklch(0.9 0.06 355)','#FFFFFF','oklch(0.78 0.1 145)'],ic:'M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM12 10c-1.5-3-1-6 0-7 1 1 1.5 4 0 7zM14 12c3-1.5 6-1 7 0-1 1-4 1.5-7 0zM12 14c1.5 3 1 6 0 7-1-1-1.5-4 0-7zM10 12c-3 1.5-6 1-7 0 1-1 4-1.5 7 0z'},
 {n:'Verano',s0:'oklch(0.86 0.07 230)',s1:'oklch(0.94 0.06 90)',gr:'oklch(0.6 0.13 145)',ring:'oklch(0.82 0.15 85)',fc:['oklch(0.55 0.14 145)','oklch(0.63 0.15 140)','oklch(0.48 0.12 150)'],ic:'M12 16.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zM12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4'},
 {n:'Otoño',s0:'oklch(0.9 0.06 70)',s1:'oklch(0.86 0.08 50)',gr:'oklch(0.66 0.12 60)',ring:'oklch(0.66 0.15 45)',fc:['oklch(0.66 0.17 45)','oklch(0.74 0.15 70)','oklch(0.56 0.16 30)'],ic:'M5 19c0-8 6-14 14-14 0 8-6 14-14 14zM5 19l7-7'},
 {n:'Invierno',s0:'oklch(0.9 0.03 240)',s1:'oklch(0.96 0.015 240)',gr:'#FFFFFF',ring:'oklch(0.72 0.07 235)',fc:[],ic:'M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5L12 7l2.5-2.5M9.5 19.5L12 17l2.5 2.5'}];
const ORD=[0,1,2,3];
// quadrant clip: TL, TR, BR, BL
const CL=['M100 100H0V0H100Z','M100 100V0H200V100Z','M100 100H200V200H100Z','M100 100V200H0V100Z'];
const BADGE=[[35.7,35.7],[164.3,35.7],[164.3,164.3],[35.7,164.3]];
const ARC=k=>{const r=91,D=Math.PI/180,m=180+k*90+45;const P=a=>(100+r*Math.cos(a*D)).toFixed(1)+' '+(100+r*Math.sin(a*D)).toFixed(1);const s=(a,b)=>'M'+P(a)+'A'+r+' '+r+' 0 0 1 '+P(b);return s(180+k*90+6,m-11)+s(m+11,180+(k+1)*90-6);};
const rnd=s=>{let x=Math.sin(s*999)*10000;return x-Math.floor(x);};
class Component extends DCLogic {
  constructor(p){super(p);this.u='ce'+(++UID);}
  renderVals(){const p=this.props,u=this.u;const sz=Number(p.size)||150;const G=Math.max(0,Math.min(4,p.got==null||p.got===''?4:Number(p.got)));const D=Number(p.delay)||0;const f=x=>(D+x).toFixed(2)+'s';
    const qs=ORD.map((si,k)=>{const S=SEAS[si],on=k<G,isNew=k===G-1;
      const QX=[[-1,-1],[1,-1],[1,1],[-1,1]][k];const fol=[];
      if(on&&S.fc.length){const n=si===1?26:18;for(let i=0;i<n;i++){const a=rnd(i+k*7)*Math.PI/2,rr=12+rnd(i*3+k)*34;const x=100+QX[0]*Math.abs(Math.cos(a))*rr,y=86+QX[1]*Math.abs(Math.sin(a))*rr*0.85;
        fol.push({x:x.toFixed(1),y:y.toFixed(1),r:(si===0?3.4+rnd(i)*3:5+rnd(i)*4).toFixed(1),c:S.fc[i%S.fc.length],d:f((isNew?1:0.3)+i*0.03)});}}
      const fx=[];if(on){if(si===0)for(let i=0;i<5;i++)fx.push({d:'M0 0c2-2 5-1 5 1s-3 3-5 1z',t:'translate('+(30+i*12)+' '+(70+(i%3)*14)+')',c:'oklch(0.86 0.08 355)',dx:'0px',an:'ceDrift '+(5+i)+'s '+f(1.6+i*0.7)+' ease-in-out infinite alternate'});
        if(si===2)for(let i=0;i<6;i++)fx.push({d:'M0 0c3-3 7-2 7 1s-4 4-7 2z',t:'translate('+(110+i*13)+' '+(100+(i%2)*8)+')',c:SEAS[2].fc[i%3],dx:((i%2?1:-1)*20)+'px',an:'ceFall '+(4+i*0.7)+'s '+f(1.8+i*0.6)+' linear infinite'});
        if(si===3)for(let i=0;i<9;i++)fx.push({d:'M-1.8 0a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0 -3.6 0Z',t:'translate('+(12+i*10)+' '+(104+(i%3)*6)+')',c:'#FFFFFF',dx:((i%2?1:-1)*10)+'px',an:'ceFall '+(5+i*0.5)+'s '+f(1.6+i*0.4)+' linear infinite'});}
      fx.forEach(e=>{if(si===3)e.c='#FFFFFF';});
      const GEM=[['oklch(0.72 0.17 150)','oklch(0.38 0.12 155)'],['oklch(0.86 0.16 88)','oklch(0.55 0.15 70)'],['oklch(0.7 0.18 40)','oklch(0.4 0.15 30)'],['oklch(0.82 0.08 235)','oklch(0.45 0.1 245)']][k];const hx=BADGE[k][0]-3,hy=BADGE[k][1]-3.6;
      return{gem:u+'gm'+k,g0:GEM[0],g1:GEM[1],gO:on?'1':'0',gOff:on?'0':'1',hx,hy,hr:'rotate(-30 '+hx+' '+hy+')',cid:u+'q'+k,gid:u+'g'+k,clip:CL[k],s0:on?S.s0:'#ECE7DD',s1:on?S.s1:'#E3DDD1',gr:on?S.gr:'#D8D1C3',ring:on?S.ring:'#E3DCCD',bIc:on?'#FFFFFF':'rgba(28,34,48,.32)',ic:S.ic,
        bx:BADGE[k][0],by:BADGE[k][1],badge:'translate('+(BADGE[k][0]-6.6)+' '+(BADGE[k][1]-6.6)+') scale(.55)',arc:ARC(k),sum:on&&si===1,win:on&&si===3,fol,fx,
        an:on&&isNew?'ceQ 1.1s '+f(0.9)+' cubic-bezier(.3,1.3,.5,1) both':'none'};});
    // badge icon background circle: draw via arc ring color only
    const ticks=Array.from({length:120},(_,i)=>{const a=i*Math.PI/60;return 'M'+(100+89*Math.cos(a)).toFixed(1)+' '+(100+89*Math.sin(a)).toFixed(1)+'L'+(100+(i%2?94:96.5)*Math.cos(a)).toFixed(1)+' '+(100+(i%2?94:96.5)*Math.sin(a)).toFixed(1);}).join('');
    const AU=G===4?['#FFF3C8','#D6AE5C','#8E6824']:['#F6EBCF','#CDB27A','#9C8352'];
    return{ticks,gAu:u+'au',gDome:u+'dm',au0:AU[0],au1:AU[1],au2:AU[2],swD:G===4?'3.6s':'6s',dSw:f(2),
      sp:[[-60,106,1],[30,108,.75],[120,105,.9],[-150,107,.65],[200,104,.8]].map(([a,r,s],i)=>({t:'translate('+(100+r*Math.cos(a*Math.PI/180)).toFixed(1)+' '+(100+r*Math.sin(a*Math.PI/180)).toFixed(1)+') scale('+s+')',d:f(2.6+i*0.5),dur:(2.4+(i%3)*0.5).toFixed(1)+'s'})),
      sz:sz+'px',qs,cF:u+'f',full:G===4,notFull:G!==4,shF:G===4?'drop-shadow(0 16px 20px rgba(40,30,20,.42))':'drop-shadow(0 10px 14px rgba(40,30,20,.32))',gFr:u+'fr',gBoss:u+'bs',fBv:u+'bv',fIn:u+'in',bossA:'ceQ .7s '+f(2.6)+' cubic-bezier(.3,1.5,.5,1) both',trunk:G>0?'#6B5240':'#BDB3A2',d0:f(0),dFx:f(2.2)};}
}
</script>
