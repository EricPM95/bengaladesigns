<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes icTip{0%{opacity:0;transform:translate(-50%,4px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
</style>
</helmet>
<div onClick="{{ tap }}" style="position:relative;width:{{ S }};height:{{ S }};flex:none;cursor:pointer">
  <div style="position:absolute;left:50%;top:50%;width:{{ nw }};height:{{ nh }};margin:{{ nm }};transform:scale({{ k }})">
    <sc-for list="{{ layers }}" as="L" hint-placeholder-count="2">
      <div style="position:absolute;inset:0;filter:{{ L.f }};opacity:{{ L.o }};clip-path:{{ L.clip }}">
        <sc-if value="{{ isImpr }}" hint-placeholder-val="{{ false }}"><dc-import name="Piezas/Insignia Pieza" kind="{{ pk }}" have="{{ pn }}" neu="-1" dark="false" delay="-30" scale="0.8" hint-size="120px,120px"></dc-import></sc-if>
        <sc-if value="{{ isVati }}" hint-placeholder-val="{{ false }}"><dc-import name="Piezas/Insignia Principal" design="vati" size="120" delay="-30" set="{{ vSet }}" hint-size="120px,120px"></dc-import></sc-if>
        <sc-if value="{{ isCinta }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;inset:0">
            <span style="position:absolute;inset:0;clip-path:polygon(0 0,100% 0,91% 50%,100% 100%,0 100%,9% 50%);background:{{ rim }}"></span>
            <span style="position:absolute;inset:0;clip-path:polygon(0 0,100% 0,91% 50%,100% 100%,0 100%,9% 50%);transform:scale(.94,.84);background:{{ bg }}"></span>
            <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:9px;padding:0 28px;color:{{ ink }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="{{ ic }}"></path></svg><span style="font:400 15px/1.05 'Instrument Serif',serif;text-align:left">Tras los pasos de Caravaggio</span></span>
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><path d="M33.3 10V90M66.6 10V90" fill="none" stroke="{{ line }}" stroke-width="1.2" vector-effect="non-scaling-stroke"></path></svg>
          </div>
        </sc-if>
        <sc-if value="{{ isSolid }}" hint-placeholder-val="{{ true }}">
          <div style="position:absolute;inset:0">
            <span style="position:absolute;inset:0;clip-path:{{ clip }};border-radius:{{ rad }};background:{{ rim }}"></span>
            <span style="position:absolute;inset:0;clip-path:{{ clip }};border-radius:{{ rad }};transform:scale(.88);background:{{ bg }}"></span>
            <span style="position:absolute;inset:0;clip-path:{{ clip }};border-radius:{{ rad }};transform:scale(.8);box-shadow:inset 0 0 0 1px {{ line }}"></span>
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;clip-path:{{ clip }};border-radius:{{ rad }};transform:scale(.88)"><sc-for list="{{ seams }}" as="s" hint-placeholder-count="3"><path d="{{ s }}" fill="none" stroke="{{ line }}" stroke-width="1.2" vector-effect="non-scaling-stroke"></path></sc-for></svg>
            <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:{{ pb }};color:{{ ink }}"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{ ic }}"></path></svg></span>
          </div>
        </sc-if>
      </div>
    </sc-for>
    <sc-if value="{{ vSeams }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"><path d="M50 50L50 4M50 50L90 73M50 50L10 73" fill="none" stroke="rgba(255,253,248,.55)" stroke-width="1" stroke-dasharray="2 2.5"></path></svg></sc-if>
  </div>
  <sc-if value="{{ tipOn }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:50%;top:-8px;z-index:5;max-width:180px;padding:5px 10px;border-radius:999px;background:#1C2230;color:#FFFDF8;font:600 11px/1.2 'Geist';white-space:nowrap;pointer-events:none;animation:icTip 1.8s ease both">{{ tip }}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:160},&quot;col&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;impr&quot;,&quot;vati&quot;,&quot;joyas&quot;,&quot;ant&quot;,&quot;tras&quot;,&quot;mig&quot;,&quot;ber&quot;,&quot;car&quot;,&quot;pyf&quot;,&quot;mir&quot;,&quot;sec&quot;],&quot;default&quot;:&quot;ant&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;set&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0,1,4&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:140,&quot;tsType&quot;:&quot;number&quot;},&quot;sites&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;focus&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const IC={"ropa":"M2 21h20M3.5 21V6.5l5-2.5 5 2.5V21M3 6.8h11M6 9.5h1.5M9.5 9.5H11M6 13h1.5M9.5 13H11M7 21v-4a1.5 1.5 0 0 1 3 0v4M18 21v-6M14.6 12.6a3.4 3.4 0 1 0 6.8 0a3.4 3.4 0 1 0-6.8 0M16.3 15.4L18 17l1.7-1.6","cincel":"M16 2l6 6-3 3-6-6zM14.5 7.5L6.5 15.5M16.5 9.5L8.5 17.5M6.5 15.5L3 17l4 4 1.5-3.5M2 12.5l1.5.4M4.2 22.6l.4-1.5","baldaquino":"M4 21h16M3 7h18M4 7l1.5-3h13L20 7M12 4V1.5M3 7c1 1.3 2 1.3 3 0s2 1.3 3 0 2 1.3 3 0 2 1.3 3 0 2 1.3 3 0 2 1.3 3 0M5.5 9c3 2-3 4 0 6s-3 4 0 6M8.5 9c-3 2 3 4 0 6s3 4 0 6M15.5 9c3 2-3 4 0 6s-3 4 0 6M18.5 9c-3 2 3 4 0 6s3 4 0 6","cuadro":"M4 5h16v14H4zM8 15l2.5-3 2 2.5 2-2 2.5 2.5","loba":"M3 12c2-3 5-4 9-4h4l2-3 1 3c1.5.5 2.5 1.5 3 3l-2 1h-2v7M16 19v-6M7 19v-5M5 19v-4c-1 0-2-1-2-2M9.5 18a1 1 0 1 0 0-.01M13 18a1 1 0 1 0 0-.01","prism":"M6 8h4l1 9a3 3 0 1 1-6 0zM14 8h4l1 9a3 3 0 1 1-6 0zM10 11h4M8 8V5M16 8V5","barcaccia":"M2.5 13.5Q4 16.8 12 16.8T21.5 13.5L19.5 16H4.5zM4 17.5q8 2.3 16 0M2 20.5q2.5-1.4 5 0t5 0 5 0 5 0M12 15.5V6M12 6c-1.6 1.2-3.2 3.4-3.6 6.5M12 6c1.6 1.2 3.2 3.4 3.6 6.5M12 6q-.6-1.6 0-3M12 6q.6-1.6 0-3","secreta":"M5 21V3h10v18M15 3l4 2v14l-4 2M3 21h18M12.5 12h.01M21 8l2-1M21 12h2M21 16l2 1"};
const GOLD='linear-gradient(135deg,#F6E7BD,#B9944F 45%,#F0DCA6 70%,#A88541)';
const HEX='polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)',SHIELD='polygon(0 0,100% 0,100% 60%,50% 100%,0 60%)';
const SH={hexa:['104','118',HEX,'0','0'],escudo:['104','120',SHIELD,'0','18px'],arco:['98','120','none','49px 49px 14px 14px','0'],chapa:['112','112','none','32px','0']};
const C={
 impr:{t:'impr',n:8,pk:'impr',cx:50,cy:50,a0:-112.5},
 vati:{t:'vati',n:3,cx:50,cy:50,a0:-90},
 joyas:{t:'impr',n:4,pk:'joyas',quad:1},
 tras:{t:'solid',sh:'chapa',n:4,ic:'ropa',bg:'oklch(0.5 0.08 300)'},
 mig:{t:'solid',sh:'escudo',n:4,ic:'cincel',bg:'linear-gradient(115deg,transparent 0 30%,rgba(120,126,136,.28) 31%,transparent 33% 58%,rgba(120,126,136,.2) 59.5%,transparent 61%),linear-gradient(35deg,transparent 0 44%,rgba(140,146,156,.22) 45%,transparent 47%),linear-gradient(160deg,#FFFFFF,#ECEDEB 55%,#D9DBDD)',ink:'#3C4048',line:'rgba(60,64,72,.28)',rim:'linear-gradient(135deg,#FAFAF8,#C6C9CE 45%,#F1F2F1 70%,#AEB2B8)'},
 ber:{t:'solid',sh:'hexa',n:5,ic:'baldaquino',bg:'oklch(0.44 0.07 52)'},
 car:{t:'cinta',n:3,ic:'cuadro',bg:'radial-gradient(circle at 34% 28%,#7A5430,#1E140C 70%)'},
 ant:{t:'solid',sh:'arco',n:6,ic:'loba',bg:'oklch(0.76 0.05 75)',ink:'#3A2A0E',line:'rgba(58,42,14,.3)'},
 mir:{t:'solid',sh:'hexa',n:3,ic:'prism',bg:'linear-gradient(180deg,oklch(0.78 0.09 55),oklch(0.64 0.1 10) 55%,oklch(0.5 0.1 320))'},
 pyf:{t:'solid',sh:'chapa',n:7,ic:'barcaccia',bg:'linear-gradient(160deg,oklch(0.74 0.09 188),oklch(0.5 0.09 212))'},
 sec:{t:'solid',sh:'escudo',n:5,ic:'secreta',bg:'radial-gradient(circle at 40% 28%,oklch(0.44 0.07 150),oklch(0.28 0.05 150) 75%)'}};
const wedge=(cx,cy,a,b)=>{const pts=[cx+'% '+cy+'%'];const st=Math.max(2,Math.ceil((b-a)/(Math.PI/12)));for(let i=0;i<=st;i++){const t=a+(b-a)*i/st;pts.push((cx+90*Math.cos(t)).toFixed(1)+'% '+(cy+90*Math.sin(t)).toFixed(1)+'%');}pts.push(cx+'% '+cy+'%');return pts;};
class Component extends DCLogic {
  state={tip:null};
  componentWillUnmount(){clearTimeout(this.tt);}
  geo(c){const N=c.n;
    if(c.t==='vati')return{pieces:[],hit:(x,y)=>(x>.3&&x<.7&&y>.12&&y<.8)?2:(x<.5?0:1)};
    if(c.quad)return{pieces:[['0% 0%','50% 0%','50% 50%','0% 50%'],['50% 0%','100% 0%','100% 50%','50% 50%'],['0% 50%','50% 50%','50% 100%','0% 100%'],['50% 50%','100% 50%','100% 100%','50% 100%']],hit:(x,y)=>(y>=.5?2:0)+(x>=.5?1:0)};
    if(c.t==='cinta')return{pieces:[0,1,2].map(j=>[(j*33.34)+'% 0%',((j+1)*33.34)+'% 0%',((j+1)*33.34)+'% 100%',(j*33.34)+'% 100%']),hit:x=>Math.min(2,Math.floor(x*3))};
    const cx=c.cx||50,cy=c.cy||52;const off=c.a0!==undefined?c.a0*Math.PI/180:-Math.PI/2+0.3,step=2*Math.PI/N;
    return{pieces:Array.from({length:N},(_,j)=>wedge(cx,cy,off+j*step,off+(j+1)*step)),hit:(x,y)=>{let a=Math.atan2(y*100-cy,x*100-cx)-off;a=((a%(2*Math.PI))+2*Math.PI)%(2*Math.PI);return Math.floor(a/step)%N;}};}
  renderVals(){const p=this.props;const key=p.col||'ant';const c=C[key]||C.ant;const S=Number(p.size)||64;
    const set=String(p.set??'').split(',').filter(x=>x!=='').map(Number);const sites=String(p.sites||'').split('|');
    const G=this.geo(c);const isS=c.t==='solid',sh=isS?SH[c.sh]:null;
    const nw=c.t==='cinta'?196:isS?Number(sh[0]):120,nh=c.t==='cinta'?70:isS?Number(sh[1]):120;const k=S/Math.max(nw,nh)*(c.t==='cinta'?1:0.98);
    const lit=set.filter(j=>j>=0&&j<c.n);
    const poly=c.t==='vati'||!lit.length?'none':'polygon('+lit.map(j=>G.pieces[j].join(',')).join(',')+')';
    const dim=p.focus!==undefined&&p.focus!==''?'grayscale(1) brightness(1.08)':'grayscale(1) brightness(1.12)';
    const layers=[{f:dim,o:p.focus!==undefined&&p.focus!==''?'.32':'.42',clip:'none'}];
    if(c.t==='vati'){layers.length=0;layers.push({f:'none',o:'1',clip:'none'});}
    else if(lit.length)layers.push({f:'none',o:'1',clip:lit.length===c.n?'none':poly});
    const tap=e=>{e.stopPropagation();const r=e.currentTarget.getBoundingClientRect();const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;const fx=c.t==='cinta'?x:.5+(x-.5)*(Math.max(nw,nh)/nw)*(nw/Math.max(nw,nh)),fy=y;
      const j=G.hit(Math.max(0,Math.min(.999,fx)),Math.max(0,Math.min(.999,fy)));const nm=sites[j]||'';if(!nm)return;
      this.setState({tip:null},()=>this.setState({tip:nm}));clearTimeout(this.tt);this.tt=setTimeout(()=>this.setState({tip:null}),1800);};
    const vSet=lit.join(',')||'-1';return{vSet,S:S+'px',nw:nw+'px',nh:nh+'px',nm:(-nh/2)+'px 0 0 '+(-nw/2)+'px',k:k.toFixed(3),layers,tap,tipOn:!!this.state.tip,tip:this.state.tip||'',
      isImpr:c.t==='impr',isVati:c.t==='vati',isCinta:c.t==='cinta',isSolid:isS,vSeams:c.t==='vati',pk:c.pk||'impr',pn:String(c.n),
      clip:isS?sh[2]:'none',rad:isS?sh[3]:'0',pb:isS?sh[4]:'0',bg:c.bg||'',rim:c.rim||GOLD,ink:c.ink||'#F7EBCB',line:c.line||'rgba(247,235,203,.35)',ic:IC[c.ic]||'',
      seams:isS?Array.from({length:c.n},(_,j)=>{const a=-Math.PI/2+j*2*Math.PI/c.n+0.3;return 'M50 52L'+(50+60*Math.cos(a)).toFixed(1)+' '+(52+60*Math.sin(a)).toFixed(1);}):[]};}
}
</script>
</body>
</html>
