<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<svg width="{{ S }}" height="{{ H }}" viewBox="0 0 220 260" fill="none" style="overflow:visible;display:block">
  <defs>
    <linearGradient id="{{ u }}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6D2"></stop><stop offset=".4" stop-color="#F2C050"></stop><stop offset=".75" stop-color="#B8791C"></stop><stop offset="1" stop-color="#F8D974"></stop></linearGradient>
    <linearGradient id="{{ u }}st" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF4C8"></stop><stop offset=".45" stop-color="#EDB853"></stop><stop offset="1" stop-color="#8A5412"></stop></linearGradient>
    <linearGradient id="{{ u }}s2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C58A38"></stop><stop offset="1" stop-color="#4E2C08"></stop></linearGradient>
    <linearGradient id="{{ u }}ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A0C02"></stop><stop offset="1" stop-color="#5E360E"></stop></linearGradient>

    <linearGradient id="{{ u }}sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"></stop><stop offset=".5" stop-color="#fff" stop-opacity=".85"></stop><stop offset="1" stop-color="#fff" stop-opacity="0"></stop></linearGradient>
    <linearGradient id="{{ u }}sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1238"></stop><stop offset=".55" stop-color="#2E2F78"></stop><stop offset=".85" stop-color="#D88A62"></stop><stop offset="1" stop-color="#FFC878"></stop></linearGradient>
    <radialGradient id="{{ u }}su" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE29A" stop-opacity=".95"></stop><stop offset="1" stop-color="#FFB060" stop-opacity="0"></stop></radialGradient>
    <radialGradient id="{{ u }}gl" cx=".5" cy=".5" r=".5"><stop offset=".62" stop-color="#9FD0FF" stop-opacity="0"></stop><stop offset=".93" stop-color="#BFE4FF" stop-opacity=".3"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity=".85"></stop></radialGradient>
    <clipPath id="{{ u }}k"><path d="{{ sil }}"></path></clipPath>

      <sc-for list="{{ stars }}" as="s" hint-placeholder-count="14"><circle cx="{{ s.x }}" cy="{{ s.y }}" r="{{ s.r }}" fill="#FFFFFF"><animate attributeName="opacity" values=".1;1;.1" dur="{{ s.d }}s" repeatCount="indefinite"></animate></circle></sc-for>
