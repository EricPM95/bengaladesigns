<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
@keyframes ezIntro{0%{opacity:0;transform:translateY(10px)}25%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
@keyframes ezEmb{0%{opacity:0;transform:translate(0,-230px) scale(.12) rotate(-40deg)}55%{opacity:1}100%{opacity:1;transform:none}}
@keyframes ezUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ezFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ezr *{animation:none!important}}
</style>
</helmet>
<div class="ezr" style="position:relative;width:390px;height:520px;overflow:hidden;font-family:'Geist',sans-serif">
<sc-if value="{{ on }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;inset:0">
 <canvas ref="{{ cv }}" width="780" height="1040" style="position:absolute;inset:0;width:390px;height:520px"></canvas>
 <div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(10,14,34,.2),rgba(8,10,24,.7));animation:ezFade 1s 13.90s both;pointer-events:none"></div>
  <div style="position:absolute;left:105px;top:150px;width:180px;display:flex;flex-direction:column;align-items:center;gap:8px;animation:ezEmb 1.7s 14.10s cubic-bezier(.2,.8,.2,1) both">
  <svg width="170" height="170" viewBox="0 0 120 120" fill="none" style="overflow:visible;filter:drop-shadow(0 12px 18px rgba(0,0,0,.6))">
   <defs><radialGradient id="ezh" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#2A3556"/><stop offset="1" stop-color="#0E1530"/></radialGradient><linearGradient id="ezg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6DC"/><stop offset=".5" stop-color="#E9C77A"/><stop offset="1" stop-color="#B58A2E"/></linearGradient></defs>
   <path d="M60 4L110 32V88L60 116L10 88V32Z" fill="url(#ezh)" stroke="url(#ezg)" stroke-width="2.4" stroke-linejoin="round"/>
   <path d="M60 11L104 36V84L60 109L16 84V36Z" fill="none" stroke="#E9C77A" stroke-width=".8" stroke-dasharray="1 3"/>
   <path d="M60 22V32M56 24L48 20M64 24L72 20M60 32L52 100M60 32L68 100M55.5 60H64.5M53.5 74H66.5M52 88H68" stroke="url(#ezg)" stroke-width="2" stroke-linecap="round"/>
   <path d="M40 100Q60 70 80 100M44 100Q60 78 76 100M34 100H86" stroke="url(#ezg)" stroke-width="2" stroke-linecap="round"/>
   <circle cx="60" cy="20" r="3" fill="#FFF6DC"/>
  </svg>
  <span style="font:600 10.5px 'Geist Mono',monospace;letter-spacing:.18em;color:#E9C77A;animation:ezUp .8s 15.30s both">EMBLEMA SECRETO</span>
  <span style="font:400 28px/1 'Instrument Serif',serif;color:#FBF3E2;white-space:nowrap;animation:ezUp .8s 15.60s both">La Dama de Hierro</span>
 </div>
 <div style="position:absolute;left:24px;right:24px;top:446px;text-align:center;font:400 14px/1.4 'Geist';color:#FBF3E2;background:rgba(8,10,24,.62);border-radius:14px;padding:9px 12px;animation:ezUp .8s 16.10s both">Más de 300 metros de hierro y una luz que da la vuelta a París.</div>
</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state={on:true};cv=React.createRef();
  componentDidMount(){this.start();}
  componentDidUpdate(pr){if(pr.nonce!==this.props.nonce){cancelAnimationFrame(this.raf);this.setState({on:false},()=>setTimeout(()=>this.setState({on:true},()=>this.start()),60));}}
  componentWillUnmount(){cancelAnimationFrame(this.raf);}
  start(){
    const c=this.cv.current;if(!c)return;const g=c.getContext('2d');g.setTransform(2,0,0,2,0,0);
    const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    const W=390,H=520,BX=195,BY=62,R=Math.random,TE=14.1;
    const T=[];
    const h=y=>6+84*Math.pow((y-96)/384,2.2);
    const ln=(x1,y1,x2,y2,w)=>{const n=Math.max(2,Math.round(Math.hypot(x2-x1,y2-y1)/2.6));for(let i=0;i<=n;i++){const t=i/n,X=x1+(x2-x1)*t,Y=y1+(y2-y1)*t;for(let k=0;k<(w>2?3:2);k++)T.push({tx:X+(R()-.5)*(w>2?3:1.6),ty:Y+(R()-.5)*(w>2?3:1.6),dl:0.3+(480-Y)/384*6.4+R()*.5,du:1.5+R()*1,a:R()*6.283,d:90+R()*260,ph:R()*6.283,s:.9+R()*1.3,g:R()});}};
    let pl=null,pr=null;for(let y=480;y>=96;y-=5){const l=195-h(y),r=195+h(y);if(pl){ln(pl[0],pl[1],l,y,3);ln(pr[0],pr[1],r,y,3);}pl=[l,y];pr=[r,y];}
    {const a=195-h(480)+10,b=195+h(480)-10;let p=[a,480];for(let i=1;i<=30;i++){const t=i/30,u=1-t,x=u*u*a+2*u*t*195+t*t*b,y=u*u*480+2*u*t*372+t*t*480;ln(p[0],p[1],x,y,2);p=[x,y];}}
    [[420,390,360,330],[330,300,270,240,230],[230,200,170,140,110]].forEach(bd=>{for(let i=0;i<bd.length-1;i++){const a=bd[i],b=bd[i+1];ln(195-h(a)+3,a,195+h(b)-3,b,1);ln(195+h(a)-3,a,195-h(b)+3,b,1);ln(195-h(b),b,195+h(b),b,1);}});
    [330,326,230,226,140].forEach(y=>ln(195-h(y)-5,y,195+h(y)+5,y,2));ln(195,96,195,64,2);ln(60,484,330,484,2);
    const D=Array.from({length:120},()=>({x:R()*W,y:R()*H,v:.1+R()*.35,ph:R()*6.283,s:.6+R()*1.4}));
    const S=Array.from({length:44},(_,k)=>({x:(k*83)%390,y:(k*47)%300,r:.6+(k%4)*.35,ph:k}));
    const PAL=['rgb(160,112,48)','rgb(214,170,90)','rgb(243,216,143)','rgb(255,243,205)'];
    const bk=[[],[],[],[]];T.forEach(p=>bk[Math.min(3,Math.floor(p.g*3.4))].push(p));
    const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    const B=[];let burst=false;const t0=performance.now();
    const draw=(now)=>{const t=reduce?30:(now-t0)/1000;g.clearRect(0,0,W,H);
      const bgG=g.createLinearGradient(0,0,0,H);bgG.addColorStop(0,'#0B1130');bgG.addColorStop(.65,'#151A3A');bgG.addColorStop(1,'#07090F');g.fillStyle=bgG;g.fillRect(0,0,W,H);
      g.globalCompositeOperation='lighter';
      S.forEach(s=>{g.globalAlpha=.2+.8*Math.abs(Math.sin(t*1.1+s.ph));g.fillStyle='rgb(243,216,143)';g.beginPath();g.arc(s.x,s.y,s.r,0,6.283);g.fill();});
      const form=Math.min(1,Math.max(0,(t-0.9)/7));
      const gl=g.createRadialGradient(195,400,10,195,400,220);gl.addColorStop(0,'rgba(243,200,120,'+.3*form+')');gl.addColorStop(1,'rgba(243,200,120,0)');g.fillStyle=gl;g.fillRect(0,150,W,370);
      D.forEach(d=>{d.y-=d.v;if(d.y<-4)d.y=H+4;g.globalAlpha=.22+.3*Math.sin(t*1.5+d.ph);g.fillStyle='rgb(243,216,143)';g.fillRect(d.x+Math.sin(t+d.ph)*6,d.y,d.s,d.s);});
      for(let b=0;b<4;b++){g.fillStyle=PAL[b];for(const p of bk[b]){const q=Math.min(1,Math.max(0,(t-p.dl)/p.du));if(q<=0)continue;const e=ease(q);
        const sx=BX+Math.cos(p.a)*p.d*0.16,sy=374+Math.sin(p.a)*p.d*0.1;
        let x=sx+(p.tx-sx)*e+Math.sin(e*6+p.ph)*(1-e)*14,y=sy+(p.ty-sy)*e+Math.cos(e*5+p.ph)*(1-e)*10;
        let a=Math.min(1,.15+q);if(q>=1){x+=Math.sin(t*3+p.ph)*.2;y+=Math.cos(t*2.6+p.ph)*.2;a=.75+.25*Math.sin(t*2.4+p.ph);if(t>7.5){const w=Math.max(0,Math.sin(t*2.2-p.ty*.02));a=Math.min(1,a+w*.6);}}
        g.globalAlpha=a;const s=p.s*(q>=1?1.1:1);g.fillRect(x-s/2,y-s/2,s,s);}}
      g.globalAlpha=1;
      if(t>10.3){const bt=t-10.3,ba=Math.min(1,bt/.6);
        const gl2=g.createRadialGradient(BX,BY,2,BX,BY,34);gl2.addColorStop(0,'rgba(255,255,255,'+ba+')');gl2.addColorStop(.3,'rgba(255,233,168,'+.8*ba+')');gl2.addColorStop(1,'rgba(243,216,143,0)');g.fillStyle=gl2;g.fillRect(BX-40,BY-40,80,80);
        if(bt<3.8){const sc=Math.cos(Math.max(0,bt-.2)/3.6*Math.PI*2);g.save();g.translate(BX,BY);g.scale(sc,1);const bw=g.createLinearGradient(0,0,360,0);bw.addColorStop(0,'rgba(255,248,220,.9)');bw.addColorStop(.4,'rgba(255,233,168,.4)');bw.addColorStop(1,'rgba(255,233,168,0)');g.fillStyle=bw;g.beginPath();g.moveTo(0,0);g.lineTo(360,-26);g.lineTo(360,26);g.fill();g.beginPath();g.moveTo(0,0);g.lineTo(-360,-26);g.lineTo(-360,26);g.fill();g.restore();
          const fa=Math.max(0,1-Math.abs(sc)*2.2);if(fa>0){const f2=g.createRadialGradient(BX,BY,2,BX,BY,100);f2.addColorStop(0,'rgba(255,255,255,'+fa+')');f2.addColorStop(1,'rgba(255,233,168,0)');g.fillStyle=f2;g.fillRect(BX-110,BY-110,220,220);}}}
      if(t>TE&&!burst){burst=true;for(let i=0;i<200;i++){const a=R()*6.283,v=1+R()*3.6;B.push({x:BX,y:BY,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.4,l:1,s:1+R()*2});}}
      B.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.vx*=.985;p.l-=.008;if(p.l>0){g.globalAlpha=Math.min(1,p.l);g.fillStyle='rgb(255,226,150)';g.fillRect(p.x,p.y,p.s,p.s);}});
      if(t>TE&&t<TE+1.3){const rr=(t-TE)*220;g.globalAlpha=Math.max(0,1-(t-TE)/1.3)*.6;g.strokeStyle='rgb(255,236,190)';g.lineWidth=3;g.beginPath();g.arc(BX,BY,rr,0,6.283);g.stroke();}
      g.globalAlpha=1;g.globalCompositeOperation='source-over';
      this.raf=requestAnimationFrame(draw);};
    this.raf=requestAnimationFrame(draw);
  }
  renderVals(){return{on:this.state.on,cv:this.cv};}
}
</script>
</body>
</html>
