  renderVals(){const p=this.props;const s=Math.max(1,Math.min(10,parseInt(p.stage)||1));let P=ST[s];if(p.metal==='rosa'){const M={'#FFF1B8':'#FFF0EA','#EDBE50':'#FFB8A4','#B5821C':'#E07A66','#7A520C':'#9A4636','#FFF1C2':'#FFF2EC','#F4D06A':'#FFC2B0','#9A6A12':'#C25C48','#E9D58A':'#FFD6C8','#E3B13F':'#FFAE98','#8A5E12':'#B04E3E'};P=JSON.parse(JSON.stringify(P).replace(/#[0-9A-Fa-f]{6}/g,h=>M[h.toUpperCase()]||h));}
    const sz=(Number(p.size)||200)+'px';
    const c=GM[P.gem];const G={a:c[0],b:c[1],c:c[2],d:c[3],e:c[4],f:c[5],g:c[6],h:c[7]};
    const gems=[];[0,90,180,270].forEach(r=>gems.push({t:'rotate('+r+' 200 200) translate(200 56) scale(.62) translate(-200 -56)'}));
    if(P.gems===8)[45,135,225,315].forEach(r=>gems.push({t:'rotate('+r+' 200 200) translate(200 58) scale(.42) translate(-200 -58)'}));
    const lv=[];if(P.leaves){const N=14;for(let i=0;i<N;i++){const t=i/(N-1);const ang=(98+t*150)*Math.PI/180;const R0=150;const x=200+R0*Math.cos(ang),y=200+R0*Math.sin(ang);const rot=98+t*150+180-28;const sc=(1.0-0.22*t).toFixed(2);
      lv.push({t:'translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+rot.toFixed(1)+') scale('+sc+')'});lv.push({t:'translate('+(400-x).toFixed(1)+' '+y.toFixed(1)+') rotate('+(-rot).toFixed(1)+') scale('+sc+')'});}}
    const beads=Array.from({length:32},(_,i)=>{const a=i/32*Math.PI*2;return{x:(200+138.5*Math.cos(a)).toFixed(1),y:(200+138.5*Math.sin(a)).toFixed(1)};});
    const rays=Array.from({length:90},(_,i)=>{const a=i/90*Math.PI*2;return'M'+(200+16*Math.cos(a)).toFixed(1)+' '+(200+16*Math.sin(a)).toFixed(1)+'L'+(200+112*Math.cos(a)).toFixed(1)+' '+(200+112*Math.sin(a)).toFixed(1);});
    const star=(x,y,k)=>'M'+x+' '+(y-3*k)+'l'+(.8*k)+' '+(2.2*k)+' '+(2.2*k)+' '+(.8*k)+'-'+(2.2*k)+' '+(.8*k)+'-'+(.8*k)+' '+(2.2*k)+'-'+(.8*k)+'-'+(2.2*k)+'-'+(2.2*k)+'-'+(.8*k)+' '+(2.2*k)+'-'+(.8*k)+'z';
    const sp=s>=4?[star(132,138,1.5),star(272,124,1.2),star(120,236,1),star(282,244,1.4),star(236,112,.9),star(160,282,1)]:[];
    const fc=[];if(P.facets){const C=P.rainbow?['#FF7AD9','#7AB8FF','#7AFFE0','#FFE07A','#C07AFF','#7AFF9E']:['#FFFFFF','#8FD3FF','#FFB8F0','#A9B8FF','#9FFFE0','#FFFFFF'];const K=P.rainbow?2.2:1;const pt=(a,r)=>(200+r*Math.cos(a)).toFixed(1)+' '+(200+r*Math.sin(a)).toFixed(1);
      for(let i=0;i<12;i++){const a0=i*Math.PI/6,a1=(i+1)*Math.PI/6;fc.push({d:'M200 200L'+pt(a0,112)+'L'+pt(a1,112)+'Z',f:C[i%6],o:Math.min(.6,(i%2?.1:.22)*K)});}
      for(let i=0;i<12;i++){const a0=i*Math.PI/6+Math.PI/12,a1=a0+Math.PI/6;fc.push({d:'M'+pt(a0,40)+'L'+pt(a0+Math.PI/12,112)+'L'+pt(a1,40)+'Z',f:C[(i+2)%6],o:Math.min(.5,(i%2?.16:.07)*K)});}}
    const ro=p.metal==='rosa';return{og0:ro?'#FFF0EA':'#FFF1B8',og1:ro?'#FFAE98':'#E3B13F',og2:ro?'#B04E3E':'#8A5E12',u:this.u,sz,P,G,fc,facets:!!P.facets,gems,lv,beads,rays,sp,isGlobe:p.icon==='globo',land:this.state.land,isIc:p.icon==='path',icd:p.icd||'',isPin:p.icon!=='globo'&&p.icon!=='path',leaves:!!P.leaves,orbit:!!P.orbit,glow:!!P.glow||s>=6};}
}
