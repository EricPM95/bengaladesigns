<!DOCTYPE html>
<html>

<x-dc>
<helmet>
<style>

@keyframes chBurst{0%{opacity:.9;transform:scale(.5)}100%{opacity:0;transform:scale(2.4)}}
@keyframes chSpark{0%{opacity:0;transform:translate(0,0) scale(.2)}30%{opacity:1}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(1)}}
@keyframes chSweep{0%{transform:translateX(-140%) rotate(20deg)}45%,100%{transform:translateX(330%) rotate(20deg)}}
@keyframes chRays{to{transform:rotate(360deg)}}
@keyframes chMer{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.05)}}
@keyframes chArc{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes chTw{0%,100%{opacity:.2}50%{opacity:1}}

</helmet>
<div style="position:relative;width:{{ w }};height:{{ h }};flex:none">

        <path d="M30 98h60v20H30z" fill="{{ rib }}" stroke="{{ rimS }}" stroke-width="1"></path>

    <svg width="100%" height="100%" viewBox="0 0 120 140" style="position:absolute;inset:0;overflow:visible;pointer-events:none">

    </svg>
    <sc-if value="{{ hasNum }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:25%;right:25%;top:72.5%;height:13%;display:flex;align-items:center;justify-content:center;font:700 {{ nfs }} 'Geist Mono',monospace;letter-spacing:.06em;color:{{ ribT }}">{{ num }}</span></sc-if>

  </div>
</div>
</x-dc>
