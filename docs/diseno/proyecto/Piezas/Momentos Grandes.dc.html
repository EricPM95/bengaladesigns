<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>body{margin:0;background:#E7DCC6;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}button{font-family:inherit}a{color:#1C2230}a:hover{color:oklch(0.55 0.17 5)}</style>
</helmet>
<div style="min-height:100vh;background:radial-gradient(ellipse 70% 50% at 50% 0%,#F1E8D6 0%,#E0D3BA 75%);font-family:'Geist',system-ui,sans-serif;color:#1C2230;display:flex;flex-direction:column">
  <section id="c1" style="display:flex;flex-direction:column"><span style="padding:30px 48px 0;font:400 34px/1 'Instrument Serif',serif"><span style="color:oklch(0.55 0.17 5)">01 · </span>La película del Coliseo y los emblemas en cine</span><dc-import name="Piezas/Emblemas Cine" hint-size="100%,4000px"></dc-import></section>
  <section id="c2" style="display:flex;flex-direction:column;gap:16px;padding:30px 48px 90px">
    <span style="font:400 34px/1 'Instrument Serif',serif"><span style="color:oklch(0.55 0.17 5)">02 · </span>El final de las 7 maravillas</span>
    <span style="max-width:700px;font:400 14px/1.5 'Geist';color:rgba(28,34,48,.65)">Las 7 monedas se funden en la medalla, con fuegos artificiales.</span>
    <div style="align-self:flex-start;border-radius:40px;background:radial-gradient(circle at 50% 30%,#1E2744 0%,#0C1020 72%);padding:40px 30px">
      <sc-if value="{{ on }}" hint-placeholder-val="{{ true }}"><dc-import name="Piezas/Medalla Siete" n="7" anim="{{ true }}" size="340" hint-size="340px,420px"></dc-import></sc-if>
    </div>
    <button onClick="{{ replay }}" style="align-self:flex-start;height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(28,34,48,.18);background:#FFFDF8;color:#1C2230;font:600 13px 'Geist';cursor:pointer">Repetir animación</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state={on:true};
  renderVals(){return{on:this.state.on,replay:()=>{this.setState({on:false});setTimeout(()=>this.setState({on:true}),60);}};}
}
</script>
</body>
</html>
