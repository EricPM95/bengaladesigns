<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
@keyframes ecOrbit{to{transform:rotate(360deg)}}
@keyframes ecFadeTo{to{opacity:.55}}
@keyframes ecPush{from{transform:scale(1)}to{transform:scale(1.6)}}
@keyframes ecBloom{0%{opacity:0;transform:scale(.3)}35%{opacity:1}100%{opacity:0;transform:scale(2.2)}}
@keyframes ecFlickM{from{opacity:1}to{opacity:.86}}
@keyframes ecSpark{0%{opacity:0;transform:none}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-110px)}}
@keyframes ecKey{0%{transform:scale(1)}82%{opacity:1}100%{transform:scale(13);opacity:0}}
@keyframes ecViewZ{from{transform:scale(1)}to{transform:scale(1.9)}}
@keyframes ecIntroOut{to{opacity:0}}
@keyframes ecIPhrase{0%{opacity:0;transform:translateY(14px);filter:blur(4px)}18%{opacity:1;transform:none;filter:none}86%{opacity:1;transform:scale(1.02);text-shadow:0 0 16px rgba(243,213,154,.6)}100%{opacity:0;transform:scale(1.06)}}
@keyframes ecICore{0%{opacity:0;transform:scale(.3)}12%{opacity:1;transform:scale(.8)}24%{transform:scale(1.5)}30%{transform:scale(.9)}46%{transform:scale(1.7)}52%{transform:scale(1)}64%{transform:scale(2)}69%{transform:scale(1.15)}78%{transform:scale(2.3)}82%{transform:scale(1.3)}88%{transform:scale(2.6)}93%{transform:scale(.55)}100%{opacity:1;transform:scale(9)}}
@keyframes ecIHalo{0%{opacity:0;transform:scale(.3)}24%{opacity:.5;transform:scale(.8)}46%{opacity:.6;transform:scale(.95)}64%{opacity:.75;transform:scale(1.1)}78%{opacity:.85;transform:scale(1.25)}88%{opacity:1;transform:scale(1.4)}93%{opacity:.5;transform:scale(.6)}100%{opacity:1;transform:scale(5)}}
@keyframes ecIRing{0%{opacity:0;transform:scale(.2)}8%{opacity:.95}100%{opacity:0;transform:scale(3.6)}}
@keyframes ecIConv{0%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(0,0) scale(1.2)}}
@keyframes ecIRays{0%{opacity:0}60%{opacity:.5}92%{opacity:.9}100%{opacity:1}}
@keyframes ecFlyB{0%{transform:none;opacity:1}100%{transform:translate(152px,486px) scale(.2);opacity:.2}}
@keyframes ecFade{from{opacity:0}to{opacity:1}}
@keyframes ecCam{from{transform:scale(1)}to{transform:scale(1.3)}}
@keyframes ecOut{to{opacity:0}}
@keyframes ecDraw{to{stroke-dashoffset:0}}
@keyframes ecUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ecRecede{to{opacity:.2;transform:scale(.92);filter:blur(2px)}}
@keyframes ecFlash{0%{opacity:0;transform:scale(.2)}20%{opacity:1}100%{opacity:0;transform:scale(3.4)}}
@keyframes ecShock{0%{opacity:0;transform:scale(.5)}2%{opacity:.9;transform:scale(.5)}100%{opacity:0;transform:scale(3.4)}}
@keyframes ecPh{0%{opacity:0;transform:translateY(10px)}15%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
@keyframes ecTw{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes ecBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes ecOrb{0%{opacity:0;transform:translate(var(--x0),var(--y0)) scale(.4)}15%{opacity:1}100%{opacity:1;transform:translate(0,0) scale(1.5)}}
@keyframes ecOrbOut{to{opacity:0;transform:scale(2.2)}}
@keyframes ecGrow{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:scale(1)}}
@keyframes ecGlowUp{0%{opacity:0;transform:scale(.3)}100%{opacity:.85;transform:scale(1)}}
@keyframes ecGlowL{0%{opacity:0}40%{opacity:1}100%{opacity:.85}}
@keyframes ecPulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes ecRip{0%{opacity:0;transform:scale(.08)}2%{opacity:.95;transform:scale(.08)}100%{opacity:0;transform:scale(1)}}
@keyframes ecSpl{0%{opacity:0;transform:translate(0,0)}10%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
@keyframes ecToC{0%{opacity:0;transform:none}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
@keyframes ecFlip{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.15)}}
@keyframes ecWave{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
@keyframes ecRay{0%,100%{transform:rotate(-4deg);opacity:.7}50%{transform:rotate(4deg);opacity:1}}
@keyframes ecBub{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-520px)}}
@keyframes ecTrail{0%{opacity:0;transform:translateY(0) scale(.4)}20%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:translateY(-70px) scale(1.2)}}
@keyframes ecSink{0%{opacity:0;offset-distance:0%}5%{opacity:1}100%{opacity:1;offset-distance:100%}}
@keyframes ecSwingB{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes ecDust{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(6px,-10px);opacity:1}}
@keyframes ecHL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes ecHR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes ecFillTo{to{fill-opacity:.5}}
@keyframes ecStep{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1)}100%{opacity:.55;transform:scale(1)}}
@keyframes ecMarch{to{stroke-dashoffset:-26}}
@keyframes ecShake{0%,100%{transform:none}20%{transform:translate(-7px,2px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
@keyframes ecHandIn{0%{opacity:0;transform:translate(60px,280px)}100%{opacity:1;transform:none}}
@keyframes ecHandOut{to{opacity:0;transform:translate(60px,280px)}}
@keyframes ecLipT{0%,100%{transform:none}25%,62%{transform:translateY(24px)}}
@keyframes ecLipB{0%,100%{transform:none}25%,62%{transform:translateY(-24px)}}
@keyframes ecMouth{0%,100%{transform:scaleY(1)}25%,62%{transform:scaleY(.12)}}
@keyframes ecZoomD{0%{transform:scale(1)}85%{opacity:1}100%{transform:scale(16);opacity:0}}
@keyframes ecViewIn{from{transform:scale(1.8)}to{transform:scale(1)}}
@keyframes ecFlame{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.4)}100%{opacity:1;transform:scale(1)}}
@keyframes ecFlick{from{transform:scaleY(1) skewX(0)}to{transform:scaleY(.85) skewX(5deg)}}
@keyframes ecReveal{from{transform:scale(.05)}to{transform:scale(1)}}
@keyframes ecSunUp2{0%{opacity:0;transform:translateY(0)}12%{opacity:1}100%{opacity:1;transform:translateY(-310px)}}
@keyframes ecMoon{0%{opacity:0;transform:translate(60px,120px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:{{ bg }};font-family:'Geist',system-ui,sans-serif;color:#FFFDF8;text-align:center">
  <sc-if value="{{ intro }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;overflow:hidden">
      <span style="position:absolute;inset:0;background:radial-gradient(circle at 50% 56%,transparent 20%,rgba(0,0,0,.75) 75%);opacity:0;animation:ecFade 3s ease-in both"></span>
      <span style="position:absolute;left:-60px;top:212px;width:510px;height:510px;border-radius:50%;background:repeating-conic-gradient(rgba(243,213,154,.16) 0 2deg,transparent 2deg 14deg);-webkit-mask-image:radial-gradient(circle,#000 8%,transparent 58%);mask-image:radial-gradient(circle,#000 8%,transparent 58%);opacity:0;animation:ecIRays 3.2s ease-in both,ecOrbit 18s linear infinite"></span>
      <span style="position:absolute;left:28px;right:28px;top:300px;font:italic 400 34px/1.15 'Instrument Serif',serif;color:#F3E3B8;text-wrap:balance;opacity:0;animation:ecIPhrase 3.2s ease both">{{ phrase }}</span>
      <div style="position:absolute;left:195px;top:467px;width:0;height:0">
        <sc-for list="{{ iRings }}" as="r" hint-placeholder-count="4"><span style="position:absolute;left:-40px;top:-40px;width:80px;height:80px;border-radius:50%;border:{{ r.w }} solid #F3D59A;box-shadow:0 0 12px rgba(243,213,154,.6);opacity:0;animation:ecIRing {{ r.l }} {{ r.d }} cubic-bezier(.2,.7,.3,1) both"></span></sc-for>
        <sc-for list="{{ iConv }}" as="p" hint-placeholder-count="16"><span style="position:absolute;left:-2px;top:-2px;width:{{ p.s }};height:{{ p.s }};border-radius:50%;background:#FFE7B0;box-shadow:0 0 8px #FFD58A;--dx:{{ p.dx }};--dy:{{ p.dy }};opacity:0;animation:ecIConv {{ p.l }} {{ p.d }} cubic-bezier(.5,0,.8,.6) both"></span></sc-for>
        <span style="position:absolute;left:-90px;top:-90px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,160,.75),rgba(255,200,120,.2) 40%,transparent 70%);opacity:0;animation:ecIHalo 3.2s ease-in both"></span>
        <span onAnimationEnd="{{ introEnd }}" style="position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#FFFFFF 30%,#FFE3A8 60%,#F3C46A);box-shadow:0 0 18px #FFD58A,0 0 40px rgba(255,200,120,.7);opacity:0;animation:ecICore 3.2s ease-in-out both"></span>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ go }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;animation:ecFade .4s ease both">
  <div style="position:absolute;inset:0;animation:ecRecede 1.2s {{ dimD }} ease both">
   <div style="position:absolute;inset:0;animation:{{ shake }}">

    <sc-if value="{{ isP }}" hint-placeholder-val="{{ false }}">
      <svg width="390" height="844" viewBox="0 0 390 844" style="position:absolute;inset:0">
        <defs>
          <radialGradient id="{{ u }}pd" cx="195" cy="300" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7A5E38"></stop><stop offset=".3" stop-color="#3E2E1C"></stop><stop offset="1" stop-color="#110C07"></stop></radialGradient>
          <linearGradient id="{{ u }}pb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FFF3D6" stop-opacity=".85"></stop><stop offset="1" stop-color="#FFF3D6" stop-opacity="0"></stop></linearGradient>
          <filter id="{{ u }}pf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"></feGaussianBlur></filter>
          <filter id="{{ u }}pf2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="26"></feGaussianBlur></filter>
        </defs>
        <circle cx="195" cy="300" r="420" fill="url(#{{ u }}pd)" style="opacity:0;animation:ecFade 2.2s .3s ease both"></circle>
        <sc-for list="{{ cells }}" as="c" hint-placeholder-count="0"><path d="{{ c.d }}" fill="#0E0905" style="opacity:0;animation:ecFadeTo 1s {{ c.dl }} ease both"></path></sc-for>
        <g style="transform-origin:195px 300px;animation:ecOrbit 16s 2.6s linear infinite">
          <g style="opacity:0;animation:ecFade 1.8s 2.6s ease both">
            <polygon points="183,300 207,300 300,10 90,10" fill="url(#{{ u }}pb)"></polygon>
            <ellipse cx="195" cy="64" rx="110" ry="54" fill="#FFE7B0" opacity=".55" filter="url(#{{ u }}pf2)"></ellipse>
            <ellipse cx="195" cy="64" rx="56" ry="26" fill="#FFF6DE" opacity=".75" filter="url(#{{ u }}pf)"></ellipse>
            <sc-for list="{{ dust }}" as="d" hint-placeholder-count="0"><circle cx="{{ d.x }}" cy="{{ d.y }}" r="{{ d.r }}" fill="#FFF3D6" style="animation:ecDust {{ d.l }} {{ d.d }} ease-in-out infinite"></circle></sc-for>
          </g>
        </g>
        <circle cx="195" cy="300" r="96" fill="#FFF3D6" filter="url(#{{ u }}pf2)" style="opacity:0;animation:ecFade 1s .4s ease both,ecPulse 2.6s 1.6s ease-in-out infinite"></circle>
        <g style="transform-box:fill-box;transform-origin:center;animation:ecBeat .45s 5s ease-in-out 3"><circle cx="195" cy="300" r="44" fill="#FFFDF5" style="opacity:0;animation:ecFade .8s .4s ease both"></circle></g>
      </svg>
      <span style="position:absolute;left:-5px;top:100px;width:400px;height:400px;border-radius:50%;background:repeating-conic-gradient(rgba(255,240,200,.2) 0 3deg,transparent 3deg 12deg);-webkit-mask-image:radial-gradient(circle,#000 14%,transparent 60%);mask-image:radial-gradient(circle,#000 14%,transparent 60%);opacity:0;animation:ecFade 1.4s 1.4s ease both,ecOrbit 40s 1.4s linear infinite"></span>
    </sc-if>

    <sc-if value="{{ isT }}" hint-placeholder-val="{{ false }}">
      <svg width="390" height="844" viewBox="0 0 390 844" style="position:absolute;inset:0">
        <defs>
          <radialGradient id="{{ u }}sw" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#E8FFFB" stop-opacity=".95"></stop><stop offset=".45" stop-color="#9FE6E6" stop-opacity=".4"></stop><stop offset="1" stop-color="#9FE6E6" stop-opacity="0"></stop></radialGradient>
          <linearGradient id="{{ u }}ry" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2FFFC" stop-opacity=".55"></stop><stop offset="1" stop-color="#F2FFFC" stop-opacity="0"></stop></linearGradient>
          <filter id="{{ u }}bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"></feGaussianBlur></filter>
          <filter id="{{ u }}bs" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"></feGaussianBlur></filter>
        </defs>
        <ellipse cx="195" cy="20" rx="260" ry="190" fill="url(#{{ u }}sw)" style="animation:ecFade 1.6s .1s ease both"></ellipse>
        <g fill="none" stroke="rgba(235,255,252,.55)" stroke-width="1.4" filter="url(#{{ u }}bs)" style="opacity:0;animation:ecFade 1.4s .3s ease both"><sc-for list="{{ caus }}" as="c" hint-placeholder-count="0"><path d="{{ c.p }}" style="animation:ecWave {{ c.l }} {{ c.d }} ease-in-out infinite"></path></sc-for></g>
        <g filter="url(#{{ u }}bl)" style="opacity:0;animation:ecFade 2s .6s ease both"><sc-for list="{{ rays }}" as="r" hint-placeholder-count="0"><g style="transform-origin:{{ r.o }};animation:ecRay {{ r.l }} {{ r.d }} ease-in-out infinite"><polygon points="{{ r.p }}" fill="url(#{{ u }}ry)"></polygon></g></sc-for></g>
        <path d="M-20 790c60-26 120-30 180-14s120 18 250-10V860H-20z" fill="#0A3442" style="opacity:0;animation:ecFade 1.6s .8s ease both"></path>
        <path d="M-20 812c80-16 150-10 220 2s120 6 210-8V860H-20z" fill="#072A36" style="opacity:0;animation:ecFade 1.6s .9s ease both"></path>
        <sc-for list="{{ floor }}" as="c" hint-placeholder-count="0"><ellipse cx="{{ c.x }}" cy="{{ c.y }}" rx="5" ry="1.8" fill="#E8C774" style="animation:ecTw {{ c.l }} {{ c.d }} ease-in-out infinite"></ellipse></sc-for>
        <g fill="none" stroke="rgba(240,255,252,.9)" stroke-width="1.6"><sc-for list="{{ rip1 }}" as="r" hint-placeholder-count="0"><ellipse cx="200" cy="104" rx="70" ry="10" style="transform-box:fill-box;transform-origin:center;opacity:0;animation:ecRip 1.5s {{ r.d }} ease-out both"></ellipse></sc-for></g>
        <circle cx="195" cy="300" r="80" fill="#FFE7A8" filter="url(#{{ u }}bl)" style="transform-box:fill-box;transform-origin:center;opacity:0;animation:ecGlowUp 1.5s 7s ease-in both"></circle>
      </svg>
      <sc-for list="{{ bub }}" as="b" hint-placeholder-count="0"><span style="position:absolute;left:{{ b.x }};top:{{ b.y }};width:{{ b.s }};height:{{ b.s }};border-radius:50%;border:1px solid rgba(235,255,252,.75);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),rgba(255,255,255,.05) 60%);opacity:0;animation:ecBub {{ b.l }} {{ b.d }} ease-in infinite"></span></sc-for>
      <sc-for list="{{ trail }}" as="b" hint-placeholder-count="0"><span style="position:absolute;left:{{ b.x }};top:{{ b.y }};width:{{ b.s }};height:{{ b.s }};border-radius:50%;border:1px solid rgba(235,255,252,.85);opacity:0;animation:ecTrail 1.6s {{ b.d }} ease-out both"></span></sc-for>
      <sc-for list="{{ spl }}" as="p" hint-placeholder-count="0"><span style="position:absolute;left:198px;top:104px;width:{{ p.s }};height:{{ p.s }};border-radius:50%;border:1px solid rgba(240,255,252,.9);--dx:{{ p.x }};--dy:{{ p.y }};opacity:0;animation:ecSpl 1s {{ p.d }} cubic-bezier(.2,.7,.4,1) both"></span></sc-for>
      <span style="position:absolute;inset:0;animation:ecOut .5s 8.45s ease both;pointer-events:none">
        <span style="position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;offset-path:path('M200 104 C 140 160 250 200 175 240 S 200 285 195 300');offset-rotate:0deg;opacity:0;animation:ecSink 3.6s 3.4s cubic-bezier(.25,.6,.35,1) both">
          <span style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6D2,#E2B65A 55%,#8C6420);box-shadow:0 0 16px rgba(255,214,130,.9);animation:ecFlip .7s 3.4s linear 5,ecBeat .55s 7.1s ease-in-out 3"></span>
        </span>
      </span>
    </sc-if>

    <sc-if value="{{ isM }}" hint-placeholder-val="{{ false }}">
      <svg width="390" height="844" viewBox="0 0 390 844" style="position:absolute;inset:0">
        <defs><filter id="{{ u }}mf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"></feGaussianBlur></filter></defs>
        <sc-for list="{{ mpan }}" as="p" hint-placeholder-count="0"><rect x="{{ p.x }}" y="{{ p.y }}" width="86" height="140" rx="6" fill="{{ p.f }}" style="fill-opacity:0;animation:ecFillTo 1.2s {{ p.d }} ease both"></rect></sc-for>
        <g transform="translate(75 216) scale(4)" fill="none" stroke="#F3D59A" stroke-linecap="round" stroke-linejoin="round">
          <g style="animation:ecHL 2s 3.4s cubic-bezier(.4,0,.2,1) both"><path d="M-2 29h10c3 0 6-1 9-2.5L27 21M13 28c1 2.5 4 3.5 7 2.5M17 26.5l2.2 2.2" stroke-width="2.4" vector-effect="non-scaling-stroke"></path></g>
          <g style="animation:ecHR 2s 3.4s cubic-bezier(.4,0,.2,1) both"><path d="M62 13H52c-3 0-6 1-9 2.5L33 21M47 14c-1-2.5-4-3.5-7-2.5M43 15.5l-2.2-2.2" stroke-width="2.4" vector-effect="non-scaling-stroke"></path></g>
        </g>
        <circle cx="195" cy="300" r="34" fill="#FFF4D6" filter="url(#{{ u }}mf)" style="transform-box:fill-box;transform-origin:center;opacity:0;animation:ecGrow .6s 5.6s ease both,ecBeat .45s 6.3s ease-in-out 3"></circle>
        <circle cx="195" cy="300" r="5" fill="#FFFFFF" style="transform-box:fill-box;transform-origin:center;opacity:0;animation:ecGrow .4s 5.6s ease both"></circle>
      </svg>
    </sc-if>

    <sc-if value="{{ isPl }}" hint-placeholder-val="{{ false }}">
      <svg width="390" height="844" viewBox="0 0 390 844" style="position:absolute;inset:0">
        <defs><filter id="{{ u }}lf" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter></defs>
        <circle cx="195" cy="300" r="7" fill="#E9C77A" style="opacity:0;animation:ecFade .6s 1.4s ease both"></circle>
        <text x="262" y="446" text-anchor="start" font-family="Geist Mono" font-weight="600" font-size="11" letter-spacing="4" fill="rgba(255,253,248,.45)" style="opacity:0;animation:ecFade .8s 2.4s ease both">ITALIA</text>
        <sc-for list="{{ steps }}" as="p" hint-placeholder-count="0"><ellipse cx="{{ p.x }}" cy="{{ p.y }}" rx="5" ry="8" fill="#F3D59A" style="transform-box:fill-box;transform-origin:center;opacity:0;animation:ecStep .7s {{ p.d }} ease both"></ellipse></sc-for>
        <path d="M123 407.2H267" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="7 6" style="opacity:0;animation:ecFade .8s 2.6s ease both"></path>
        <path d="M123 407.2H267" stroke="#FFF3D6" stroke-width="7" filter="url(#{{ u }}lf)" style="opacity:0;animation:ecGlowL 1s 6.2s ease both"></path>
        <path d="M123 407.2H267" stroke="#FFF3D6" stroke-width="3" stroke-dasharray="7 6" style="opacity:0;animation:ecGlowL 1s 6.2s ease both,ecMarch 1.2s 6.2s linear infinite"></path>
        <text x="195" y="360" text-anchor="middle" font-family="Geist Mono" font-weight="700" font-size="13" letter-spacing="5" fill="#FFE7A8" style="opacity:0;animation:ecFade .8s 6.4s ease both">VATICANO</text>
      </svg>
    </sc-if>

    <sc-if value="{{ isB }}" hint-placeholder-val="{{ false }}">
      <svg width="390" height="844" viewBox="0 0 390 844" style="position:absolute;inset:0">
        <defs><linearGradient id="{{ u }}bb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3D6" stop-opacity=".7"></stop><stop offset="1" stop-color="#FFF3D6" stop-opacity=".05"></stop></linearGradient><filter id="{{ u }}bf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"></feGaussianBlur></filter></defs>
        <g style="opacity:0;animation:ecFade 1.4s 3.4s ease both"><polygon points="184,186 206,186 226,688 164,688" fill="url(#{{ u }}bb)" style="animation:ecPulse 3s 4.8s ease-in-out infinite"></polygon></g>
        <circle cx="195" cy="730" r="62" fill="#FFD58A" filter="url(#{{ u }}bf)" style="opacity:0;animation:ecGlowL 1.2s 5s ease both"></circle>
        <rect x="160" y="712" width="70" height="36" rx="4" fill="#FFD58A" style="opacity:0;animation:ecGlowL 1.2s 5s ease both"></rect>
        <path d="M168 722h54M168 738h54" stroke="#8C6420" stroke-width="1.4" style="opacity:0;animation:ecFade 1s 5.2s ease both"></path>
      </svg>

      o={bg:'#0C0F0C',studs,kbeams:[0,1,2,3,4,5,6,7].map(k=>{const a=k*Math.PI/4+.2,w=.09;const p=(r,b)=>(195+r*Math.cos(b)).toFixed(0)+','+(372+r*Math.sin(b)).toFixed(0);return{p:p(20,a-w)+' '+p(20,a+w)+' '+p(300,a+w*2.4)+' '+p(300,a-w*2.4)};}),
        dust:Array.from({length:16},(_,k)=>({x:String(120+((k*41)%150)),y:String(250+((k*67)%250)),r:String(1+(k%3)*.6),l:s(3+(k%4)),d:s((k%5)*.4)})),
        ...ph('Una puerta en el Aventino…',.8,2.6,'Asómate.',3.2,1.6,'740px')};}
    if(K==='catacumbas'){
      const niches=[];for(let r=0;r<10;r++){const y=290+r*52;niches.push({x:'22',y:String(y),w:'38',o:'.9'},{x:'66',y:String(y),w:'38',o:'.75'},{x:'286',y:String(y),w:'38',o:'.75'},{x:'330',y:String(y),w:'38',o:'.9'});}
      o={bg:'#050403',niches,orb:true,orbX:'59px',orbY:'298px',orbD:'6.4s',orbL:'1.3s',orbC:'#FFC66A',halo:'rgba(255,200,120,.5)',
        dust:Array.from({length:18},(_,k)=>({x:String(150+((k*47)%200)),y:String(420+((k*61)%300)),r:String(.8+(k%3)*.5),l:s(3+(k%4)),d:s((k%5)*.4)})),
        sparks:Array.from({length:8},(_,k)=>({x:(250+(k%3)*3)+'px',dx:((k%2?1:-1)*(6+k*3))+'px',l:s(1.4+(k%3)*.4),d:s(1.8+k*.35)})),
        spk:toC(Array.from({length:6},(_,k)=>[254-k*10,590-k*50]),6.5,.08),...ph('Bajo tus pies, otra Roma…',1.6,3,'Kilómetros de galerías en la oscuridad.',4.8,2.6,'720px')};}
    if(K==='madrugador'||K==='nocturno'){const S=skyline();o={skyl:S.sk};
      if(K==='madrugador')Object.assign(o,{bg:'linear-gradient(180deg,#0B1028 0%,#1B2448 60%,#2B2F5C 100%)',stars:stars(26,440),halo:'rgba(255,215,170,.55)',ring:'#FBE3C4',...ph('Roma todavía duerme…',.8,3,'Y tú ya estás aquí.',4.2,3,'170px')});
      else Object.assign(o,{bg:'linear-gradient(180deg,#060A1C 0%,#111A3A 60%,#1C2550 100%)',stars:stars(32,440),wins:S.wins.map(([x,y],k)=>({x:String(x),y:String(y),d:s(2.6+k*.14)})),halo:'rgba(190,200,240,.5)',ring:'#C9D2F2',...ph('Cae la noche…',.8,3,'Y Roma se enciende.',4.4,3,'200px')});}
    const PHR=['¡Eh! Aquí hay algo…','Pero… ¿qué es esto?','Espera… algo brilla por aquí.','Esto no lo encuentra cualquiera…','Mira bien… ¿lo ves?'];
    const ix=Object.keys(EK).indexOf(K);
    return{flyA:this.state&&this.state.fly?'ecFlyB .8s cubic-bezier(.5,0,.7,.4) forwards':'none',...base,...o,phrase:PHR[(ix<0?0:ix)%5],go:this.state.go,intro:this.state.intro,introEnd:e=>{if(e.target===e.currentTarget&&e.animationName==='ecICore')this.start();},
      iRings:[[.75,'1.5px'],[1.47,'2px'],[2.05,'2.5px'],[2.5,'3px'],[2.82,'3.5px']].map(([d,w])=>({d:s(d),w,l:s(1.1-d*.12)})),
      iConv:Array.from({length:18},(_,k)=>{const a=k/18*Math.PI*2+(k%2)*.17,r=150+(k%3)*40;return{dx:(Math.cos(a)*r).toFixed(0)+'px',dy:(Math.sin(a)*r).toFixed(0)+'px',s:(2+(k%3))+'px',l:s(1.3+(k%4)*.25),d:s(.6+(k%6)*.28)};})};}
}
