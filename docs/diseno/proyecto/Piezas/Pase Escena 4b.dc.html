<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
@keyframes e4Up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes e4Pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes e4Fall{0%{opacity:0;transform:translateY(0) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translateY(var(--fy)) translateX(var(--fx)) scale(.4)}}
@keyframes e4Bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes e4Count{from{transform:translateY(0)}to{transform:translateY(-120px)}}
@keyframes e4Flash{0%{opacity:0;transform:scale(.6)}40%{opacity:1}100%{opacity:0;transform:scale(2)}}
@keyframes e4Lock{0%{opacity:1;transform:scale(1)}40%{transform:scale(1.25) rotate(-12deg)}100%{opacity:0;transform:scale(.4)}}
@keyframes e4Check{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
@keyframes e4Glow{0%{box-shadow:0 0 0 0 rgba(233,199,122,0),0 10px 18px -12px rgba(0,0,0,.7)}50%{box-shadow:0 0 0 3px #E9C77A,0 0 28px 6px rgba(233,199,122,.75),0 10px 18px -12px rgba(0,0,0,.7)}100%{box-shadow:0 0 0 1.5px rgba(233,199,122,.7),0 0 14px 2px rgba(233,199,122,.35),0 10px 18px -12px rgba(0,0,0,.7)}}
@keyframes e4Beam{0%{opacity:0;transform:scaleY(0)}40%{opacity:1}100%{opacity:.0;transform:scaleY(1)}}
@keyframes e4Word{from{opacity:0;filter:blur(8px);transform:translateY(8px)}to{opacity:1;filter:blur(0);transform:none}}
</style>
</helmet>
<div style="width:390px;height:844px">
<sc-if value="{{ on }}" hint-placeholder-val="{{ true }}">
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:transparent;color:#FBF3E2;font-family:'Geist',sans-serif;animation:e4Up .5s 0s both">
  <svg width="0" height="0" style="position:absolute"><defs><linearGradient id="e4g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6DC"/><stop offset=".3" stop-color="#F3D88F"/><stop offset=".55" stop-color="#C99A44"/><stop offset=".8" stop-color="#8E6820"/><stop offset="1" stop-color="#E9C77A"/></linearGradient></defs></svg>

  

  <div style="position:absolute;left:24px;right:24px;top:62px;display:flex;justify-content:space-between">
    <sc-for list="{{ src }}" as="s" hint-placeholder-count="3">
      <div style="width:104px;display:flex;flex-direction:column;align-items:center;gap:8px;animation:e4Pop .6s {{ s.t }}s both">
        <div style="width:104px;height:92px;display:flex;align-items:center;justify-content:center"><sc-if value="{{ s.isE }}" hint-placeholder-val="{{ false }}"><dc-import name="Piezas/Emblema Secreto" kind="mon" scale="0.7" delay="1.1" hint-size="100px,100px"></dc-import></sc-if><sc-if value="{{ s.isC }}" hint-placeholder-val="{{ false }}"><dc-import name="Piezas/Insignia Coleccion" col="joyas" set="0,1,2,3" size="88" hint-size="88px,88px"></dc-import></sc-if><sc-if value="{{ s.isS }}" hint-placeholder-val="{{ false }}"><dc-import name="Piezas/Sello Logro" grade="diamante" icon="coliseo" size="88" label="ROMA" hint-size="88px,88px"></dc-import></sc-if></div>
        <span style="font:600 12.5px 'Geist';text-align:center">{{ s.n }}</span>
        <span style="font:700 13px 'Geist';color:#E9C77A;animation:e4Up .5s {{ s.t2 }}s both">{{ s.x }}</span>
      </div>
    </sc-for>
  </div>
  <sc-for list="{{ drops }}" as="d" hint-placeholder-count="6"><span style="position:absolute;left:{{ d.x }}px;top:178px;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:#F3D88F;box-shadow:0 0 10px 3px rgba(243,216,143,.85);opacity:0;--fy:{{ d.fy }}px;--fx:{{ d.fx }}px;animation:e4Fall .9s {{ d.t }}s ease-in both"></span></sc-for>

  <div style="position:absolute;left:24px;right:24px;top:232px;height:104px;border-radius:26px;background:#1E2230;border:1px solid rgba(233,199,122,.35);padding:16px 20px;display:flex;flex-direction:column;justify-content:center;gap:12px;animation:e4Up .7s 2.3s both">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span style="font:600 11px 'Geist Mono',monospace;letter-spacing:.12em;color:#E9C77A">TU EXPERIENCIA</span>
      <span style="display:block;height:30px;overflow:hidden;font:400 26px/30px 'Instrument Serif',serif"><span style="display:block;animation:e4Count 2.2s 2.7s steps(4,end) both"><span style="display:block;height:30px">0</span><span style="display:block;height:30px">150</span><span style="display:block;height:30px">300</span><span style="display:block;height:30px">450</span><span style="display:block;height:30px">600 EXP</span></span></span>
    </div>
    <span style="display:block;height:12px;border-radius:6px;background:rgba(251,243,226,.14);overflow:hidden"><span style="display:block;height:100%;width:100%;border-radius:6px;background:linear-gradient(90deg,#C99A44,#FFF6DC);transform-origin:left;animation:e4Bar 2.2s 2.7s ease-in-out both"></span></span>
    <span style="position:absolute;right:16px;top:-16px;height:30px;padding:0 14px;border-radius:999px;background:linear-gradient(135deg,#F3E2B0,#D2B67A 55%,#B58A2E);color:#4A3510;font:700 12px/30px 'Geist';animation:e4Pop .6s 5s both">NIVEL 4</span>
  </div>
  <span style="position:absolute;left:130px;top:220px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(255,246,220,.7),transparent 65%);opacity:0;animation:e4Flash 1s 5s ease-out both"></span>

  <span style="position:absolute;left:0;right:0;top:360px;text-align:center;font:600 11px 'Geist Mono',monospace;letter-spacing:.16em;color:rgba(251,243,226,.7);animation:e4Up .6s 5.5s both">Y ADEMÁS TE ABRE PUERTAS</span>
  <span style="position:absolute;left:50%;top:338px;width:2px;height:22px;margin-left:-1px;background:linear-gradient(#E9C77A,transparent);transform-origin:top;opacity:0;animation:e4Beam .9s 5.2s ease-out both"></span>

  <div style="position:absolute;left:24px;right:24px;top:388px;display:flex;flex-direction:column;gap:8px">
    <sc-for list="{{ prizes }}" as="p" hint-placeholder-count="3">
      <div style="position:relative;min-height:72px;border-radius:20px;background:linear-gradient(135deg,#23283A,#1A1E2C);display:flex;align-items:center;gap:14px;padding:0 16px;box-shadow:0 10px 18px -12px rgba(0,0,0,.7);animation:e4Up .7s {{ p.t }}s both,e4Glow 1.6s {{ p.u }}s ease-out both">
        <span style="position:relative;width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#FFF6DC,#D9BC6E);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A3510" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{ p.d }}"></path></svg></span>
        <div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font:600 15px 'Geist'">{{ p.n }}</span><span style="font:400 12px/1.3 'Geist';color:rgba(251,243,226,.7);text-wrap:balance">{{ p.s }}</span></div>
        <span style="position:relative;width:30px;height:30px"><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:e4Lock .6s {{ p.u }}s both"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(251,243,226,.7)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z"></path></svg></span><span style="position:absolute;inset:0;border-radius:50%;background:#2B7F45;display:flex;align-items:center;justify-content:center;opacity:0;animation:e4Check .5s {{ p.u2 }}s both"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span></span>
      </div>
    </sc-for>
  </div>

  
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state={on:true};
  renderVals(){
    const src=[
      {n:'Emblema',isE:true,x:'+25 EXP',t:.9,t2:2.0,bg:'radial-gradient(circle at 35% 28%,#FFF6DC,#C99A44 60%,#8E6820)',d:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z'},
      {n:'Pedazo',isC:true,x:'+5 EXP',t:1.4,t2:2.1,bg:'radial-gradient(circle at 35% 28%,#FFE9D2,#D9926E 60%,#A55C3E)',d:'M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 3v18M4 7.5l8 4.5 8-4.5'},
      {n:'Sello de oro',isS:true,x:'+125 EXP',t:1.9,t2:2.2,bg:'radial-gradient(circle at 35% 28%,#FFFFFF,#C9D0DE 60%,#7A8298)',d:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7l1.8 3.6 4 .6-2.9 2.8.7 4L12 16l-3.6 2 .7-4L6.2 11.2l4-.6z'}
    ];
    const xs=[76,195,314];
    const drops=[];xs.forEach((x,k)=>{[0,1].forEach(j=>drops.push({x,t:(2.0+k*.12+j*.25).toFixed(2),fy:40+j*8,fx:(195-x)*.0+(j?8:-8)}));});
    const prizes=[
      {n:'Sorteo anual',s:'Un viaje al destino del año, para viajeros de nivel 3 o más.',t:5.9,u:7.4,u2:7.8,d:'M3 8h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z'},
      {n:'Logros exclusivos',s:'Fundador, Pionero… solo para quien llega primero.',t:6.4,u:8.1,u2:8.5,d:'M12 14a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM8.5 13.5L7 21l5-3 5 3-1.5-7.5'},
      {n:'Regalos para los más viajeros',s:'Pases gratis, descuentos y sorpresas durante el año.',t:6.9,u:8.8,u2:9.2,d:'M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7C10 7 8 6 8 4.5S10 2 12 5c2-3 4-1.500 4 0S14 7 12 7z'}
    ];
    return{src,drops,prizes,on:true,replay:()=>{this.setState({on:false},()=>setTimeout(()=>this.setState({on:true}),60));}};
  }
}
</script>
</body>
</html>
