<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;left:0;right:0;bottom:0;top:{{ top }}px;border-radius:32px 32px 0 0;background:#FBF3E2;box-shadow:0 -20px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden">
  <div style="position:relative;flex:none;padding:10px 16px 0">
    <span style="display:block;margin:0 auto;width:44px;height:4px;border-radius:2px;background:rgba(28,34,48,.25)"></span>
    <div style="display:flex;align-items:center;justify-content:space-between;padding-top:10px">
      <span style="width:38px;height:38px;border-radius:50%;background:rgba(28,34,48,.08);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C2230" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
      <sc-if value="{{ hasVit }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 5px;border-radius:999px;background:#FFFDF8;border:1px solid rgba(28,34,48,.12)"><span style="width:30px;height:30px;border-radius:50%;background:{{ vitBg }};display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="{{ vitIc }}"></path></svg></span><span style="font:700 13px 'Geist';color:#1C2230">{{ vitTx }}</span></span></sc-if>
    </div>
  </div>
  <div style="flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:6px 18px 40px;display:flex;flex-direction:column;gap:14px">
    <div style="flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center">
      <div style="position:relative;width:196px;height:178px;display:flex;align-items:center;justify-content:center"><span style="position:absolute;inset:6px 8px;border-radius:50%;background:radial-gradient(circle,rgba(243,216,143,.55),rgba(243,216,143,0) 68%)"></span>
        <sc-if value="{{ isLanza }}" hint-placeholder-val="{{ false }}"><dc-import name="Piezas/Insignia Lanza Codigo" col="{{ col }}" set="{{ set }}" size="{{ 176 }}" hint-size="176px,176px"></dc-import></sc-if>
        <sc-if value="{{ isRoma }}" hint-placeholder-val="{{ false }}"><dc-import name="Piezas/Insignia Lanza Codigo" col="{{ col }}" set="{{ set }}" size="{{ 176 }}" hint-size="176px,176px"></dc-import></sc-if>
        <sc-if value="{{ isMed }}" hint-placeholder-val="{{ false }}"><dc-import name="Piezas/Sello Logro" grade="{{ grade }}" icon="{{ icon }}" shape="{{ shape }}" label="{{ label }}" size="{{ 176 }}" hint-size="176px,176px"></dc-import></sc-if>
        <sc-if value="{{ isViaj }}" hint-placeholder-val="{{ false }}"><dc-import name="Piezas/Medalla Destino" stage="{{ stage }}" icon="path" icd="M8 21s-4.5-3.8-4.5-8a4.5 4.5 0 0 1 9 0c0 4.2-4.5 8-4.5 8zM16 21s-4.5-3.8-4.5-8a4.5 4.5 0 0 1 9 0c0 4.2-4.5 8-4.5 8zM8 12.6h.01M16 12.6h.01" size="{{ 176 }}" hint-size="176px,176px"></dc-import></sc-if>
      </div>
      <span style="font:400 30px/1.05 'Instrument Serif',serif;text-wrap:balance">{{ title }}</span>
      <span style="font:600 11px 'Geist Mono',monospace;letter-spacing:.14em;color:{{ subC }}">{{ sub }}</span>
      <sc-if value="{{ need }}" hint-placeholder-val="{{ false }}"><span style="font:500 13.5px/1.35 'Geist';color:rgba(28,34,48,.62)">{{ need }}</span></sc-if>
    </div>
    <sc-if value="{{ hasGot }}" hint-placeholder-val="{{ false }}"><div style="flex:none;display:flex;flex-direction:column;gap:7px"><span style="font:600 10px 'Geist Mono',monospace;letter-spacing:.18em;color:#2F6B43">{{ gotT }}</span>
      <sc-for list="{{ got }}" as="r" hint-placeholder-count="3"><div style="display:flex;align-items:center;gap:12px;padding:6px 12px 6px 6px;border-radius:18px;background:#FFFDF8;border:1px solid rgba(43,127,69,.3)"><span style="position:relative;width:48px;height:48px;border-radius:13px;flex:none;background:{{ r.ph }}"><span style="position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:#2B7F45;border:2px solid #FFFDF8;display:flex;align-items:center;justify-content:center;box-sizing:border-box"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font:400 18px/1.15 'Instrument Serif',serif">{{ r.n }}</span><span style="font:500 12px 'Geist';color:rgba(28,34,48,.55)">{{ r.d }}</span></span></div></sc-for></div></sc-if>
    <sc-if value="{{ hasMiss }}" hint-placeholder-val="{{ false }}"><div style="flex:none;display:flex;flex-direction:column;gap:7px"><span style="font:600 10px 'Geist Mono',monospace;letter-spacing:.18em;color:#6F4E37">LO QUE FALTA</span>
      <sc-for list="{{ miss }}" as="r" hint-placeholder-count="3"><div style="display:flex;align-items:center;gap:12px;padding:6px 12px 6px 6px;border-radius:18px;background:#F4ECDC;border:1px dashed rgba(28,34,48,.2)"><span style="width:48px;height:48px;border-radius:13px;flex:none;background:{{ r.ph }};filter:grayscale(1);opacity:.55"></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font:400 18px/1.15 'Instrument Serif',serif;color:rgba(28,34,48,.7)">{{ r.n }}</span><span style="font:500 12px 'Geist';color:rgba(28,34,48,.5)">{{ r.d }}</span></span></div></sc-for></div></sc-if>
  </div>
<sc-if value="{{ acts }}" hint-placeholder-val="{{ false }}"><div style="flex:none;padding:12px 18px 26px;border-top:1px solid rgba(28,34,48,.08);background:#FBF3E2;display:flex;flex-direction:column;gap:10px;box-shadow:0 -12px 20px -16px rgba(28,34,48,.35)">
    <div style="display:flex;gap:10px"><span style="flex:1;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font:700 15px 'Geist';background:linear-gradient(135deg,#F3E2B0,#D2B67A 55%,#B58A2E);color:#4A3510;box-shadow:0 10px 20px -14px rgba(110,80,24,.7),inset 0 1px 0 rgba(255,255,255,.55)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#4A3510" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"></path></svg>Compartir</span><span style="flex:1;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font:700 15px 'Geist';background:#FFFDF8;border:1px solid rgba(181,138,46,.6);color:#4A3510"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#4A3510" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l14 8-14 8z"></path></svg>Volver a ver</span></div>
    <sc-if value="{{ hasTit }}" hint-placeholder-val="{{ false }}"><div style="height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;font:700 14.5px 'Geist';background:{{ titBg }};color:{{ titFg }};border:1px solid {{ titBd }}"><span style="width:24px;height:24px;border-radius:50%;background:{{ titDot }};border:1.5px solid {{ titBd }};display:flex;align-items:center;justify-content:center;box-sizing:border-box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="display:{{ titChk }}"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>Es tu título</div></sc-if>
  </div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:375,&quot;height&quot;:812},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;coleccion&quot;,&quot;medalla&quot;,&quot;viajero&quot;],&quot;default&quot;:&quot;coleccion&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ins&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;lanza&quot;,&quot;roma&quot;],&quot;default&quot;:&quot;lanza&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;col&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;set&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;grade&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;bronce&quot;,&quot;plata&quot;,&quot;oro&quot;,&quot;diamante&quot;],&quot;default&quot;:&quot;plata&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;volcan&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;shape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;round&quot;,&quot;oval&quot;],&quot;default&quot;:&quot;round&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;LANZAROTE&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stage&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;need&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;vit&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;add&quot;,&quot;in&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;acts&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;tit&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;off&quot;,&quot;on&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;gotT&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;LO CONSEGUIDO&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;got&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;[]&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;miss&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;[]&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;top&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:58,&quot;tsType&quot;:&quot;number&quot;}}">
const j=(s)=>{try{return JSON.parse(s||'[]');}catch(e){return [];}};
class Component extends DCLogic {
  renderVals(){
    const p=this.props,kind=String(p.kind||'coleccion'),vit=String(p.vit||'');
    const got=j(p.got),miss=j(p.miss),ins=String(p.ins||'lanza');
    return{top:Number(p.top)||58,col:String(p.col||'1'),set:String(p.set||''),stage:Number(p.stage)||2,grade:String(p.grade||'none'),icon:String(p.icon||'coliseo'),shape:String(p.shape||'round'),label:String(p.label||''),
      isLanza:kind==='coleccion'&&ins==='lanza',isRoma:kind==='coleccion'&&ins==='roma',isMed:kind==='medalla',isViaj:kind==='viajero',
      title:String(p.title||''),sub:String(p.sub||''),subC:kind==='medalla'?'#6A727E':'#8E6820',need:String(p.need||''),
      hasVit:vit!=='',vitBg:vit==='in'?'#2F7D4F':'#F29A2E',vitIc:vit==='in'?'M5 12.5l4.5 4.5L19 7.5':'M12 5v14M5 12h14',vitTx:vit==='in'?'En tu vitrina':'Llevar a mi vitrina',
      acts:String(p.acts)==='true',hasTit:String(p.tit||'')!=='',titBg:String(p.tit)==='on'?'#1C2230':'#FFFDF8',titFg:String(p.tit)==='on'?'#F3D88F':'#1C2230',titBd:String(p.tit)==='on'?'#B58A2E':'rgba(28,34,48,.25)',titDot:String(p.tit)==='on'?'#B58A2E':'transparent',titChk:String(p.tit)==='on'?'block':'none',gotT:String(p.gotT||'LO CONSEGUIDO'),got,miss,hasGot:got.length>0,hasMiss:miss.length>0};
  }
}
</script>
</body>
</html>
