<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg width="{{ S }}" height="{{ H }}" viewBox="0 0 220 260" fill="none" style="overflow:visible;display:block;flex:none">
  <defs>
    <linearGradient id="{{ u }}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF3C4"></stop><stop offset=".4" stop-color="#F0BD4A"></stop><stop offset=".75" stop-color="#B8791C"></stop><stop offset="1" stop-color="#F6D26B"></stop></linearGradient>
    <linearGradient id="{{ u }}gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0B8"></stop><stop offset=".55" stop-color="#E4A93C"></stop><stop offset="1" stop-color="#7A4A10"></stop></linearGradient>
    <linearGradient id="{{ u }}sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1440"></stop><stop offset=".5" stop-color="#34357A"></stop><stop offset=".8" stop-color="#D88A62"></stop><stop offset="1" stop-color="#FFC878"></stop></linearGradient>
    <radialGradient id="{{ u }}gl" cx=".5" cy=".5" r=".5"><stop offset=".6" stop-color="#9FD0FF" stop-opacity="0"></stop><stop offset=".92" stop-color="#BFE4FF" stop-opacity=".35"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity=".8"></stop></radialGradient>
    <radialGradient id="{{ u }}su" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE29A" stop-opacity=".95"></stop><stop offset="1" stop-color="#FFB060" stop-opacity="0"></stop></radialGradient>
    <linearGradient id="{{ u }}sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"></stop><stop offset=".5" stop-color="#fff" stop-opacity=".8"></stop><stop offset="1" stop-color="#fff" stop-opacity="0"></stop></linearGradient>
    <linearGradient id="{{ u }}sp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8FB0FF"></stop><stop offset="1" stop-color="#1A2A78"></stop></linearGradient>
    <clipPath id="{{ u }}o"><circle cx="110" cy="108" r="84"></circle></clipPath>
    <clipPath id="{{ u }}t"><path d="{{ tableD }}"></path></clipPath>
    <clipPath id="{{ u }}j"><path d="{{ outerD }}"></path></clipPath>
    <filter id="{{ u }}sh" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000" flood-opacity=".5"></feDropShadow></filter>
  </defs>
  <sc-if value="{{ isOrbe }}" hint-placeholder-val="{{ true }}">
    <ellipse cx="110" cy="246" rx="70" ry="7" fill="#000" opacity=".35"></ellipse>
    <path d="M60 196Q110 214 160 196L172 230Q110 250 48 230Z" fill="url(#{{ u }}gv)" stroke="#FFF3C4" stroke-width="1.2"></path>
    <path d="M52 218Q110 236 168 218M56 206Q110 224 164 206" stroke="#7A4A10" stroke-width="1" opacity=".6"></path>
    <circle cx="110" cy="108" r="84" fill="#0B1440" filter="url(#{{ u }}sh)"></circle>
    <g clip-path="url(#{{ u }}o)">
      <rect x="20" y="20" width="180" height="180" fill="url(#{{ u }}sk)"></rect>
      <circle cx="108" cy="152" r="70" fill="url(#{{ u }}su)"></circle>
      <sc-for list="{{ stars }}" as="s" hint-placeholder-count="14"><circle cx="{{ s.x }}" cy="{{ s.y }}" r="{{ s.r }}" fill="#FFFFFF"><animate attributeName="opacity" values=".1;1;.1" dur="{{ s.d }}s" repeatCount="indefinite"></animate></circle></sc-for>
      <path d="M20 152Q60 146 110 150T200 150V200H20Z" fill="#2A1606"></path>
      <sc-for list="{{ sky }}" as="s" hint-placeholder-count="30"><path d="{{ s.d }}" fill="{{ s.f }}" stroke="{{ s.s }}" stroke-width="{{ s.w }}" stroke-linejoin="round" stroke-linecap="round"></path></sc-for>
      <sc-for list="{{ dust }}" as="p" hint-placeholder-count="16"><circle cx="{{ p.x }}" cy="{{ p.y }}" r="{{ p.r }}" fill="#FFE9A8"><animate attributeName="cy" values="{{ p.y }};{{ p.y2 }}" dur="{{ p.d }}s" begin="{{ p.b }}s" repeatCount="indefinite"></animate><animate attributeName="opacity" values="0;1;0" dur="{{ p.d }}s" begin="{{ p.b }}s" repeatCount="indefinite"></animate></circle></sc-for>
    </g>
    <circle cx="110" cy="108" r="84" fill="url(#{{ u }}gl)"></circle>
    <path d="M52 78A66 66 0 0 1 100 38" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".6"></path>
    <ellipse cx="82" cy="52" rx="14" ry="6" fill="#FFFFFF" opacity=".55" transform="rotate(-38 82 52)"></ellipse>
    <path d="M70 178Q110 198 152 176" stroke="#FFE7A8" stroke-width="3" stroke-linecap="round" opacity=".7"></path>
    <circle cx="110" cy="108" r="84" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.8"></circle>
    <g clip-path="url(#{{ u }}o)"><rect x="-40" y="10" width="26" height="200" fill="url(#{{ u }}sw)" transform="skewX(-20)"><animate attributeName="x" values="-60;260" dur="5.2s" repeatCount="indefinite"></animate></rect></g>
    <path d="M44 184Q110 206 176 184L182 196Q110 222 38 196Z" fill="url(#{{ u }}g)" stroke="#FFF3C4" stroke-width="1.2"></path>
  </sc-if>
  <sc-if value="{{ isJoya }}" hint-placeholder-val="{{ false }}">
    <g transform="translate(110 130)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"></animateTransform>
      <sc-for list="{{ rays }}" as="r" hint-placeholder-count="24"><path d="{{ r.d }}" fill="#F3D88F" opacity="{{ r.o }}"></path></sc-for></g></g>
    <path d="{{ outerD }}" fill="#0E1A4A" filter="url(#{{ u }}sh)"></path>
    <g clip-path="url(#{{ u }}j)">
      <sc-for list="{{ facets }}" as="f" hint-placeholder-count="24"><path d="{{ f.d }}" fill="{{ f.f }}" fill-opacity="{{ f.o }}" stroke="#FFFFFF" stroke-opacity=".55" stroke-width=".9" stroke-linejoin="round"></path></sc-for>
      <path d="{{ tableD }}" fill="#0A1240"></path>
      <g clip-path="url(#{{ u }}t)">
        <rect x="60" y="70" width="80" height="120" fill="url(#{{ u }}sp)" opacity=".55"></rect>
        <sc-for list="{{ map }}" as="s" hint-placeholder-count="6"><path d="{{ s.d }}" fill="{{ s.f }}" stroke="{{ s.s }}" stroke-width="{{ s.w }}" stroke-linejoin="round" stroke-linecap="round"></path></sc-for>
        <sc-for list="{{ pins }}" as="p" hint-placeholder-count="12"><circle cx="{{ p.x }}" cy="{{ p.y }}" r="2" fill="#FFF3C4"><animate attributeName="r" values="1.6;3.4;1.6" dur="2.4s" begin="{{ p.b }}s" repeatCount="indefinite"></animate><animate attributeName="opacity" values=".5;1;.5" dur="2.4s" begin="{{ p.b }}s" repeatCount="indefinite"></animate></circle></sc-for>
      </g>
      <rect x="-60" y="0" width="34" height="260" fill="url(#{{ u }}sw)" transform="skewX(-20)"><animate attributeName="x" values="-90;260" dur="4.8s" repeatCount="indefinite"></animate></rect>
    </g>
    <path d="{{ outerD }}" stroke="url(#{{ u }}g)" stroke-width="7" stroke-linejoin="round"></path>
    <path d="{{ outerD }}" stroke="#FFF6D2" stroke-width="1.2" stroke-linejoin="round" opacity=".8"></path>
    <sc-for list="{{ prongs }}" as="p" hint-placeholder-count="8"><circle cx="{{ p.x }}" cy="{{ p.y }}" r="6.5" fill="url(#{{ u }}g)" stroke="#FFF3C4" stroke-width="1"></circle></sc-for>
    <path d="M100 6L104 16L116 17L107 25L110 37L100 31L90 37L93 25L84 17L96 16Z" fill="url(#{{ u }}g)" stroke="#FFF3C4" stroke-width="1"></path>
    <sc-for list="{{ leaves }}" as="l" hint-placeholder-count="16"><path d="{{ l.d }}" fill="url(#{{ u }}g)" stroke="#FFF3C4" stroke-width=".6"></path></sc-for>
  </sc-if>
  <sc-for list="{{ sparks }}" as="k" hint-placeholder-count="4"><path d="M{{ k.x }} {{ k.y }}m0 -{{ k.r }}l{{ k.q }} {{ k.q }}l{{ k.r }} {{ k.q }}l-{{ k.r }} {{ k.q }}l-{{ k.q }} {{ k.r }}l-{{ k.q }} -{{ k.r }}l-{{ k.r }} -{{ k.q }}l{{ k.r }} -{{ k.q }}Z" fill="#FFFFFF"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="{{ k.d }}" repeatCount="indefinite"></animate></path></sc-for>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;orbe&quot;,&quot;joya&quot;],&quot;default&quot;:&quot;orbe&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:220,&quot;tsType&quot;:&quot;number&quot;}}">
const sh=(d,f,s,w)=>({d,f:f||'none',s:s||'none',w:w||0});
const oct=(i)=>{const l=24+i,r=176-i,t=34+i,b=226-i,c=Math.max(8,26-i*.35);return[[l+c,t],[r-c,t],[r,t+c],[r,b-c],[r-c,b],[l+c,b],[l,b-c],[l,t+c]];};
const P=(v)=>'M'+v.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+'Z';
class Component extends DCLogic {
  u='cd'+Math.random().toString(36).slice(2,7);
  renderVals(){
    const kind=String(this.props.kind||'orbe'),S=Number(this.props.size)||220,u=this.u,orbe=kind==='orbe';
    const G='url(#'+u+'gv)',sky=[],stars=[],dust=[],facets=[],map=[],pins=[],rays=[],prongs=[],leaves=[];
    for(let i=0;i<18;i++)stars.push({x:34+((i*47)%150),y:26+((i*31)%90),r:(i%3?.7:1.2),d:(1.6+(i%5)*.5).toFixed(1)});
    for(let i=0;i<16;i++){const x=50+((i*53)%120),y=60+((i*37)%70);dust.push({x,y,y2:y+38,r:(1+(i%3)*.5).toFixed(1),d:(3+(i%4)*.7).toFixed(1),b:(i*.37).toFixed(2)});}
    if(orbe){
      let d='',a='';for(let r=0;r<2;r++){const y=150-r*11,n=9,w=70/n;for(let i=0;i<n;i++){const c=52+(i+.5)*w;d+='M'+(c-2.4).toFixed(1)+' '+y+'V'+(y-6)+'a2.4 2.4 0 0 1 4.8 0V'+y+'Z';}}
      sky.push(sh('M48 150V128Q48 118 62 118H100L106 123L112 119L122 130V150Z',G,'#FFF3C4',.7));sky.push(sh(d,'#2A1606'));
      sky.push(sh('M48 139H122M48 128H108','none','#6A400E',.9));
      sky.push(sh('M124 150V136H152V150Z',G,'#FFF3C4',.7));sky.push(sh('M122 136L138 126L154 136Z',G,'#FFF3C4',.7));sky.push(sh('M128 150V138M133 150V138M138 150V138M143 150V138M148 150V138','none','#6A400E',1.1));
      sky.push(sh('M126 126A12 12 0 0 1 150 126Z',G,'#FFF3C4',.7));sky.push(sh('M137 114h2v-4h-2z',G));
      sky.push(sh('M156 150V128H172V150Z',G,'#FFF3C4',.7));sky.push(sh('M154 128A10 10 0 0 1 174 128Z',G,'#FFF3C4',.7));sky.push(sh('M163 118V108M160 112h6','none','#FFF3C4',1.4));
      sky.push(sh('M176 150Q172 134 178 120Q184 134 180 150Z','#4A2A0A'));sky.push(sh('M40 150Q36 138 41 126Q46 138 44 150Z','#4A2A0A'));
    }else{
      const O=oct(0),M=oct(16),N=oct(30),T=oct(44);
      for(let k=0;k<8;k++){const q=(k+1)%8;
        facets.push({d:P([O[k],O[q],M[q],M[k]]),f:['#9FB8FF','#4C68C8','#DDE6FF','#2A3C98'][k%4],o:.82});
        facets.push({d:P([M[k],M[q],N[q],N[k]]),f:['#2A3C98','#B8C8FF','#3C58B8','#E8EEFF'][k%4],o:.85});
        facets.push({d:P([N[k],N[q],T[q],T[k]]),f:['#6C86E0','#1E2E78','#A8BCFF','#3A52B0'][k%4],o:.9});}
      for(let k=0;k<8;k++)prongs.push({x:O[k][0],y:O[k][1]});
      map.push(sh('M82 96C90 86 114 84 124 98C132 112 128 134 120 146C112 160 94 164 84 152C74 138 76 106 82 96Z',G,'#FFF3C4',1));
      map.push(sh('M104 80C98 100 122 112 108 130C98 144 116 156 108 178','none','#5AA8E0',3));map.push(sh('M104 80C98 100 122 112 108 130C98 144 116 156 108 178','none','#E8F6FF',1));
      [[96,100],[112,98],[106,116],[90,126],[120,126],[100,136],[84,112],[114,142],[96,152],[124,108],[88,98],[110,128]].forEach(([x,y],i)=>pins.push({x,y,b:(i*.2).toFixed(1)}));
      for(let i=0;i<24;i++){const a=i/24*Math.PI*2,w=.07;rays.push({d:'M0 0L'+(Math.cos(a-w)*190).toFixed(1)+' '+(Math.sin(a-w)*190).toFixed(1)+'L'+(Math.cos(a+w)*190).toFixed(1)+' '+(Math.sin(a+w)*190).toFixed(1)+'Z',o:(i%2?.1:.2)});}
      for(let s=-1;s<=1;s+=2)for(let i=0;i<8;i++){const a=(100+i*10)*Math.PI/180,rx=118,ry=116,x=110+s*Math.cos(a)*-rx*.0+s*(88+Math.sin(i/7*Math.PI)*-6),y=232-i*30;
        leaves.push({d:'M'+(110+s*(96-Math.sin(i/7*Math.PI)*0))+' '+y+'q'+(s*14)+' -7 '+(s*18)+' -2q'+(-s*10)+' 7 '+(-s*18)+' 2Z'});}
    }
    const sparks=[[26,66,5,1.7,'0s'],[196,60,4,1.3,'.9s'],[190,160,3.5,1.2,'1.6s'],[28,164,3,1,'.4s']].map(([x,y,r,q,d])=>({x,y,r,q,d}));
    return{S,H:Math.round(S*260/220),u,isOrbe:orbe,isJoya:!orbe,sky,stars,dust,facets,map,pins,rays,prongs,leaves,sparks,outerD:P(oct(0)),tableD:P(oct(44))};
  }
}
</script>
</body>
</html>
