<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes coIn{0%{opacity:0;transform:scale(.3) rotate(-25deg)}60%{opacity:1;transform:scale(1.06) rotate(3deg)}100%{opacity:1;transform:none}}
@keyframes coStick{0%{opacity:0;transform:translate(var(--fx),var(--fy)) scale(2.2) rotate(-25deg)}60%{opacity:1;transform:translate(0,0) scale(.92) rotate(3deg)}80%{transform:scale(1.05)}100%{opacity:1;transform:none}}
@keyframes coFlash{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.8)}}
@keyframes coSpin{from{transform:translateX(0)}to{transform:translateX(-220px)}}
@keyframes coTw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes coSweep{0%{transform:translateX(-180%) rotate(20deg)}55%,100%{transform:translateX(340%) rotate(20deg)}}
@keyframes coRing{to{stroke-dashoffset:0}}
@keyframes coGlow{0%,100%{opacity:.35}50%{opacity:.85}}
[data-st="1"] *{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</helmet>
<div data-st="{{ st }}" style="position:relative;width:{{ w }};height:{{ h }};flex:none">
  <sc-if value="{{ full }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(150,210,240,.55),transparent 66%);animation:coGlow 3.6s 2.4s ease-in-out infinite"></span></sc-if>
  <div style="position:absolute;inset:0;animation:coIn 1.1s cubic-bezier(.2,.8,.2,1) both">
  <svg width="100%" height="100%" viewBox="0 0 200 220" style="position:absolute;inset:0;overflow:visible;filter:drop-shadow(0 12px 16px rgba(30,40,60,.38))">
    <defs>
      <linearGradient id="{{ gAu }}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{ au0 }}"></stop><stop offset=".35" stop-color="{{ au1 }}"></stop><stop offset=".55" stop-color="{{ au0 }}"></stop><stop offset="1" stop-color="{{ au2 }}"></stop></linearGradient>
      <radialGradient id="{{ gOc }}" cx=".36" cy=".3" r=".85"><stop offset="0" stop-color="#BFE3F2"></stop><stop offset=".55" stop-color="#4E95BC"></stop><stop offset="1" stop-color="#1E4E72"></stop></radialGradient>
      <radialGradient id="{{ gSh }}" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="rgba(255,255,255,.45)"></stop><stop offset=".5" stop-color="rgba(255,255,255,0)"></stop><stop offset=".85" stop-color="rgba(0,10,30,.25)"></stop><stop offset="1" stop-color="rgba(0,10,30,.5)"></stop></radialGradient>
      <clipPath id="{{ cG }}"><circle cx="100" cy="100" r="72"></circle></clipPath>
      <filter id="{{ fBv }}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="b"></feGaussianBlur><feSpecularLighting in="b" surfaceScale="4" specularConstant="1" specularExponent="18" lighting-color="#FFFFFF" result="s"><feDistantLight azimuth="235" elevation="40"></feDistantLight></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"></feComposite><feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".9" k4="0"></feComposite></filter>
      <filter id="{{ fLand }}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation=".8" result="b"></feGaussianBlur><feOffset dy="1.2" result="o"></feOffset><feFlood flood-color="rgba(10,30,50,.45)"></feFlood><feComposite in2="o" operator="in" result="sh"></feComposite><feSpecularLighting in="b" surfaceScale="2.5" specularConstant=".7" specularExponent="20" lighting-color="#FFFFFF" result="s"><feDistantLight azimuth="235" elevation="45"></feDistantLight></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"></feComposite><feMerge><feMergeNode in="sh"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode><feMergeNode in="s2"></feMergeNode></feMerge></filter>
    </defs>
    <circle cx="100" cy="100" r="98" fill="url(#{{ gAu }})" filter="url(#{{ fBv }})"></circle>
    <path d="{{ ticks }}" stroke="rgba(90,66,26,.4)" stroke-width=".8"></path>
    <circle cx="100" cy="100" r="81" fill="#1B2E44"></circle>
    <circle cx="100" cy="100" r="80" fill="none" stroke="#FFF3D0" stroke-width="1.2" stroke-dasharray="1 4"></circle>
    <circle cx="100" cy="100" r="72" fill="url(#{{ gOc }})"></circle>
    <g clip-path="url(#{{ cG }})">
      <g stroke="rgba(255,255,255,.18)" stroke-width=".7" fill="none"><path d="M28 100h144M40 64h120M40 136h120"></path><ellipse cx="100" cy="100" rx="36" ry="72"></ellipse><ellipse cx="100" cy="100" rx="64" ry="72"></ellipse></g>
      <sc-if value="{{ notFull }}" hint-placeholder-val="{{ true }}">
        <g transform="translate(30 36) scale(.64)">
          <sc-for list="{{ cs }}" as="c" hint-placeholder-count="6">
            <path d="{{ c.d }}" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.45)" stroke-width="1.6" stroke-dasharray="3 3"></path>
            <sc-if value="{{ c.on }}" hint-placeholder-val="{{ false }}"><g style="--fx:{{ c.fx }};--fy:{{ c.fy }};transform-box:fill-box;transform-origin:center;animation:{{ c.an }}"><path d="{{ c.d }}" fill="{{ c.c }}" stroke="#FFF6E2" stroke-width="1.6" stroke-linejoin="round" filter="url(#{{ fLand }})"></path></g></sc-if>
          </sc-for>
        </g>
      </sc-if>
      <sc-if value="{{ full }}" hint-placeholder-val="{{ false }}">
        <g transform="translate(-10 0)"><g style="animation:coSpin 14s 1.4s linear infinite">
          <sc-for list="{{ csW }}" as="c" hint-placeholder-count="12"><path d="{{ c.d }}" fill="{{ c.c }}" stroke="#FFF6E2" stroke-width="1.4" stroke-linejoin="round" filter="url(#{{ fLand }})"></path></sc-for>
        </g></g>
      </sc-if>
      <circle cx="100" cy="100" r="72" fill="url(#{{ gSh }})"></circle>
      <ellipse cx="78" cy="66" rx="30" ry="14" transform="rotate(-32 78 66)" fill="rgba(255,255,255,.3)"></ellipse>
      <sc-if value="{{ hasNew }}" hint-placeholder-val="{{ false }}"><circle cx="{{ nx }}" cy="{{ ny }}" r="20" fill="none" stroke="#FFF3C8" stroke-width="3" opacity="0" style="transform-box:fill-box;transform-origin:center;animation:coFlash .9s {{ dFl }} ease-out both"></circle></sc-if>
    </g>
    <circle cx="100" cy="100" r="72" fill="none" stroke="url(#{{ gAu }})" stroke-width="2.4"></circle>
    <sc-for list="{{ dots }}" as="d" hint-placeholder-count="6"><circle cx="{{ d.x }}" cy="{{ d.y }}" r="4.6" fill="{{ d.f }}" stroke="{{ d.s }}" stroke-width="1.4"></circle></sc-for>
    <sc-if value="{{ full }}" hint-placeholder-val="{{ false }}">
      <circle cx="100" cy="100" r="89" fill="none" stroke="#FFF1C6" stroke-width="1.6" pathLength="1" stroke-dasharray="1" style="stroke-dashoffset:1;animation:coRing 1.4s 1.2s ease both"></circle>
      <sc-for list="{{ sp }}" as="s" hint-placeholder-count="0"><g transform="{{ s.t }}"><path d="M0 -8C1 -2 2 -1 8 0 2 1 1 2 0 8-1 2-2 1-8 0-2-1-1-2 0-8z" fill="#FFFFFF" style="filter:drop-shadow(0 0 3px rgba(190,230,255,.95));transform-box:fill-box;transform-origin:center;opacity:0;animation:coTw {{ s.dur }} {{ s.d }} ease-in-out infinite"></path></g></sc-for>
    </sc-if>
    <g>
      <path d="M30 196l12-8v-4h116v4l12 8-12 8v4H42v-4z" fill="{{ au2 }}"></path>
      <path d="M42 184h116v24H42z" fill="url(#{{ gAu }})" filter="url(#{{ fBv }})"></path>
      <text x="100" y="200" text-anchor="middle" font-family="Geist Mono" font-weight="700" font-size="{{ rfs }}" letter-spacing="1.4" fill="#3A2A10">{{ rib }}</text>
    </g>
  </svg>
  <div style="position:absolute;left:14%;top:12.7%;width:72%;height:65.5%;border-radius:50%;overflow:hidden;pointer-events:none"><span style="position:absolute;top:-30%;bottom:-30%;left:0;width:22%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:coSweep {{ swD }} 2.2s ease-in-out infinite"></span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:240},&quot;got&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;eu,na,sa&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:200,&quot;tsType&quot;:&quot;number&quot;},&quot;anim&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
let UID=0;
const CONT=[
 ['eu','Europa','M104 62c6-6 18-6 24-2 6 4 4 10-2 12-6 2-8 8-14 8-6 0-10-4-10-10 0-4 0-6 2-8z','oklch(0.68 0.13 25)'],
 ['na','América del Norte','M20 58c10-12 34-16 52-10 10 4 8 14 2 20-6 6-14 4-18 12-4 8-12 10-16 18-4 6-10 4-12-2-2-8-8-14-10-22-2-6 0-12 2-16z','oklch(0.72 0.13 75)'],
 ['sa','América del Sur','M60 112c8-4 16 0 18 8 2 10-4 18-6 28-2 10-6 18-12 20-4 0-4-8-4-16 0-10-4-18-2-28 1-6 2-10 6-12z','oklch(0.66 0.14 145)'],
 ['af','África','M104 86c10-4 26-2 32 6 6 10 2 22-4 32-6 10-10 22-18 24-6 2-8-8-10-16-2-8-8-14-8-24 0-10 2-18 8-22z','oklch(0.74 0.13 60)'],
 ['as','Asia','M132 54c16-10 44-10 62-2 10 4 12 14 4 20-8 6-6 16-16 18-10 2-14 10-24 8-8-2-10-10-18-12-8-2-12-10-10-18 0-6 0-10 2-14z','oklch(0.66 0.12 330)'],
 ['oc','Oceanía','M168 128c8-4 20-2 24 4 4 8-2 14-10 14-8 0-16-4-18-10 0-4 2-6 4-8z','oklch(0.7 0.11 200)']];
const ORDER=['eu','na','sa','af','as','oc'];
const CEN={eu:[116,66],na:[44,72],sa:[68,138],af:[118,114],as:[164,68],oc:[182,136]};
class Component extends DCLogic {
  constructor(p){super(p);this.u='co'+(++UID);}
  renderVals(){const p=this.props,u=this.u;const sz=Number(p.size)||170;const an=!(p.anim===false||p.anim==='false');
    const got=String(p.got==null?'eu':p.got).split(',').map(s=>s.trim()).filter(Boolean);const N=got.length,full=N>=6;
    const last=p.last||got[got.length-1];
    const cs=CONT.map(([id,n,d,c])=>{const on=got.includes(id),isNew=id===last;const[cx,cy]=CEN[id];const fx=((cx-110)*1.4).toFixed(0)+'px',fy=((cy-100)*1.4).toFixed(0)+'px';
      return{d,c,on,fx,fy,an:on?(isNew?'coStick 1s .9s cubic-bezier(.3,1.4,.5,1) both':'none'):'none'};});
    const nc=CEN[last]||[110,100];
    const csW=[...CONT,...CONT].map(([id,n,d,c],i)=>({d:i<6?d:d.replace(/^M(\d+)/,(m,x)=>'M'+(Number(x)+220)),c}));
    const dots=ORDER.map((id,i)=>{const a=(-150+i*24)*Math.PI/180;const on=got.includes(id);const C=CONT.find(x=>x[0]===id)[3];return{x:(100+86*Math.cos(a)).toFixed(1),y:(100+86*Math.sin(a)+180).toFixed(1),f:on?C:'#3A4A60',s:on?'#FFF6E2':'rgba(255,255,255,.35)'};});
    const D=dots.map((d,i)=>{const a=(-150+i*24)*Math.PI/180;return{...d,x:(100+86*Math.cos(a)).toFixed(1),y:(100+86*Math.sin(a)).toFixed(1)};});
    const ticks=Array.from({length:120},(_,i)=>{const a=i*Math.PI/60;return 'M'+(100+89*Math.cos(a)).toFixed(1)+' '+(100+89*Math.sin(a)).toFixed(1)+'L'+(100+(i%2?94:96.5)*Math.cos(a)).toFixed(1)+' '+(100+(i%2?94:96.5)*Math.sin(a)).toFixed(1);}).join('');
    const AU=full?['#FFF3C8','#D6AE5C','#8E6824']:['#F6EBCF','#CDB27A','#9C8352'];
    const lastN=(CONT.find(x=>x[0]===last)||[])[1]||'';
    const rib=full?'LOS 6 CONTINENTES':(N===1?lastN.toUpperCase():N+' CONTINENTES');
    return{st:an?'0':'1',w:sz+'px',h:(sz*1.1).toFixed(1)+'px',gAu:u+'a',gOc:u+'o',gSh:u+'s',cG:u+'g',fBv:u+'b',fLand:u+'l',au0:AU[0],au1:AU[1],au2:AU[2],ticks,
      full,notFull:!full,cs,csW:csW.map(c=>({...c,d:c.d})),dots:D,hasNew:!full&&!!last,nx:(30+nc[0]*.64).toFixed(1),ny:(36+nc[1]*.64).toFixed(1),dFl:'1.7s',
      rib,rfs:rib.length>15?'8':'9',swD:full?'3.6s':'6s',
      sp:[[-60,106,1],[30,108,.75],[120,105,.9],[-150,107,.65],[200,104,.8]].map(([a,r,s],i)=>({t:'translate('+(100+r*Math.cos(a*Math.PI/180)).toFixed(1)+' '+(100+r*Math.sin(a*Math.PI/180)).toFixed(1)+') scale('+s+')',d:(2.2+i*0.5).toFixed(1)+'s',dur:(2.4+(i%3)*0.5).toFixed(1)+'s'}))};}
}
</script>
</body>
</html>
