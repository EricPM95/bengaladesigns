<div style="display:flex;flex-direction:column;align-items:center;gap:22px;width:390px"><div style="position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:radial-gradient(ellipse 90% 60% at 50% 0%,#2A3250,#14161C 70%);color:#FBF3E2;font-family:'Geist',sans-serif;box-shadow:0 0 0 9px #14161C,0 30px 70px -20px rgba(60,40,10,.45)"><div style="position:absolute;left:0;right:0;top:110px"><dc-import name="Piezas/Eiffel Emblema" nonce="{{ rk }}" hint-size="390px,520px"></dc-import></div><div style="position:absolute;left:28px;right:28px;top:650px;display:flex;flex-direction:column;gap:10px"><span style="font:400 40px/1.04 'Instrument Serif',serif;text-wrap:balance">Algo se esconde en cada sitio.</span><span style="font:400 17px/1.4 'Geist';color:rgba(251,243,226,.75)">Con el Pase de Roma, lo descubres.</span></div></div><span onClick="{{ replay }}" style="height:46px;padding:0 22px;border-radius:999px;background:#1C2230;color:#E9C77A;display:flex;align-items:center;gap:9px;font:600 14px 'Geist';cursor:pointer;box-shadow:0 12px 24px -12px rgba(28,34,48,.7)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#E9C77A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"></path></svg>Repetir animación</span></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state={rk:0};
  renderVals(){return{rk:this.state.rk,replay:()=>this.setState(s=>({rk:s.rk+1}))};}
}
</script>
