<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
@keyframes lzPhrase{0%{opacity:0;transform:translateY(10px);filter:blur(6px)}22%,72%{opacity:1;transform:none;filter:none}100%{opacity:0;transform:translateY(-8px);filter:blur(4px)}}
@keyframes lzRiseIn{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes lzFadeIn{from{opacity:0}to{opacity:1}}

@keyframes lzRise{from{transform:translateY(var(--y0))}to{transform:translateY(var(--y1))}}
@keyframes lzRecede{from{opacity:1;transform:scale(1);filter:none}to{opacity:.1;transform:scale(.9);filter:blur(3px)}}
@keyframes lzConv{0%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(0,0) scale(1.2)}}
@keyframes lzCore{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes lzEmerge{0%{opacity:0;transform:scale(.25);filter:blur(12px) brightness(2.4)}60%{opacity:1;filter:blur(0) brightness(1.4)}100%{opacity:1;transform:scale(1);filter:none}}
@keyframes lzHalo{0%{opacity:0;transform:scale(.5)}50%{opacity:1}100%{opacity:.55;transform:scale(1.15)}}
@keyframes lzUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes lzHeat{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-70px);opacity:0}}
@keyframes lzTw{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes lzPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes lzWave{0%{transform:translateX(-16px)}50%{transform:translateX(16px)}100%{transform:translateX(-16px)}}
@keyframes lzBoat{from{transform:translateX(-60px)}to{transform:translateX(380px)}}

</helmet>
<div style="display:flex;flex-direction:column;align-items:center;gap:12px;width:390px">
<div style="position:relative;width:390px;height:844px;overflow:hidden;border-radius:40px;background:{{ bg }};font-family:'Geist',sans-serif;color:#FFFDF8;text-align:center">
  <sc-if value="{{ on }}" hint-placeholder-val="{{ true }}">
  <div style="position:absolute;inset:0">
    <span style="position:absolute;left:30px;right:30px;top:330px;font:italic 400 34px/1.15 'Instrument Serif',serif;color:#F3E3B8;text-wrap:balance;opacity:0;animation:lzPhrase 3s .2s ease both">{{ phrase }}</span>
    <div style="position:absolute;inset:0;transform-origin:50% 52%;animation:lzRecede 1.6s 10s ease both">{{ scene }}</div>
    <div style="position:absolute;left:195px;top:440px;width:0;height:0">
      <sc-for list="{{ parts }}" as="q" hint-placeholder-count="16"><span style="position:absolute;left:-3px;top:-3px;width:{{ q.s }}px;height:{{ q.s }}px;border-radius:50%;background:#FFE7B0;box-shadow:0 0 10px #FFD58A;--dx:{{ q.dx }}px;--dy:{{ q.dy }}px;opacity:0;animation:lzConv 1.4s {{ q.at }}s cubic-bezier(.5,0,.8,.6) both"></span></sc-for>
      <span style="position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#FFFFFF 12%,rgba(255,226,160,.8) 40%,transparent 70%);opacity:0;animation:lzCore 1.5s 10.7s ease-out both"></span>
    </div>
    <span style="position:absolute;left:28px;right:28px;top:722px;font:italic 400 24px/1.25 'Instrument Serif',serif;color:#F3E3B8;text-shadow:0 2px 12px rgba(0,0,0,.7);opacity:0;animation:lzCap 3.2s 3.8s ease both">{{ c1 }}</span>
    <span style="position:absolute;left:28px;right:28px;top:722px;font:italic 400 24px/1.25 'Instrument Serif',serif;color:#F3E3B8;text-shadow:0 2px 12px rgba(0,0,0,.7);opacity:0;animation:lzCap 3.2s 7s ease both">{{ c2 }}</span>
    <div style="position:absolute;left:0;right:0;top:250px;display:flex;flex-direction:column;align-items:center;gap:18px">
      <div style="position:relative;width:300px;height:240px;flex:none;display:flex;align-items:center;justify-content:center;opacity:0;animation:lzEmerge 1.7s 11s ease-out both"><div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,{{ halo }},transparent 66%);opacity:0;animation:lzHalo 2s 11s ease both"></div><div style="position:relative;width:240px;height:240px;overflow:hidden;display:flex;align-items:center;justify-content:center"><sc-if value="{{ isK1 }}" hint-placeholder-val="{{ false }}"><dc-import name="Piezas/Emblema Secreto" kind="gl" shape="hex" glyph="M5 41L19 16l5 5 5-7 14 27zM24 21l-2 8 4 4-2 8|M16 10q2-3 0-6M24 8q2-3 0-6M32 10q2-3 0-6" scale="1.9" delay="0" hint-size="240px,240px"></dc-import></sc-if><sc-if value="{{ notK1 }}" hint-placeholder-val="{{ true }}"><dc-import name="Piezas/Emblema Lanza" kind="{{ kind }}" scale="1.9" hint-size="240px,240px"></dc-import></sc-if></div></div>
      <span style="font:400 36px/1.05 'Instrument Serif',serif;opacity:0;animation:lzUp .9s 12.6s ease both">{{ title }}</span>
      <span style="max-width:310px;font:400 15.5px/1.45 'Geist',sans-serif;color:rgba(255,253,248,.85);opacity:0;animation:lzUp .9s 13.4s ease both;text-wrap:pretty">{{ line }}</span>
    </div>
  </div>
  </sc-if>
</div>
<span onClick="{{ replay }}" style="height:44px;padding:0 22px;border-radius:14px;background:linear-gradient(180deg,#F8EBC4,#DDBE7C 50%,#B58A2E);color:#3E2A0C;border:1px solid #9A7228;display:flex;align-items:center;font:700 14px 'Geist';cursor:pointer">Repetir animación</span>
</div>
