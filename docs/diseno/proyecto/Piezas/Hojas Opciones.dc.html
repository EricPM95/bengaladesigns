<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}</style>
</helmet>
<div style="display:flex;flex-wrap:wrap;gap:44px;align-items:flex-start;padding:24px 48px 40px;font-family:'Geist',system-ui,sans-serif;color:#1C2230">
<sc-for list="{{ boards }}" as="b" hint-placeholder-count="3">
 <div style="width:390px;display:flex;flex-direction:column;gap:12px">
  <span style="font:600 11px 'Geist Mono',monospace;letter-spacing:.08em;color:#6E5018">{{ b.cap }}</span>
  <div style="position:relative;width:390px;height:844px;flex:none;border-radius:44px;overflow:hidden;background:#A9A59A;box-shadow:0 0 0 9px #14161C,0 30px 70px -20px rgba(60,40,10,.45)">
   <div style="position:absolute;inset:0;background:linear-gradient(180deg,#BFB9AB,#A29E93)"></div>
   <div style="position:absolute;left:20px;right:20px;top:70px;display:flex;flex-direction:column;gap:14px;filter:blur(7px);opacity:.75"><div style="height:110px;border-radius:26px;background:rgba(255,253,248,.7)"></div><div style="height:96px;border-radius:26px;background:rgba(255,253,248,.7)"></div><div style="height:110px;border-radius:26px;background:rgba(255,253,248,.7)"></div></div>
   <div style="position:absolute;left:0;right:0;bottom:0;border-radius:32px 32px 0 0;background:#FDFBF4;padding:10px 20px 34px;display:flex;flex-direction:column;gap:14px;box-shadow:0 -20px 40px rgba(0,0,0,.25)">
    <span style="display:block;width:44px;height:4px;border-radius:2px;background:rgba(28,34,48,.25);margin:0 auto"></span>
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-top:6px">
     <div style="display:flex;flex-direction:column;gap:3px;min-width:0"><span style="font:600 10.5px 'Geist Mono',monospace;letter-spacing:.18em;color:#6F4E37">{{ b.eye }}</span><span style="font:400 32px/1.05 'Instrument Serif',serif">{{ b.title }}</span></div>
     <span style="width:40px;height:40px;flex:none;border-radius:50%;background:#EEEAE0;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C2230" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
    </div>
    <sc-if value="{{ b.hasWho }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:8px">
     <sc-for list="{{ b.who }}" as="w" hint-placeholder-count="2"><div style="display:flex;align-items:center;gap:13px;padding:8px 10px;border-radius:20px;background:{{ w.row }};border:{{ w.rb }}"><span style="width:52px;height:52px;flex:none;border-radius:50%;background:{{ w.bg }};color:{{ w.fg }};display:flex;align-items:center;justify-content:center;font:400 26px/1 'Instrument Serif',serif">{{ w.i }}</span><span style="flex:1;font:600 17px 'Geist'">{{ w.n }}<span style="font-weight:400;color:rgba(28,34,48,.5)">{{ w.me }}</span></span><span style="height:30px;padding:0 13px;border-radius:999px;background:{{ w.cb }};color:{{ w.cf }};display:flex;align-items:center;font:600 13px 'Geist'">{{ w.c }}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(28,34,48,.4)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;display:{{ w.ch }};transform:{{ w.rot }}"><path d="M9 5l7 7-7 7"></path></svg></div></sc-for>
    </div></sc-if>
    <div style="display:flex;flex-direction:column;gap:10px">
     <sc-for list="{{ b.rows }}" as="r" hint-placeholder-count="5">
      <div style="display:flex;align-items:center;gap:14px;padding:11px 14px 11px 11px;border-radius:22px;background:{{ r.bg }};border:{{ r.bd }};opacity:{{ r.op }}">
       <span style="width:54px;height:54px;flex:none;border-radius:16px;background:{{ r.tile }};display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{ r.ic }}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{ r.d }}"></path></svg></span>
       <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font:400 23px/1.1 'Instrument Serif',serif;color:{{ r.tc }}">{{ r.t }}</span><span style="font:400 14px/1.3 'Geist';color:rgba(28,34,48,.58)">{{ r.s }}</span></span>
       <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(28,34,48,.35)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;display:{{ r.chev }}"><path d="M9 5l7 7-7 7"></path></svg>
      </div>
     </sc-for>
    </div>
   </div>
  </div>
 </div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const SAGE={tile:'#DDE5D2',ic:'#3E5A33'},SAND={tile:'#F3E3B2',ic:'#6E5018'},BLUE={tile:'#DCE4F2',ic:'#2F4E86'},GREY={tile:'#ECE8DE',ic:'#6B665A'},RED={tile:'#F7DCDC',ic:'#B3262E'};
    const row=(c,t,s,d,x={})=>({...c,t,s,d,bg:x.red?'#FFF8F7':'#FFFDF8',bd:x.red?'1px solid rgba(179,38,46,.25)':x.dash?'1.5px dashed rgba(28,34,48,.25)':'1px solid rgba(28,34,48,.12)',tc:x.red?'#B3262E':'#1C2230',op:x.off?.45:1,chev:x.nochev?'none':'block'});
    const SW='M7 7h13l-4-4M17 17H4l4 4',CAL='M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',UP='M12 19V5M6 11l6-6 6 6',DN='M12 5v14M6 13l6 6 6-6',BIN='M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6',PIN='M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10zM12 8.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z',BAG='M6 8h12l1 12H5zM9 8V6a3 3 0 0 1 6 0v2',KEY='M15 7a4 4 0 1 0-3.9 5L3 20v1h3v-2h2v-2l3-3M17 9h.01',OUT='M9 4H5v16h4M16 8l4 4-4 4M20 12H9',PL='M12 5v14M5 12h14';
    return{boards:[
      {cap:'01 · Menú de una parada',eye:'PARADA',title:'Fontana di Trevi',hasWho:false,who:[],rows:[
        row(SAND,'Cambiar parada','Elige otro sitio para este hueco',SW),
        row(BLUE,'Mover a otro día','Pásala a otro día del viaje',CAL),
        row(GREY,'Mover antes','Ya es la primera del día',UP,{off:1,nochev:1}),
        row(GREY,'Mover después','Una posición más tarde',DN),
        row(RED,'Quitar parada','Sale de tu ruta. Puedes deshacerlo',BIN,{red:1,nochev:1})]},
      {cap:'02 · Menú de un día',eye:'DÍA',title:'Domingo 15 · Hoy vuelves a casa',hasWho:false,who:[],rows:[
        row(SAGE,'Añadir lugares','Monumentos, barrios, miradores…',PIN),
        row(SAND,'Añadir una excursión','Pompeya, Florencia, la Costa Amalfitana…',BAG),
        row(RED,'Eliminar día','Se quitan el día y sus paradas',BIN,{red:1,nochev:1})]},
      {cap:'03 · Personas del viaje',eye:'ROMA · 11 – 15 NOV · 2 PERSONAS',title:'Personas del viaje',hasWho:true,
        who:[{i:'E',n:'Eric',me:' · Tú',bg:'#1C2230',fg:'#F3D88F',c:'Administrador',cb:'#1C2230',cf:'#F3D88F',row:'transparent',rb:'1px solid transparent',ch:'none',rot:'none'},{i:'V',n:'VIAJES',me:'',bg:'#F3E3B2',fg:'#6E5018',c:'Puede editar',cb:'#F3E3B2',cf:'#6E5018',row:'transparent',rb:'1px solid transparent',ch:'block',rot:'none'}],
        rows:[row(GREY,'Añadir a alguien','Con un enlace o un código',PL,{dash:1,nochev:1})]},
      {cap:'04 · Al tocar a VIAJES',eye:'PERSONAS DEL VIAJE · PUEDE EDITAR',title:'VIAJES',hasWho:false,who:[],
        rows:[row(SAND,'Cambiar permiso','Administrador, puede editar o solo recomendar',KEY),
         row(RED,'Quitar del viaje','Pierde el acceso y su plaza del pase vuelve a ti',OUT,{red:1,nochev:1})]}
    ]};
  }
}
</script>
</body>
</html>
