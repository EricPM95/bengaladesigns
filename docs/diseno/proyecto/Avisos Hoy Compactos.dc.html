<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>body{margin:0;background:#E7DCC6}*{box-sizing:border-box}</style>
</helmet>
<div style="min-height:100vh;background:radial-gradient(ellipse 70% 30% at 50% 0%,#F1E8D6 0%,#E0D3BA 75%);padding:40px 48px 80px;font-family:'Geist',sans-serif;color:#1C2230;display:flex;flex-direction:column;gap:28px">
  <div style="display:flex;flex-direction:column;gap:6px"><span style="font:600 10px 'Geist Mono',monospace;letter-spacing:.16em;color:rgba(28,34,48,.55)">APP · HOY · AVISOS</span><span style="font:400 40px/1 'Instrument Serif',serif">Un aviso a la vista, el resto a un toque</span></div>
  <div style="display:grid;grid-template-columns:repeat(3,390px);gap:52px 44px;align-items:start;justify-content:start">
  <sc-for list="{{ boards }}" as="b" hint-placeholder-count="6">
    <div style="display:flex;flex-direction:column;gap:12px;width:390px">
      <span style="font:600 11px 'Geist Mono',monospace;letter-spacing:.08em;color:#6F4E37">{{ b.id }} · {{ b.cap }}</span>
      <div style="position:relative;width:375px;height:812px;flex:none;border-radius:48px;overflow:hidden;background:#F5EFE4;box-shadow:0 0 0 10px #1C2230,0 0 0 11px #3a3f4a,0 40px 100px -20px rgba(60,40,10,.45);display:flex;flex-direction:column">
        <span style="position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#0E1118;z-index:60"></span>
        <div style="flex:none;height:54px"></div>
        <div style="flex:none;height:52px;padding:0 18px 0 20px;display:flex;align-items:center;justify-content:space-between"><span style="font:400 26px/1 'Instrument Serif',serif;letter-spacing:.32em;color:#B58A2E">JUTRIP</span><span style="width:36px;height:36px;border-radius:50%;background:#1C2230;box-shadow:0 0 0 2px #FBF3E2,0 0 0 3.5px #B58A2E;display:flex;align-items:center;justify-content:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFDF8" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span></div>
        <div style="flex:1;min-height:0;padding:6px 16px 0;display:flex;flex-direction:column;gap:12px;position:relative">
          <div style="display:flex;flex-direction:column;gap:4px"><span style="font:600 10.5px 'Geist Mono',monospace;letter-spacing:.14em;color:#6F4E37">MIÉ 25 · ROMA ANTIGUA Y TRASTEVERE</span><span style="font:400 34px/1 'Instrument Serif',serif">Parada <em style="color:#8A6A2C">1 de 16</em></span></div>
          <div style="display:flex;gap:4px"><sc-for list="{{ dots }}" as="d" hint-placeholder-count="16"><span style="flex:1;height:4px;border-radius:2px;background:rgba(28,34,48,.16)"></span></sc-for></div>

          <sc-if value="{{ b.showCards }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex;flex-direction:column;gap:10px">
              <sc-for list="{{ b.cards }}" as="a" hint-placeholder-count="2">
                <div style="position:relative;display:flex;align-items:center;gap:12px;padding:12px 10px 12px 12px;border-radius:20px;background:{{ a.bg }};border:1.5px solid {{ a.bd }};box-shadow:0 10px 18px -14px rgba(90,50,30,.5)">
                  <span style="width:40px;height:40px;border-radius:13px;flex:none;background:{{ a.tile }};display:flex;align-items:center;justify-content:center"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{ a.ic }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ a.d }}"></path></svg></span>
                  <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="font:700 14px/1.2 'Geist';color:{{ a.tc }}">{{ a.t }}</span><span style="font:500 12.5px/1.3 'Geist';color:{{ a.sc }}">{{ a.s }}</span></span>
                  <span style="flex:none;height:36px;padding:0 13px;border-radius:12px;display:flex;align-items:center;font:700 12.5px 'Geist';white-space:nowrap;background:{{ a.bb }};color:{{ a.bf }};border:1px solid {{ a.bbd }}">{{ a.b }}</span>
                  <sc-if value="{{ a.badge }}" hint-placeholder-val="{{ false }}"><span onClick="{{ b.tog }}" style="cursor:pointer;position:absolute;right:-6px;top:-11px;min-width:40px;height:28px;padding:0 11px;border-radius:999px;background:#1C2230;color:#F3D88F;border:2px solid #F5EFE4;display:flex;align-items:center;justify-content:center;font:700 13.5px 'Geist';box-shadow:0 6px 12px -6px rgba(0,0,0,.5)">{{ a.badge }}</span></sc-if>
                </div>
              </sc-for>
            </div>
          </sc-if>

          <sc-if value="{{ b.showList }}" hint-placeholder-val="{{ false }}">
            <div style="border-radius:22px;background:#FFFDF8;border:1px solid rgba(28,34,48,.1);box-shadow:0 12px 22px -16px rgba(60,40,10,.5);overflow:hidden">
              <sc-for list="{{ b.rows }}" as="a" hint-placeholder-count="3">
                <div style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-top:{{ a.bt }};background:{{ a.rbg }}">
                  <span style="width:38px;height:38px;border-radius:12px;flex:none;background:{{ a.tile }};display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ a.ic }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{ a.d }}"></path></svg></span>
                  <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="font:700 13.5px/1.25 'Geist';color:#1C2230">{{ a.t }}</span><span style="font:500 12px/1.3 'Geist';color:rgba(28,34,48,.58)">{{ a.s }}</span></span>
                  <span style="flex:none;height:34px;padding:0 12px;border-radius:12px;display:flex;align-items:center;font:700 12px 'Geist';white-space:nowrap;background:{{ a.bb }};color:{{ a.bf }};border:1px solid {{ a.bbd }}">{{ a.b }}</span>
                </div>
              </sc-for>
              <div onClick="{{ b.tog }}" style="cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-top:1px solid rgba(28,34,48,.08);font:600 12.5px 'Geist';color:#6F4E37;background:#F7F1E4">Ocultar avisos<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6F4E37" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg></div>
            </div>
          </sc-if>

          <div style="flex:none;height:200px;border-radius:26px;position:relative;overflow:hidden;background:linear-gradient(170deg,#9DB4D8 0%,#C9A27A 50%,#5A3A2A 100%)"><span style="position:absolute;left:14px;top:14px;height:28px;padding:0 13px;border-radius:999px;background:rgba(28,34,48,.55);display:flex;align-items:center;font:600 10.5px 'Geist Mono',monospace;letter-spacing:.14em;color:#FFFDF8">PRIMERA PARADA</span><span style="position:absolute;left:16px;bottom:14px;font:400 36px/1 'Instrument Serif',serif;color:#FFFDF8">Coliseo</span></div>
        </div>
        <div style="position:absolute;left:0;right:0;bottom:0;height:96px;z-index:4;background:linear-gradient(180deg,rgba(245,239,228,0),#F5EFE4 55%)"></div>
        <div style="position:absolute;left:12px;right:12px;bottom:14px;z-index:5"><dc-import name="Piezas/Barra JUTRIP" tone="tinta" act="0" hint-size="100%,64px"></dc-import></div>
      </div>
      <span style="font:400 14px/1.45 'Geist';color:rgba(28,34,48,.72);max-width:375px;text-wrap:pretty">{{ b.note }}</span>
    </div>
  </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const CLK='M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',CLOUD='M7 18a4 4 0 0 1-.6-7.96A5.5 5.5 0 0 1 17 8.5a4.5 4.5 0 0 1 0 9.5zM8 21l1-2M12 21l1-2M16 21l1-2',PIN='M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10zM12 8.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z';
const RED=(t,s,b)=>({t,s,b,d:CLK,bg:'#FBEAE4',bd:'rgba(190,70,60,.5)',tile:'#C7352B',ic:'#fff',tc:'#7A1F16',sc:'rgba(90,30,20,.7)',bb:'#7A1F16',bf:'#FFF3EE',bbd:'#7A1F16',rbg:'#FBEAE4'});
const NEU=(t,s,b,d,tile,ic)=>({t,s,b,d,bg:'#FFFDF8',bd:'rgba(181,138,46,.5)',tile,ic,tc:'#1C2230',sc:'rgba(28,34,48,.58)',bb:'#FBF3E2',bf:'#4A3510',bbd:'rgba(181,138,46,.55)',rbg:'#FFFDF8'});
const R1=()=>RED('Tu entrada de las 9:15 corre peligro','Coliseo','Ver solución');
const S3=()=>NEU('Hoy ya no llegas a 3 sitios',"Museos Vaticanos, Castillo de Sant'Angelo y Panteón",'Ver',PIN,'#F3E3B2','#6E5018');
const RN=()=>NEU('Va a llover esta tarde','Tenemos un plan a cubierto','Ver plan',CLOUD,'#DDE6F2','#3E5A7A');
const LIST=()=>[R1(),S3(),RN()].map((x,i)=>({...x,bt:i?'1px solid rgba(28,34,48,.08)':'none'}));
class Component extends DCLogic {
  state={o1:false,o5:false};
  renderVals(){
    const s=this.state;
    const withBadge=(a,b)=>({...a,badge:b});
    const B=(o)=>({showCards:true,showList:false,tog:()=>{},...o});
    const boards=[
      B({id:'V1',cap:'Un aviso a la vista · toca el «+2»',showCards:!s.o1,showList:s.o1,cards:[withBadge(R1(),'+2')],rows:LIST(),tog:()=>this.setState(x=>({o1:!x.o1})),note:'Sale cuando hay una entrada con hora fija (Coliseo, Museos Vaticanos) en peligro. El Foro Romano tiene margen y no sale en rojo.'}),
      B({id:'V2',cap:'Desplegado · los tres, en una sola tarjeta',showCards:false,showList:true,rows:LIST(),note:'Al tocar «+2»: el rojo primero y después el resto, con «Ocultar avisos» abajo.'}),
      B({id:'V3',cap:'Solo un aviso',cards:[R1()],note:'Si no hay más avisos, no sale la insignia.'}),
      B({id:'V4',cap:'Varios del mismo tipo, juntos en una fila',cards:[S3(),RED('2 entradas corren peligro','Coliseo 9:15 · Museos Vaticanos 11:00','Ver solución')],note:'Si varios avisos son del mismo tipo, se juntan en una sola fila, sin «+x»: sitios que ya no llegan, o entradas en peligro (arriba y abajo, dos ejemplos).'}),
      B({id:'V5',cap:'Tipos distintos a la vez · toca el «+2»',showCards:!s.o5,showList:s.o5,cards:[withBadge(R1(),'+2')],rows:LIST(),tog:()=>this.setState(x=>({o5:!x.o5})),note:'Sale el más urgente. Desplegado, el orden es: rojo, sitios que ya no llegan y lluvia.'}),
      B({id:'V6',cap:'Cuando el rojo ya está resuelto',cards:[withBadge(S3(),'+1')],note:'Sube a la vista el siguiente aviso, y la insignia pasa de «+2» a «+1».'})
    ];
    return{dots:Array.from({length:16}),boards};
  }
}
</script>
</body>
</html>
