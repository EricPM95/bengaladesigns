<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>body{margin:0;background:#E7DCC6}*{box-sizing:border-box}</style>
</helmet>
<div style="min-height:100vh;background:radial-gradient(ellipse 70% 30% at 50% 0%,#F1E8D6 0%,#E0D3BA 75%);padding:40px 48px 80px;font-family:'Geist',sans-serif;color:#1C2230;display:flex;flex-direction:column;gap:28px">
  <div style="display:flex;flex-direction:column;gap:6px"><span style="font:600 10px 'Geist Mono',monospace;letter-spacing:.16em;color:rgba(28,34,48,.55)">APP · RESERVAS · LLEGADA Y VUELTA</span><span style="font:400 40px/1 'Instrument Serif',serif">El billete, con su tarjeta de embarque a mano</span></div>
  <div style="display:grid;grid-template-columns:repeat(3,390px);gap:52px 44px;align-items:start;justify-content:start">
  <sc-for list="{{ boards }}" as="b" hint-placeholder-count="3">
    <div style="display:flex;flex-direction:column;gap:12px;width:390px">
      <span style="font:600 11px 'Geist Mono',monospace;letter-spacing:.08em;color:#6F4E37">{{ b.id }} · {{ b.cap }}</span>
      <div style="position:relative;width:375px;height:900px;flex:none;border-radius:48px;overflow:hidden;background:#F8F1E2;box-shadow:0 0 0 10px #1C2230,0 0 0 11px #3a3f4a,0 40px 100px -20px rgba(60,40,10,.45)">
        <span style="position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#0E1118;z-index:60"></span>
        <div style="position:absolute;left:0;right:0;top:56px;height:56px;padding:0 18px 0 20px;display:flex;align-items:center;justify-content:space-between"><span style="font:400 26px/1 'Instrument Serif',serif;letter-spacing:.32em;color:#B58A2E">JUTRIP</span><span style="display:flex;align-items:center;gap:14px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2230" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 7l12-3v3M16 13h2"></path></svg><span style="position:relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2230" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M10 20a2 2 0 0 0 4 0"></path></svg><span style="position:absolute;right:-2px;top:-2px;width:8px;height:8px;border-radius:50%;background:oklch(0.55 0.17 5)"></span></span><span style="width:36px;height:36px;border-radius:50%;background:#1C2230;box-shadow:0 0 0 2px #FBF3E2,0 0 0 3.5px #B58A2E;display:flex;align-items:center;justify-content:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFDF8" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span></span></div>
        <div style="position:absolute;left:16px;top:120px;display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:50%;border:1.5px solid #B58A2E;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C2230" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span><span style="font:400 34px/1 'Instrument Serif',serif">Reservas</span></div>
        <div style="position:absolute;left:14px;right:14px;top:182px;border-radius:30px;background:#FFFDF8;border:1px solid rgba(28,34,48,.06);box-shadow:0 20px 34px -26px rgba(28,34,48,.5);padding:16px 12px 12px;display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;align-items:center;gap:12px;padding:0 4px"><span style="width:52px;height:52px;border-radius:16px;flex:none;background:{{ b.tile }};display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{ b.tileIc }}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"></path></svg></span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font:400 28px/1 'Instrument Serif',serif">Llegada y vuelta</span><span style="font:600 12.5px 'Geist Mono',monospace;color:{{ b.stc }}">{{ b.st }}</span></span><span style="width:40px;height:40px;border-radius:50%;background:#F3ECDD;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C2230" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg></span></div>
          <sc-for list="{{ b.tks }}" as="k" hint-placeholder-count="2">
            <div style="display:flex;flex-direction:column;gap:12px;padding:14px 14px 12px;border-radius:24px;background:#FBF3E2;border:1px solid rgba(181,138,46,.45)">
              <div style="display:flex;align-items:center;gap:8px"><span style="flex:none;height:30px;padding:0 11px;border-radius:999px;background:#1C2230;color:#F3D88F;display:flex;align-items:center;gap:6px;font:700 11.5px 'Geist Mono',monospace;letter-spacing:.1em"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"></path></svg>{{ k.lab }}</span><span style="flex:1;min-width:0;font:700 13.5px/1.2 'Geist'">{{ k.date }}</span>
                <sc-if value="{{ k.has }}" hint-placeholder-val="{{ true }}">
                  <span style="flex:none;width:34px;height:34px;border-radius:50%;background:#1C2230;border:1.5px solid #B58A2E;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F3D88F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"></path></svg></span>
                  <span style="position:relative;flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:{{ k.qbg }};border:1px solid {{ k.qbd }};box-shadow:{{ k.qsh }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ k.qfg }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1"></rect><path d="M14 14h3v3M20.5 14v.01M14 20.5h.01M17 20.5h3.5v-3.5"></path></svg><sc-if value="{{ k.plus }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;background:#1C2230;color:#fff;border:1.5px solid #FBF3E2;display:flex;align-items:center;justify-content:center"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span></sc-if></span>
                </sc-if>
                
              </div>
              <sc-if value="{{ k.has }}" hint-placeholder-val="{{ true }}">
                <div style="display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px"><span style="font:400 40px/1 'Instrument Serif',serif">{{ k.t1 }}</span><span style="display:flex;align-items:center;justify-content:center"><span style="flex:1;border-top:1.5px dashed rgba(181,138,46,.6)"></span><span style="width:34px;height:34px;border-radius:50%;border:1.5px solid #B58A2E;background:#FBF3E2;display:flex;align-items:center;justify-content:center;margin:0 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B58A2E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" transform="rotate(90 12 12)"></path></svg></span><span style="flex:1;border-top:1.5px dashed rgba(181,138,46,.6)"></span></span><span style="font:400 40px/1 'Instrument Serif',serif">{{ k.t2 }}</span></div>
                <span style="font:500 13.5px/1.3 'Geist';color:rgba(28,34,48,.62)">{{ k.route }}</span>
                <div style="border-top:1.5px dotted rgba(28,34,48,.22)"></div>
                <div style="display:flex;align-items:center;gap:10px"><span style="flex:1;height:46px;border-radius:15px;display:{{ k.ld }};align-items:center;justify-content:center;gap:9px;font:700 14px 'Geist';background:{{ k.lbg }};border:1px solid {{ k.lbd }};color:{{ k.lfg }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{ k.lic }}"></path></svg>{{ k.ltx }}</span><span style="flex:none;width:40px;height:40px;border-radius:50%;background:#F6DCDA;display:flex;align-items:center;justify-content:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#B02A3C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"></path></svg></span></div>
              </sc-if>
              <sc-if value="{{ k.miss }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:10px"><span style="flex:1;display:flex;align-items:center;gap:8px;font:italic 400 17px 'Instrument Serif',serif;color:#8E6820"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8E6820" stroke-width="2.4" stroke-linecap="round" style="flex:none"><path d="M12 5v14M5 12h14"></path></svg><span style="text-decoration:underline;text-underline-offset:3px">Falta añadir la vuelta</span></span></div></sc-if>
            </div>
          </sc-for>
          <sc-if value="{{ b.buscar }}" hint-placeholder-val="{{ false }}"><span style="height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:9px;font:700 14.5px 'Geist';background:linear-gradient(135deg,#F9EFCB,#EAD6A0 55%,#D8BD7C);color:#4A3510;border:1px solid rgba(181,138,46,.5)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A3510" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Buscar vuelos</span></sc-if>
          <div style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:#FBF3E2;border:1px solid rgba(181,138,46,.45)"><span style="width:38px;height:38px;border-radius:50%;background:#F3E3B2;color:#8A6A2C;display:flex;align-items:center;justify-content:center;font:700 17px 'Geist'">€</span><span style="flex:1;font:700 14.5px 'Geist'">{{ b.price }}</span><span style="width:34px;height:34px;border-radius:50%;background:#1C2230;border:1.5px solid #B58A2E;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F3D88F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"></path></svg></span></div>
        </div>
        <div style="position:absolute;left:0;right:0;bottom:0;height:96px;z-index:4;background:linear-gradient(180deg,rgba(248,241,226,0),#F8F1E2 55%)"></div>
        <div style="position:absolute;left:12px;right:12px;bottom:14px;z-index:5"><dc-import name="Piezas/Barra JUTRIP" tone="tinta" act="4" hint-size="100%,64px"></dc-import></div>
      </div>
      <span style="font:400 14px/1.45 'Geist';color:rgba(28,34,48,.72);max-width:375px;text-wrap:pretty">{{ b.note }}</span>
    </div>
  </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const SAV={qbg:'linear-gradient(135deg,#F9EFCB,#EAD6A0 55%,#D8BD7C)',qbd:'rgba(181,138,46,.7)',qsh:'0 6px 12px -8px rgba(110,80,24,.7),inset 0 1px 0 rgba(255,255,255,.75)',qfg:'#5A3E0C',plus:false,lbg:'#FFF8E4',lbd:'rgba(181,138,46,.7)',lfg:'#4A3510',lic:'M5 12.5l4.5 4.5L19 7.5',ltx:'',ld:'none'};
    const NO={qbg:'#ECEAE4',qbd:'rgba(28,34,48,.14)',qsh:'none',qfg:'rgba(28,34,48,.42)',plus:true,lbg:'#FFF8E4',lbd:'rgba(181,138,46,.7)',lfg:'#4A3510',lic:'M12 5v14M5 12h14',ltx:'Añade tu tarjeta de embarque',ld:'flex'};
    const ida=(s)=>({has:true,miss:false,lab:'IDA',date:'Lunes 23 noviembre',t1:'08:30',t2:'11:15',route:'Barcelona (El Prat) → Roma (Fiumicino)',...s});
    const vue=(s)=>({has:true,miss:false,lab:'VUELTA',date:'Lunes 30 noviembre',t1:'18:05',t2:'20:35',route:'Roma (Fiumicino) → Barcelona (El Prat)',...s});
    const falta={has:false,miss:true,lab:'VUELTA',date:'Lunes 30 noviembre'};
    const OK={tile:'#E1EDE1',tileIc:'#2F8A4E',st:'Listo',stc:'#2F8A4E'};
    const FA={tile:'#F1E6C8',tileIc:'#8A6A2C',st:'Falta la vuelta',stc:'oklch(0.55 0.17 5)'};
    return{boards:[
      {id:'B1',cap:'La ida puesta, la vuelta sin poner',...FA,buscar:true,price:'Precio · 50 €',tks:[ida(NO),falta],note:'La ida, sin tarjeta de embarque: el QR en gris con «+». La vuelta, sin QR: aún no hay vuelo guardado. Lleva [Buscar vuelos].'},
      {id:'B2',cap:'Ida con tarjeta guardada, vuelta sin tarjeta',...OK,buscar:false,price:'Precio total · 50 €',tks:[ida(SAV),vue(NO)],note:'El QR dorado abre la tarjeta en grande. La línea de abajo y el QR gris abren [Añadir tarjeta de embarque]. El resto del billete abre todos los datos.'},
      {id:'B3',cap:'Las dos con su tarjeta de embarque',...OK,buscar:false,price:'Precio total · 50 €',tks:[ida(SAV),vue(SAV)],note:'QR dorado y «✓ Tarjeta de embarque guardada»: los dos abren la tarjeta en grande.'}
    ]};
  }
}
</script>
</body>
</html>
