<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>body{margin:0;background:#E7DCC6}*{box-sizing:border-box}@keyframes clPulse{0%,100%{opacity:.75}50%{opacity:1}}</style>
</helmet>
<div style="min-height:100vh;background:#E7DCC6;padding:40px 48px 80px;font-family:'Geist',sans-serif;color:#1C2230;display:flex;flex-direction:column;gap:28px">
  <div style="display:flex;flex-direction:column;gap:6px"><span style="font:600 10px 'Geist Mono',monospace;letter-spacing:.16em;color:rgba(28,34,48,.55)">LOGROS · UNA COLECCIÓN</span><span style="font:400 40px/1 'Instrument Serif',serif">Los imprescindibles de Lanzarote, por dentro</span></div>
  <div style="display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start">
  <sc-for list="{{ boards }}" as="b" hint-placeholder-count="4">
    <div style="display:flex;flex-direction:column;gap:10px;width:390px">
      <span style="font:600 11px 'Geist Mono',monospace;letter-spacing:.12em;color:rgba(28,34,48,.7)">{{ b.id }} · {{ b.cap }}</span>
      <div style="position:relative;width:390px;height:844px;border-radius:40px;overflow:hidden;background:#F5EFE4;box-shadow:0 30px 60px -30px rgba(28,34,48,.5);display:flex;flex-direction:column">
        <div style="flex:none;height:56px"></div>
        <div style="flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:0 20px 40px;display:flex;flex-direction:column;gap:14px">
          <span style="flex:none;width:40px;height:40px;border-radius:50%;background:#EADFCB;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></span>
          <div style="flex:none;position:relative;align-self:center;width:{{ b.W }}px;height:{{ b.S }}px">
            <dc-import name="Piezas/Insignia Lanza Pro" col="1" set="{{ b.set }}" size="{{ b.S }}" hint-size="190px,190px"></dc-import>
            <sc-if value="{{ b.hl }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;filter:drop-shadow(0 0 10px #F3D59A) drop-shadow(0 0 4px #FFF1C8);animation:clPulse 1.6s ease-in-out infinite"><div style="position:absolute;inset:0;clip-path:{{ b.hlPoly }}"><dc-import name="Piezas/Insignia Lanza Pro" col="1" set="{{ b.hlSet }}" size="{{ b.S }}" hint-size="190px,190px"></dc-import></div></div></sc-if>
          </div>
          <div style="flex:none;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font:400 30px/1.05 'Instrument Serif',serif;text-align:center;text-wrap:balance">Los imprescindibles de Lanzarote</span><span style="display:flex;align-items:center;gap:8px;font:600 11px 'Geist Mono',monospace;letter-spacing:.14em;color:oklch(0.48 0.17 5)">{{ b.cnt }}<sc-if value="{{ b.done }}" hint-placeholder-val="{{ false }}"><span style="height:20px;padding:0 8px;border-radius:999px;background:#1C2230;color:#F3D59A;display:flex;align-items:center;font:600 9.5px 'Geist Mono',monospace;letter-spacing:.1em">COMPLETA</span></sc-if></span></div>
          <div style="flex:none;display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <sc-for list="{{ b.tiles }}" as="t" hint-placeholder-count="4">
              <div style="position:relative;display:flex;flex-direction:column;border-radius:22px;background:{{ t.bg }};border:{{ t.bd }};overflow:hidden;box-shadow:{{ t.sh }}">
                <div style="position:relative;height:104px;background:{{ t.ph }};{{ t.gray }}"></div>
                <span style="position:absolute;left:8px;top:8px;width:46px;height:46px;border-radius:50%;background:#FFFDF8;box-shadow:0 4px 10px -4px rgba(28,34,48,.5);overflow:hidden"><span style="position:absolute;left:{{ t.px }}px;top:{{ t.py }}px;width:150px;height:150px;clip-path:{{ t.poly }}"><dc-import name="Piezas/Insignia Lanza Pro" col="1" set="{{ t.one }}" size="150" hint-size="150px,150px"></dc-import></span></span>
                <sc-if value="{{ t.won }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:oklch(0.5 0.1 150);color:#fff;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
                <div style="padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1">
                  <span style="font:400 17px/1.1 'Instrument Serif',serif;color:{{ t.fg }};text-wrap:balance">{{ t.n }}</span>
                  <sc-if value="{{ t.date }}" hint-placeholder-val="{{ false }}"><span style="font:500 11.5px 'Geist Mono',monospace;color:rgba(28,34,48,.6)">{{ t.dt }}</span></sc-if>
                  <sc-if value="{{ t.day }}" hint-placeholder-val="{{ false }}"><span style="font:600 11px 'Geist Mono',monospace;color:oklch(0.48 0.17 5)">{{ t.dy }}</span><span style="align-self:flex-start;height:32px;padding:0 14px;border-radius:999px;background:#FFFDF8;border:1px solid rgba(28,34,48,.18);display:flex;align-items:center;font:600 12.5px 'Geist'">Cómo llegar</span></sc-if>
                  <sc-if value="{{ t.add }}" hint-placeholder-val="{{ false }}"><span style="align-self:flex-start;height:32px;padding:0 12px;border-radius:999px;background:#1C2230;color:#F3D59A;display:flex;align-items:center;font:600 12px 'Geist'">Añadir a mi viaje</span></sc-if>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </div>
  </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const SITES=[['Montañas del Fuego (Timanfaya)','linear-gradient(160deg,#E2896A,#6B2E1E)'],['Jameos del Agua','linear-gradient(160deg,#6FB6D8,#1F4E6E)'],['Cueva de los Verdes','linear-gradient(160deg,#C98A4E,#4E2C14)'],['Mirador del Río','linear-gradient(160deg,#8BB4D6,#3A5E86)'],['Fundación César Manrique','linear-gradient(160deg,#E8B796,#8E4A2C)'],['Charco de los Clicos','linear-gradient(160deg,#76C4A0,#1C5A44)'],['La Geria','linear-gradient(160deg,#B8A07A,#4A3A24)']];
const S=190,iw=230,ih=236,W=Math.round(iw*S/ih);
const poly=(j,s)=>{const w=Math.round(iw*s/ih),h=s,cx=114/iw*w,cy=118/ih*h,a0=-90,st=360/7;const pts=[[cx,cy]];for(let q=0;q<=8;q++){const t=(a0+j*st+st*q/8)*Math.PI/180;pts.push([cx+Math.cos(t)*400,cy+Math.sin(t)*400]);}return 'polygon('+pts.map(p=>p[0].toFixed(1)+'px '+p[1].toFixed(1)+'px').join(',')+')';};
const cen=(j)=>{const s=150,w=Math.round(iw*s/ih),h=s,cx=114/iw*w,cy=118/ih*h,t=(-90+(j+.5)*360/7)*Math.PI/180,r=s*.3;return[cx+Math.cos(t)*r,cy+Math.sin(t)*r];};
class Component extends DCLogic {
  renderVals(){
    const mk=(won,mode,extra={})=>{
      const order=[...SITES.keys()].sort((a,b)=>(won[b]?1:0)-(won[a]?1:0)||a-b);
      const tiles=order.map(j=>{const w=won[j],[c,d]=cen(j),x=extra.tap===j;
        const o={n:SITES[j][0],ph:SITES[j][1],won:!!w,gray:w?'':'filter:grayscale(1);opacity:.55',bg:w?'#FFFDF8':'#EFE7D8',bd:x?'2px solid #C99A4C':'1px solid rgba(28,34,48,'+(w?.08:.1)+')',sh:x?'0 10px 22px -12px rgba(150,105,30,.7)':w?'0 8px 20px -16px rgba(28,34,48,.35)':'none',fg:w?'#1C2230':'rgba(28,34,48,.55)',px:(23-c).toFixed(1),py:(23-d).toFixed(1),poly:poly(j,150),one:w?String(j):'',date:!!w,dt:w||'',day:false,add:false,dy:''};
        if(!w&&mode==='durante'){const r=(extra.route||{})[j];if(r){o.day=true;o.dy=r;}else o.add=true;}
        return o;});
      const set=Object.keys(won).filter(k=>won[k]).join(',');
      const n=Object.keys(won).filter(k=>won[k]).length;
      return{S,W,set,tiles,cnt:n+' DE 7',done:n===7,hl:extra.tap!=null,hlPoly:extra.tap!=null?poly(extra.tap,S):'',hlSet:extra.tap!=null?String(extra.tap):''};
    };
    const w3={1:'9 nov',2:'9 nov',3:'10 nov'};
    const all={0:'9 nov',1:'9 nov',2:'9 nov',3:'10 nov',4:'10 nov',5:'11 nov',6:'12 nov'};
    return{boards:[
      {id:'C1',cap:'3 de 7 · viaje terminado',...mk(w3,'fin')},
      {id:'C2',cap:'Durante el viaje · un sitio de hoy y otro fuera de ruta',...mk(w3,'durante',{route:{0:'Día 3 · Hoy',5:'Día 4 · jue 12'}})},
      {id:'C3',cap:'Una tarjeta tocada: su trozo se ilumina',...mk(w3,'fin',{tap:2})},
      {id:'C4',cap:'Completa · 7 de 7',...mk(all,'fin')}
    ]};
  }
}
</script>
</body>
</html>
