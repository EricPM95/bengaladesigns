<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>body{margin:0;background:#E7DCC6}*{box-sizing:border-box}@keyframes eoSpin{to{transform:rotate(360deg)}}@keyframes eoPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}@keyframes eoTw{0%,100%{opacity:.2}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
</helmet>
<div style="min-height:100vh;background:radial-gradient(ellipse 70% 30% at 50% 0%,#F1E8D6 0%,#E0D3BA 75%);padding:40px 48px 80px;font-family:'Geist',sans-serif;color:#1C2230;display:flex;flex-direction:column;gap:28px">
  <div style="display:flex;flex-direction:column;gap:6px"><span style="font:600 10px 'Geist Mono',monospace;letter-spacing:.16em;color:rgba(28,34,48,.55)">APP · HOY · EMBLEMA OCULTO</span><span style="font:400 40px/1 'Instrument Serif',serif">Aquí se esconde algo</span></div>
  <div style="display:flex;flex-wrap:wrap;gap:44px;align-items:flex-start">
  <sc-for list="{{ boards }}" as="b" hint-placeholder-count="2">
    <div style="display:flex;flex-direction:column;gap:12px;width:390px">
      <span style="font:600 11px 'Geist Mono',monospace;letter-spacing:.08em;color:#6F4E37">{{ b.id }} · {{ b.cap }}</span>
      <div style="position:relative;width:375px;height:812px;flex:none;border-radius:48px;overflow:hidden;background:#F5EFE4;box-shadow:0 0 0 10px #1C2230,0 0 0 11px #3a3f4a,0 40px 100px -20px rgba(60,40,10,.45)">
        <span style="position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#0E1118;z-index:60"></span>
        <div style="position:absolute;left:16px;right:16px;top:70px;height:230px;border-radius:26px;background:linear-gradient(170deg,#C9B88A,#7A6A3A 55%,#3E3A2A)"></div>
        <div style="position:absolute;left:16px;right:16px;top:318px;height:120px;border-radius:22px;background:#FFFDF8"></div>
        <div style="position:absolute;inset:0;background:rgba(14,12,22,.55);z-index:20"></div>
        <div style="position:absolute;left:0;right:0;bottom:0;z-index:30;border-radius:34px 34px 0 0;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,#2E2A5A 0%,#1E2040 45%,#14162C 100%);padding:10px 20px 30px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 -24px 50px rgba(0,0,0,.4)">
          <span style="position:absolute;left:50%;top:70px;margin-left:-190px;width:380px;height:380px;opacity:.5;animation:eoSpin 70s linear infinite;background:repeating-conic-gradient(from 0deg,rgba(243,216,143,.38) 0 4deg,transparent 4deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 8%,transparent 62%);mask-image:radial-gradient(circle,#000 8%,transparent 62%)"></span>
          <sc-for list="{{ stars }}" as="s" hint-placeholder-count="12"><span style="position:absolute;left:{{ s.x }}px;top:{{ s.y }}px;width:{{ s.r }}px;height:{{ s.r }}px;border-radius:50%;background:#F3D88F;animation:eoTw {{ s.d }}s ease-in-out {{ s.b }}s infinite"></span></sc-for>
          <span style="position:relative;align-self:center;width:44px;height:4px;border-radius:2px;background:rgba(255,255,255,.28)"></span>
          <span style="position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
          <div style="position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center;margin-top:4px"><span style="position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(243,216,143,.4),rgba(243,216,143,0) 66%);animation:eoPulse 3s ease-in-out infinite"></span>
            <svg width="132" height="132" viewBox="0 0 132 132" fill="none" style="position:relative"><defs><linearGradient id="eoG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1B8"></stop><stop offset=".45" stop-color="#E0B14A"></stop><stop offset="1" stop-color="#A8721C"></stop></linearGradient><linearGradient id="eoD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2D58"></stop><stop offset="1" stop-color="#14162C"></stop></linearGradient></defs>
              <path d="M66 6l56 60-56 60L10 66z" fill="url(#eoD)" stroke="url(#eoG)" stroke-width="4" stroke-linejoin="round"></path>
              <path d="M66 18l44 48-44 48L22 66z" stroke="#F3D88F" stroke-opacity=".4" stroke-width="1.2" stroke-linejoin="round"></path>
              <text x="66" y="84" text-anchor="middle" font-family="Instrument Serif" font-size="58" fill="url(#eoG)">?</text></svg></div>
          <span style="position:relative;font:600 11px 'Geist Mono',monospace;letter-spacing:.2em;color:#F3D88F">EMBLEMA OCULTO</span>
          <span style="position:relative;font:400 31px/1.08 'Instrument Serif',serif;color:#FFFDF8;text-align:center;text-wrap:balance;margin-top:-6px">¡Aquí se esconde un Emblema Oculto!</span>
          <span style="position:relative;font:400 14.5px/1.45 'Geist';color:rgba(255,253,248,.75);text-align:center;text-wrap:balance">Haz una foto en {{ b.place }} y descúbrelo.</span>
          <span style="position:relative;align-self:stretch;height:56px;border-radius:18px;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:10px;font:700 16px 'Geist';background:linear-gradient(135deg,#F9EFCB,#EAD6A0 50%,#D8BD7C);color:#3E2A0C;border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 12px 22px -12px rgba(243,216,143,.6)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3E2A0C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 11a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"></path></svg>Hacer la foto</span>
          <span style="position:relative;align-self:stretch;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:9px;font:700 14.5px 'Geist';background:rgba(255,255,255,.08);border:1px solid rgba(243,216,143,.55);color:#F3D88F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M4 17l5-4.5 3.5 3 3-2.5 4.5 4"></path></svg>Elegir de la galería</span>
          <span style="position:relative;font:500 13px 'Geist';color:rgba(255,253,248,.6)">¿No estás aquí? <span style="color:#F3D88F;text-decoration:underline">Desmarcar visto</span></span>
        </div>
      </div>
      <span style="font:400 14px/1.45 'Geist';color:rgba(28,34,48,.72);max-width:375px;text-wrap:pretty">{{ b.note }}</span>
    </div>
  </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const stars=Array.from({length:16},(_,i)=>({x:20+((i*83)%335),y:30+((i*47)%170),r:(i%3?2:3),d:(2+(i%5)*.6).toFixed(1),b:(i*.31).toFixed(2)}));
    return{stars,boards:[
      {id:'E1',cap:'La hoja del Emblema Oculto',place:'el Foro Romano y Palatino',note:'Rayos de luz que giran muy despacio, el emblema todavía tapado con su «?» y estrellitas que titilan. [Hacer la foto] en dorado, la galería con borde y «Desmarcar visto» discreto.'},
      {id:'E2',cap:'En otro sitio',place:'la Basílica de San Pedro',note:'Igual: solo cambia el nombre del sitio. Mientras esta hoja está abierta no sale el aviso «Parada saltada», para que no tape los botones.'}
    ]};
  }
}
</script>
</body>
</html>
