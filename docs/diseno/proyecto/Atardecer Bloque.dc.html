<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>body{margin:0;background:#E7DCC6}*{box-sizing:border-box}</style>
</helmet>
<div style="min-height:100vh;background:radial-gradient(ellipse 70% 30% at 50% 0%,#F1E8D6 0%,#E0D3BA 75%);padding:40px 48px 80px;font-family:'Geist',sans-serif;color:#1C2230;display:flex;flex-direction:column;gap:28px">
  <div style="display:flex;flex-direction:column;gap:6px"><span style="font:600 10px 'Geist Mono',monospace;letter-spacing:.16em;color:rgba(28,34,48,.55)">APP · HOY · EL ATARDECER</span><span style="font:400 40px/1 'Instrument Serif',serif">Primero el texto, luego el botón</span></div>
  <div style="display:flex;flex-wrap:wrap;gap:44px;align-items:flex-start">
  <sc-for list="{{ boards }}" as="b" hint-placeholder-count="2">
    <div style="display:flex;flex-direction:column;gap:12px;width:390px">
      <span style="font:600 11px 'Geist Mono',monospace;letter-spacing:.08em;color:#6F4E37">{{ b.id }} · {{ b.cap }}</span>
      <div style="position:relative;width:375px;height:812px;flex:none;border-radius:48px;overflow:hidden;background:#F5EFE4;box-shadow:0 0 0 10px #1C2230,0 0 0 11px #3a3f4a,0 40px 100px -20px rgba(60,40,10,.45);display:flex;flex-direction:column">
        <span style="position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#0E1118;z-index:60"></span>
        <div style="flex:none;height:56px"></div>
        <div style="flex:none;height:56px;padding:0 18px 0 20px;display:flex;align-items:center;justify-content:space-between"><span style="font:400 26px/1 'Instrument Serif',serif;letter-spacing:.32em;color:#B58A2E">JUTRIP</span><span style="width:36px;height:36px;border-radius:50%;background:#1C2230;box-shadow:0 0 0 2px #FBF3E2,0 0 0 3.5px #B58A2E;display:flex;align-items:center;justify-content:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFDF8" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span></div>
        <div style="flex:1;min-height:0;padding:14px 16px 0;display:flex;flex-direction:column;gap:14px;overflow:hidden">
          <div style="flex:none;position:relative;overflow:hidden;border-radius:26px;padding:18px 18px 16px;background:linear-gradient(160deg,#FBD59A 0%,#EC9468 48%,#8A4A82 100%);color:#fff;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 30px -20px rgba(122,62,120,.8)">
            <span style="position:absolute;right:-30px;top:-34px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,244,214,.55),rgba(255,244,214,0) 68%)"></span>
            <span style="position:relative;display:flex;align-items:center;gap:8px;font:600 10px 'Geist Mono',monospace;letter-spacing:.16em;opacity:.95"><span style="width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.24);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 18a5 5 0 0 0-10 0M12 9V4M4.2 11.2l1.4 1.4M19.8 11.2l-1.4 1.4M2 18h20M7 22h10M9 6l3-3 3 3"></path></svg></span>ATARDECER · 18:26</span>
            <span style="position:relative;font:400 27px/1.12 'Instrument Serif',serif;text-wrap:balance">{{ b.title }}</span>
            <sc-if value="{{ b.text }}" hint-placeholder-val="{{ true }}"><span style="position:relative;font:500 14px/1.45 'Geist';opacity:.95">{{ b.text }}</span></sc-if>
            <sc-if value="{{ b.btn }}" hint-placeholder-val="{{ true }}"><span style="position:relative;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:9px;font:700 15px 'Geist';background:linear-gradient(135deg,#FFF6DC,#F1DC9C 55%,#D9B65E);color:#3E2A0C;border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 10px 16px -10px rgba(60,30,60,.7)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3E2A0C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"></path></svg>{{ b.btn }}</span></sc-if>
          </div>
          <div style="flex:none;position:relative;height:210px;border-radius:26px;overflow:hidden;background:linear-gradient(170deg,#9DB4D8,#C9A27A 55%,#5A3A2A)"><span style="position:absolute;left:18px;top:14px;height:30px;padding:0 12px;border-radius:999px;background:rgba(28,34,48,.55);color:#fff;display:flex;align-items:center;font:600 10.5px 'Geist Mono',monospace;letter-spacing:.14em">PRIMERA PARADA</span><span style="position:absolute;left:18px;bottom:14px;font:400 34px/1 'Instrument Serif',serif;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4)">Plaza de San Pedro</span></div>
        </div>
        <div style="position:absolute;left:0;right:0;bottom:0;height:96px;z-index:4;background:linear-gradient(180deg,rgba(245,239,228,0),#F5EFE4 55%)"></div>
        <div style="position:absolute;left:12px;right:12px;bottom:14px;z-index:5"><dc-import name="Piezas/Barra JUTRIP" tone="tinta" act="0" hint-size="100%,64px"></dc-import></div>
      </div>
      <span style="font:400 14px/1.45 'Geist';color:rgba(28,34,48,.72);max-width:375px;text-wrap:pretty">{{ b.note }}</span>
    </div>
  </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){return{boards:[
    {id:'S1',cap:'Con parada de atardecer',btn:'Ir al Castillo de Sant\'Angelo',title:'Hoy ves el atardecer en el Castillo de Sant\'Angelo',text:'Llega un cuarto de hora antes, que es cuando más bonito está.',note:'La hora va solo arriba. El texto va primero y el botón ocupa todo el ancho debajo, en champán claro.'},
    {id:'S2',cap:'Sin parada de atardecer',btn:'Ir a la Terraza del Pincio',title:'Hoy el sol se pone a las 18:26',text:'Desde el Pincio, a 10 minutos andando, se ve precioso.',note:'La misma tarjeta para cuando no hay parada de atardecer en la ruta.'},
    {id:'S3',cap:'Sin ningún sitio de atardecer cerca',btn:'',title:'Hoy el sol se pone a las 18:26',text:'',note:'Solo la hora: sin texto debajo y sin botón.'}
  ]};}
}
</script>
</body>
</html>
