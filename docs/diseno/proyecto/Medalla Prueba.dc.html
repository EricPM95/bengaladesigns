<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F1E8D6;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}</style>
</helmet>
<div style="min-height:100vh;background:radial-gradient(ellipse 70% 60% at 50% 10%,#F6EEDD 0%,#E4D8BF 80%);font-family:'Geist',system-ui,sans-serif;color:#1C2230;padding:44px 48px 80px;display:flex;flex-direction:column;gap:40px">
  <div style="display:flex;flex-direction:column;gap:8px;max-width:720px"><span style="font:600 10px 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(28,34,48,.55)">Logros de viajero · prueba de estilo premium</span><span style="font:400 46px/1 'Instrument Serif',serif">Destinos</span></div>
  <section style="display:flex;flex-direction:column;gap:14px">
    <span style="font:400 26px/1 'Instrument Serif',serif">Países · los 9 escalones</span>
    <div style="display:flex;flex-wrap:wrap;gap:26px 18px">
      <sc-for list="{{ paises }}" as="m" hint-placeholder-count="9"><div style="width:150px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center"><dc-import name="Piezas/Medalla Destino" stage="{{ m.s }}" icon="globo" size="150" hint-size="150px,150px"></dc-import><span style="font:500 11px 'Geist Mono',monospace;color:rgba(28,34,48,.55)">{{ m.k }}</span><span style="font:500 12px 'Geist'">{{ m.n }}</span></div></sc-for>
    </div>
  </section>
  <section style="display:flex;flex-direction:column;gap:14px">
    <span style="font:400 26px/1 'Instrument Serif',serif">Destinos · los 8 escalones</span>
    <span style="font:400 13px/1.5 'Geist';color:rgba(28,34,48,.62);max-width:640px">Cada escalón es un color entero: bronce, plata, oro, azul noche, verde esmeralda, rosa y morado, rojo pasión y diamante.</span>
    <div style="display:flex;flex-wrap:wrap;gap:26px 18px">
      <sc-for list="{{ nine }}" as="m" hint-placeholder-count="9"><div style="width:150px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center"><dc-import name="Piezas/Medalla Destino" stage="{{ m.s }}" size="150" hint-size="150px,150px"></dc-import><span style="font:500 11px 'Geist Mono',monospace;color:rgba(28,34,48,.55)">{{ m.s }}</span><span style="font:500 12px 'Geist'">{{ m.n }}</span></div></sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){return{six:[[1,'1','Primera parada'],[2,'3','Ciudad tras ciudad'],[3,'5','Mapa en marcha'],[4,'10','Diez ciudades, diez historias'],[5,'15','Brújula incansable'],[6,'20','Sin fronteras']].map(([s,k,n])=>({s,k:k+(k==='1'?' destino':' destinos'),n})),
    paises:['Primer sello','Trotamundos','Alma viajera','Pasaporte en marcha','Ciudadano del mundo','Horizonte sin fin','Veinte banderas','Medio mundo en la maleta','El mundo es tu casa'].map((n,i)=>({s:i+1,k:['1','3','5','8','10','15','20','25','30'][i]+' países',n})),
    nine:[['1 destino','Primera parada'],['3','Ciudad tras ciudad'],['5','Mapa en marcha'],['10','Diez ciudades, diez historias'],['15','Brújula incansable'],['20','Sin fronteras'],['25','Pasión por el mundo'],['30','Alma de explorador']].map(([k,n],i)=>({s:i+1,n:(i?k+' destinos · ':k+' · ')+n}))};}
}
</script>
</body>
</html>
