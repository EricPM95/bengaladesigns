<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>body{margin:0;background:#E7DCC6;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}button{font-family:inherit}@keyframes pzUp{from{transform:translateY(100%)}to{transform:none}}@keyframes pzSpot{0%,100%{opacity:.7}50%{opacity:1}}</style>
</helmet>
<div style="min-height:100vh;background:radial-gradient(ellipse 70% 30% at 50% 0%,#F1E8D6 0%,#E0D3BA 75%);padding:40px 48px 80px;font-family:'Geist',sans-serif;color:#1C2230;display:flex;flex-wrap:wrap;gap:44px;align-items:flex-start">
<sc-for list="{{ boards }}" as="b" hint-placeholder-count="3">
 <div style="display:flex;flex-direction:column;gap:12px;width:390px">
  <span style="font:600 11px 'Geist Mono',monospace;letter-spacing:.08em;color:#6E5018">{{ b.cap }}</span>
  <div data-screen-label="{{ b.cap }}" style="position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:#F5EFE4;box-shadow:0 0 0 9px #14161C,0 30px 70px -20px rgba(60,40,10,.45);display:flex;flex-direction:column">
   <div style="height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font:600 15px 'Geist'"><span>9:41</span><span style="width:24px;height:12px;border:1px solid currentColor;opacity:.6;border-radius:4px;padding:1.5px;display:flex"><span style="flex:1;background:currentColor;border-radius:2px"></span></span></div>
   <div style="flex:none;display:flex;justify-content:flex-end;gap:10px;padding:0 16px 8px">
    <span style="width:44px;height:44px;border-radius:50%;background:#FFFDF8;border:1px solid rgba(28,34,48,.1);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"></path></svg></span>
    <span style="width:44px;height:44px;border-radius:50%;background:rgba(28,34,48,.07);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
   </div>
   <main style="flex:1;min-height:0;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:14px">

    <div style="flex:none;border-radius:30px;background:#FFFDF8;border:1px solid rgba(28,34,48,.06);box-shadow:0 16px 30px -22px rgba(28,34,48,.5);padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px">
     <div style="display:flex;align-items:center;gap:14px">
      <span style="position:relative;width:118px;height:118px;flex:none;display:flex;flex-direction:column;align-items:center">
       <span style="position:absolute;left:25.5%;top:25.5%;width:49%;height:49%;border-radius:50%;background:linear-gradient(150deg,#C9B8A2,#6E5A48);color:#FFFDF8;display:flex;align-items:center;justify-content:center;font:400 30px/1 'Instrument Serif',serif">A</span>
       <span style="position:absolute;inset:0;background-image:{{ b.frameUrl }};background-size:contain;background-repeat:no-repeat"></span>
      </span>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px">
       <span style="font:400 36px/1 'Instrument Serif',serif">Hola, <em>Alice</em></span>
       <span style="font:600 13px 'Geist';color:rgba(28,34,48,.6)">{{ b.lvl }}</span>
       <sc-if value="{{ b.hasTitle }}" hint-placeholder-val="{{ true }}">
        <span style="align-self:flex-start;margin-top:3px;height:26px;padding:0 11px 0 5px;border-radius:999px;background:rgba(201,154,68,.16);color:#6F4E37;display:flex;align-items:center;gap:6px;font:italic 400 15px/1 'Instrument Serif',serif"><span style="width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F8E3A0,#B8862E);box-shadow:inset 0 0 0 1px rgba(111,78,55,.4)"></span>Primera parada</span>
       </sc-if>
      </span>
     </div>
     <div style="display:flex;flex-direction:column;gap:7px">
      <span style="display:block;height:9px;border-radius:5px;background:rgba(28,34,48,.1);overflow:hidden"><span style="display:block;height:100%;width:{{ b.pct }};border-radius:5px;background:linear-gradient(90deg,#C99A44,#F3D88F)"></span></span>
      <span style="display:flex;justify-content:space-between;gap:8px;white-space:nowrap;font:500 12px 'Geist';color:rgba(28,34,48,.65)"><span>{{ b.exp }}</span><span style="color:#6F4E37;font-weight:600">{{ b.left }}</span></span>
     </div>
    </div>

    <div style="flex:none;display:flex;flex-direction:column;gap:10px">
     <div style="flex:none;display:flex;align-items:center;gap:10px"><span style="font:400 30px/1 'Instrument Serif',serif;white-space:nowrap">Mis viajes</span>
      <span aria-label="Editar" style="width:34px;height:34px;border-radius:50%;background:#FFFDF8;border:1px solid rgba(28,34,48,.12);display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.500 4.500a2.100 2.100 0 0 1 3 3L8 19zM14.500 6.500l3 3"></path></svg></span>
      <span style="margin-left:auto;display:flex;align-items:center;gap:2px;white-space:nowrap;font:600 13px 'Geist';color:#6F4E37">{{ b.all }}<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></span></div>
     <div style="flex:none;margin:0 -16px;padding:0 16px;display:flex;gap:12px;overflow:hidden">
      <sc-for list="{{ b.trips }}" as="t" hint-placeholder-count="2">
       <div style="flex:none;width:300px;border-radius:24px;overflow:hidden;background:#FFFDF8;box-shadow:0 12px 26px -20px rgba(28,34,48,.5)">
        <div style="position:relative;height:150px;background:{{ t.ph }};color:#FFFDF8"><span style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,20,.05) 30%,rgba(10,12,20,.72))"></span>
         <span style="position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,253,248,.9);color:#1C2230;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.800-2.500h6.400L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zM12 17a3.500 3.500 0 1 0 0-7 3.500 3.500 0 0 0 0 7z"></path></svg></span>
         <span style="position:absolute;left:16px;bottom:12px;display:flex;flex-direction:column;gap:3px"><span style="font:400 36px/1 'Instrument Serif',serif">{{ t.n }}</span><span style="font:500 11.5px 'Geist Mono',monospace;color:rgba(255,253,248,.88)">{{ t.d }}</span></span></div>
        <div style="display:flex;align-items:center;gap:8px;padding:11px 12px 11px 16px;font:500 12.5px 'Geist';color:rgba(28,34,48,.6)"><span>{{ t.a }}</span><span style="width:3px;height:3px;border-radius:50%;background:rgba(28,34,48,.3)"></span><span>{{ t.b }}</span><span style="margin-left:auto;width:30px;height:30px;border-radius:50%;background:rgba(28,34,48,.06);color:#1C2230;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></span></div>
       </div>
      </sc-for>
     </div>
    </div>

    <div style="flex:none;position:relative;height:196px;border-radius:26px;overflow:hidden;background:radial-gradient(circle at 50% 0%,#1E2648 0%,#0B0E1C 70%);color:#FFFDF8;padding:14px 18px;display:flex;flex-direction:column">
     <span style="display:flex;align-items:center;justify-content:space-between"><span style="font:400 26px/1 'Instrument Serif',serif">Mi vitrina</span><span style="height:30px;padding:0 8px 0 12px;border-radius:999px;border:1px solid rgba(243,213,154,.45);background:rgba(243,213,154,.12);color:#F3D59A;display:flex;align-items:center;gap:4px;font:600 12px 'Geist'">{{ b.logros }}<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></span></span>
     <div style="position:relative;flex:1;display:grid;grid-template-columns:repeat(3,1fr);align-items:end;padding:0 4px 12px">
      <sc-for list="{{ b.slots }}" as="it" hint-placeholder-count="3">
       <div style="position:relative;display:flex;flex-direction:column;align-items:center">
        <span style="position:absolute;left:50%;top:-22px;width:96px;height:130px;margin-left:-48px;background:radial-gradient(ellipse 50% 90% at 50% 0%,rgba(255,226,170,.34),transparent 72%);clip-path:polygon(36% 0,64% 0,100% 100%,0 100%);animation:pzSpot 5s {{ it.d }} ease-in-out infinite"></span>
        <span style="position:relative;height:92px;display:flex;align-items:flex-end;justify-content:center">
         <sc-if value="{{ it.isS }}" hint-placeholder-val="{{ false }}"><dc-import name="Piezas/Sello Logro" grade="oro" icon="coliseo" size="74" label="ROMA" hint-size="74px,74px"></dc-import></sc-if>
         <sc-if value="{{ it.isE }}" hint-placeholder-val="{{ false }}"><dc-import name="Piezas/Emblema Oro" won="{{ true }}" size="68" interactive="{{ false }}" flippable="{{ false }}" hint-size="68px,85px"></dc-import></sc-if>
         <sc-if value="{{ it.isL }}" hint-placeholder-val="{{ false }}"><dc-import name="Piezas/Logro Viajero" tier="4" grow="4" hue="40" size="76" num="10" icon="{{ globo }}" delay="0" hint-size="76px,76px"></dc-import></sc-if>
         <sc-if value="{{ it.isP }}" hint-placeholder-val="{{ false }}"><span style="width:38px;height:38px;margin-bottom:22px;border-radius:50%;background:radial-gradient(circle at 35% 25%,rgba(255,253,248,.2),rgba(255,253,248,.06));border:1px solid rgba(243,213,154,.55);color:#F3D59A;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,253,248,.25)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span></sc-if>
         <sc-if value="{{ it.isG }}" hint-placeholder-val="{{ false }}"><span style="width:58px;height:58px;margin-bottom:10px;border-radius:50%;border:1.5px dashed rgba(243,213,154,.4)"></span></sc-if>
        </span>
        <span style="margin-top:3px;width:58px;height:8px;border-radius:50%;background:rgba(0,0,0,.5)"></span>
       </div>
      </sc-for>
      <span style="position:absolute;left:0;right:0;bottom:6px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(220,230,255,.55),transparent)"></span>
     </div>
    </div>
   </main>

   <sc-if value="{{ b.sheet }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:40;background:rgba(28,34,48,.45)"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;z-index:41;border-radius:28px 28px 0 0;background:#FFFDF8;padding:12px 18px 34px;display:flex;flex-direction:column;gap:10px;animation:pzUp .45s cubic-bezier(.2,.8,.2,1) both">
     <span style="align-self:center;width:42px;height:4px;border-radius:4px;background:rgba(28,34,48,.18)"></span>
     <span style="margin-top:6px;font:400 28px/1 'Instrument Serif',serif">Elige tu título</span>
     <sc-for list="{{ titles }}" as="x" hint-placeholder-count="4">
      <div style="min-height:58px;display:flex;align-items:center;gap:12px;padding:6px 14px 6px 10px;border-radius:16px;background:{{ x.bg }};border:1.5px solid {{ x.bd }}">
       <span style="width:36px;height:36px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F8E3A0,#B8862E)"></span>
       <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font:600 14px 'Geist'">{{ x.n }}</span><span style="font:400 11.5px 'Geist';color:rgba(28,34,48,.58)">{{ x.g }}</span></span>
       <span style="width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid {{ x.rb }};display:flex;align-items:center;justify-content:center"><span style="width:10px;height:10px;border-radius:50%;background:{{ x.dot }}"></span></span>
      </div>
     </sc-for>
    </div>
   </sc-if>
  </div>
 </div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const trip=(n,d,ph,a,b)=>({n,d,ph,a,b});
    const T1=[trip('Lanzarote','9 – 13 nov 2026','linear-gradient(160deg,#6B5A4A,#2C2A28 70%)','11 paradas','5 fotos'),trip('Lanzarote','8 – 13 nov 2026','linear-gradient(160deg,#8FA4C4,#3E4E6E 70%)','16 paradas','1 foto')];
    const S3=[{isS:true,d:'0s'},{isP:true,d:'1.2s'},{isL:true,d:'2.4s'}];
    const S1=[{isG:true,d:'0s'},{isP:true,d:'1.2s'},{isG:true,d:'2.4s'}];
    const mk=(cap,o)=>({cap,frameUrl:'url(assets/marco-nivel2.png)',lvl:'Nivel 2 · Soñador',hasTitle:true,pct:'32%',exp:'285 / 900',left:'Te faltan 615 EXP para el nivel 3',all:'Ver todos (3)',trips:T1,logros:'12 logros',slots:S3,sheet:false,...o});
    const TI=[['Primera parada','El mundo · tu primer destino',1],['Ciudad tras ciudad','El mundo · 3 destinos',0],['El primer viaje','El tiempo · tu primer viaje',0]];
    return{globo:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z',
      titles:TI.map(([n,g,on])=>({n,g,bg:on?'rgba(201,154,68,.14)':'#FFFFFF',bd:on?'#C99A44':'rgba(28,34,48,.08)',rb:on?'#B8862E':'rgba(28,34,48,.25)',dot:on?'#B8862E':'transparent'})),
      boards:[mk('01 · El Perfil, entero'),mk('02 · Al tocar el título',{sheet:true}),
        mk('03 · Nivel 1, sin título',{frameUrl:'url(assets/marco-nivel1.png)',lvl:'Nivel 1 · Soñador',hasTitle:false,pct:'20%',exp:'40 / 200',left:'Te faltan 160 EXP para el nivel 2',all:'Ver todos (1)',trips:[T1[0]],logros:'0 logros',slots:S1})]};
  }
}
</script>
</body>
</html>
