<title>Fotos de Roma</title>

<style>
:root{--bg:#F5EFE4;--card:#FFFDF8;--ink:#1C2230;--soft:rgba(28,34,48,.6)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Geist,system-ui,sans-serif}
header{padding:28px 20px 8px;max-width:1280px;margin:0 auto}
h1{font:400 40px/1 'Instrument Serif',serif;margin:0}
header p{color:var(--soft);font-size:14px;margin:8px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:16px 20px 40px;max-width:1280px;margin:0 auto}
.card{margin:0;background:var(--card);border:1px solid rgba(28,34,48,.08);border-radius:16px;overflow:hidden;box-shadow:0 10px 24px -18px rgba(28,34,48,.35)}
.ph{position:relative;aspect-ratio:4/3;background:#E9E2D2}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.none{display:flex;height:100%;align-items:center;justify-content:center;text-align:center;padding:16px;color:#B42318;font-size:13px;font-weight:600}
.num{position:absolute;top:8px;left:8px;min-width:26px;height:26px;border-radius:13px;padding:0 7px;background:#1C2230;color:#F3EEE4;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
figcaption{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
figcaption b{font:400 19px/1.1 'Instrument Serif',serif;font-weight:400}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--soft)}
.src{font-weight:600}
</style></head><body>
