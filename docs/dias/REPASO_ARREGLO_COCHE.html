<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repaso del arreglo del coche · Ruta</title>
<style>
:root{--bg:#FBF6EC;--tx:#1C2230;--oro:#6F4E37}
@media (prefers-color-scheme:dark){:root{--bg:#1C2230;--tx:#FFFDF8;--oro:#E9C77A}}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;max-width:560px;margin-inline:auto}
h1{font:400 30px/1.1 Georgia,serif}h2{font:400 21px/1.2 Georgia,serif;margin-top:26px;color:var(--oro)}
label.p{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(128,128,128,.2)}
label.p input{margin-top:5px;width:22px;height:22px;flex:none}label.p small{opacity:.75}label.p em{opacity:.7;font-size:13px}
label.p img{width:100%;max-width:220px;border-radius:12px;border:1px solid rgba(128,128,128,.3);margin-top:6px}
figure{margin:14px 0}figure img{width:100%;max-width:390px;border-radius:16px;border:1px solid rgba(128,128,128,.3);display:block}figcaption{font-size:12.5px;opacity:.7}
#cuenta{position:sticky;top:0;background:var(--bg);padding:6px 0;font-weight:600}
</style></head><body>
<h1>Repaso del arreglo del formulario y de RESERVAS</h1>
<p>6-nov. Lanzarote sin Claude, el paso del transporte (el avión, sin «Para moverte»), ACE, el aviso de los 3 días, el coche y el vuelo en RESERVAS, los enlaces de afiliado, «Rutas» en DÍAS y las decisiones de los avisos del viaje.</p>
<div id="cuenta"></div>
<label class="p"><input type="checkbox" data-k="p1"><span><b>✅ Hecho</b> — Lanzarote ya no llama a Claude para elegir los lugares: la ruta de tu viaje sale igual<br><small>Comparado parada a parada y comida a comida con docs/dias/_hoy3_ruta_eric.json: 0 días distintos. Sin llamadas de pago en el registro de la API.</small><br><em>Dónde: No es de móvil</em></span></label><label class="p"><input type="checkbox" data-k="p2"><span><b>✅ Hecho</b> — El paso «¿Cómo quieres llegar a Lanzarote?» desde Barcelona: el avión primero, encendido y con su tiempo, a la vista sin hacer scroll<br><small>Tren, Autobús, Ferry y En tu coche en gris con «Sin ruta»; «Desde Barcelona solo tiene sentido llegar en avión.» y «Ir en avión · Continuar». Igual desde Madrid (arreglo_lz_transporte_madrid_1.jpg).</small><br><em>Dónde: Formulario › Cómo quieres llegar</em><br><a href="capturas_jutrip/arreglo_lz_transporte_barcelona_1.jpg"><img src="capturas_jutrip/arreglo_lz_transporte_barcelona_1.jpg" alt="" loading="lazy"></a></span></label><label class="p"><input type="checkbox" data-k="p3"><span><b>✅ Hecho</b> — Fuera la caja «Para moverte» del formulario<br><small>El coche de alquiler y la base fija se dan por hechos sin enseñarlos; se cambian en RESERVAS.</small><br><em>Dónde: Formulario</em><br><a href="capturas_jutrip/arreglo_lz_transporte_barcelona_1.jpg"><img src="capturas_jutrip/arreglo_lz_transporte_barcelona_1.jpg" alt="" loading="lazy"></a></span></label><label class="p"><input type="checkbox" data-k="p4"><span><b>✅ Hecho</b> — «ACE» en vez de «LAN» en la pantalla de carga y en los chips<br><small>cityCode.ts: lanzarote → ACE. Comprobado en la prueba (no sale «LAN» en ningún sitio del formulario).</small><br><em>Dónde: Pantalla «Trazando tu ruta…»</em></span></label><label class="p"><input type="checkbox" data-k="p5"><span><b>✅ Hecho</b> — «Trazando tu ruta…» ya no espera a Claude<br><small>Antes unos 10 s (lo medido por Eric). Ahora el servidor responde la Fase 1 y los 5 días en milisegundos; ver el informe para las cifras.</small><br><em>Dónde: Pantalla de carga</em></span></label><label class="p"><input type="checkbox" data-k="p6"><span><b>✅ Hecho</b> — El aviso «Tu viaje a Lanzarote empieza en 3 días» sale UNA vez, ya con la ruta abierta; nunca encima de la carga ni del formulario<br><small>La franja de avisos espera a que la ruta esté abierta y sale entonces, una sola vez. Vale para cualquier aviso que llegue mientras se crea el viaje.</small><br><em>Dónde: Al pulsar [Ver mi ruta]</em></span></label><label class="p"><input type="checkbox" data-k="p7"><span><b>✅ Hecho</b> — RESERVAS › Vuelo sin reservar: botón [Buscar vuelos] (BCN → ACE, 8-13 nov, sin el nombre de la web)<br><small>Enlace de afiliado con búsqueda profunda: comprobado que acaba en la búsqueda BCN → ACE con las fechas.</small><br><em>Dónde: RESERVAS › Llegada y vuelta</em><br><a href="capturas_jutrip/arreglo_coche_vuelo_buscar_vuelos.jpg"><img src="capturas_jutrip/arreglo_coche_vuelo_buscar_vuelos.jpg" alt="" loading="lazy"></a></span></label><label class="p"><input type="checkbox" data-k="p8"><span><b>✅ Hecho</b> — RESERVAS › Coche de alquiler sin reserva: [Añadir tu reserva] a la vista, «Desde el PDF, una foto o una captura.», «¿Para quién es?» solo con 2 personas o más<br><small>Con un solo viajero no sale «¿Para quién es?».</small><br><em>Dónde: RESERVAS › Coche de alquiler</em><br><a href="capturas_jutrip/arreglo_coche_bloque_sin_reserva.jpg"><img src="capturas_jutrip/arreglo_coche_bloque_sin_reserva.jpg" alt="" loading="lazy"></a></span></label><label class="p"><input type="checkbox" data-k="p9"><span><b>✅ Hecho</b> — RESERVAS › Coche con la reserva puesta: «Listo», compañía · coche · precio, recogida y devolución<br><small>La hora de recogida cuenta en el día de llegada y la de devolución en el último día (límite de la T1).</small><br><em>Dónde: RESERVAS › Coche de alquiler</em><br><a href="capturas_jutrip/arreglo_coche_bloque_con_reserva.jpg"><img src="capturas_jutrip/arreglo_coche_bloque_con_reserva.jpg" alt="" loading="lazy"></a></span></label><label class="p"><input type="checkbox" data-k="p10"><span><b>✅ Hecho</b> — «Útil para el viaje»: fuera la fila de vuelos y, en Lanzarote, la de alquiler de coche (en Roma se queda)<br><em>Dónde: RESERVAS › Útil para el viaje</em></span></label><label class="p"><input type="checkbox" data-k="p11"><span><b>⚠️ A medias / lo miras tú</b> — Enlaces de afiliado (vuelos, seguro, eSIM, coche) en un solo archivo<br><small>src/lib/enlacesAfiliado.ts. Los cuatro abren bien. DiscoverCars no tiene enlace profundo con destino y fechas: va a la portada con tu código.</small><br><em>Dónde: No es de móvil</em></span></label><label class="p"><input type="checkbox" data-k="p12"><span><b>✅ Hecho</b> — DÍAS de Lanzarote: el trayecto en coche con «Rutas» (hoja de Roma, Google Maps o Apple Maps, en coche, con el nombre y el pueblo de cada parada) y SIN «+5 min para aparcar»<br><small>La hoja abierta, en arreglo_coche_dias_rutas_hoja.jpg.</small><br><em>Dónde: DÍAS › un día con coche</em><br><a href="capturas_jutrip/arreglo_coche_dias_rutas.jpg"><img src="capturas_jutrip/arreglo_coche_dias_rutas.jpg" alt="" loading="lazy"></a></span></label><label class="p"><input type="checkbox" data-k="p13"><span><b>✅ Hecho</b> — Avisos del viaje: «¿Cómo vais?» 1 h tras empezar la comida y como tarde a las 18:30<br><small>Ya era así: sin cambios.</small><br><em>Dónde: HOY por la tarde</em></span></label><label class="p"><input type="checkbox" data-k="p14"><span><b>✅ Hecho</b> — Último aviso del viernes: 16:40, «En media hora tienes que dejar el coche en la T1 (antes de las 17:10).»; fuera el de las 15:17<br><em>Dónde: Notificación del viernes 13</em></span></label><label class="p"><input type="checkbox" data-k="p15"><span><b>✅ Hecho</b> — Fuera la lista roja «X cierra hoy a las…» de HOY<br><em>Dónde: HOY por la mañana</em></span></label><label class="p"><input type="checkbox" data-k="p16"><span><b>⚠️ A medias / lo miras tú</b> — Los compañeros de un viaje compartido reciben los avisos; cada uno puede apagarlos en Ajustes<br><small>Hecho en el servidor. Hay una migración nueva, la 0076, SIN aplicar (solo cambia la mirada barata del planificador): pegar supabase/migrations/0076_avisos_viaje_companeros.sql y comprobar con docs/dias/COMPROBAR_0076.sql.</small><br><em>Dónde: Notificaciones</em></span></label>
<h2>Todas las capturas</h2><figure><img src="capturas_jutrip/arreglo_coche_bloque_con_reserva.jpg" alt="" loading="lazy"><figcaption>arreglo_coche_bloque_con_reserva</figcaption></figure><figure><img src="capturas_jutrip/arreglo_coche_bloque_sin_reserva.jpg" alt="" loading="lazy"><figcaption>arreglo_coche_bloque_sin_reserva</figcaption></figure><figure><img src="capturas_jutrip/arreglo_coche_dias_rutas.jpg" alt="" loading="lazy"><figcaption>arreglo_coche_dias_rutas</figcaption></figure><figure><img src="capturas_jutrip/arreglo_coche_dias_rutas_hoja.jpg" alt="" loading="lazy"><figcaption>arreglo_coche_dias_rutas_hoja</figcaption></figure><figure><img src="capturas_jutrip/arreglo_coche_vuelo_buscar_vuelos.jpg" alt="" loading="lazy"><figcaption>arreglo_coche_vuelo_buscar_vuelos</figcaption></figure><figure><img src="capturas_jutrip/arreglo_lz_transporte_barcelona_1.jpg" alt="" loading="lazy"><figcaption>arreglo_lz_transporte_barcelona_1</figcaption></figure><figure><img src="capturas_jutrip/arreglo_lz_transporte_madrid_1.jpg" alt="" loading="lazy"><figcaption>arreglo_lz_transporte_madrid_1</figcaption></figure>
<script>
(function(){var cs=[].slice.call(document.querySelectorAll('input[data-k]'));var cu=document.getElementById('cuenta');var K='repasoarreglocoche';var s={};
try{s=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
function pinta(){var n=cs.filter(function(c){return c.checked}).length;cu.textContent=n+' de '+cs.length+' comprobados'}
cs.forEach(function(c){c.checked=!!s[c.dataset.k];c.addEventListener('change',function(){s[c.dataset.k]=c.checked;try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}pinta()})});pinta()})();
</script></body></html>
